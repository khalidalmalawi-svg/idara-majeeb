q": ["ما الذي فرض إيجاد مجالات متنوعة للإدارة؟", "فرض ...... في المجتمع إيجاد مجالات متنوعة للإدارة"], "a": "التنوّع في المجتمع؛ حيث أوجد لكل منها مجاله الخاص بالدراسة والممارسة", "true": "فرض التنوّع في المجتمع إيجاد مجالات متنوعة للإدارة، حيث أوجد لكل منها مجاله الخاص بالدراسة والممارسة.", "false": ["فرض التشابه في المجتمع إيجاد مجال واحد للإدارة.", "ليس لكل مجال من مجالات الإدارة مجاله الخاص بالدراسة والممارسة."], "quote": "فرض التنوّع في المجتمع إيجاد مجالات متنوعة للإدارة؛ حيث أوجد لكل منها مجاله الخاص بالدراسة والممارسة.", "locate": "تحت «الهدف الأول» في 1-2"}, {"page": 15, "section": "1-2 مجالات الإدارة", "q": ["ما مجالات الإدارة؟", "كم عدد مجالات الإدارة؟", "من مجالات الإدارة:"], "a": "خمسة مجالات: الإدارة العامة، إدارة الأعمال، إدارة الهيئات والمنظمات المتخصصة، الإدارة الإقليمية والدولية، إدارة المؤسسات العامة", "true": "مجالات الإدارة خمسة: الإدارة العامة، وإدارة الأعمال، وإدارة الهيئات والمنظمات المتخصصة، والإدارة الإقليمية والدولية، وإدارة المؤسسات العامة.", "false": ["مجالات الإدارة ثلاثة فقط: الإدارة العامة وإدارة الأعمال والإدارة الدولية.", "من مجالات الإدارة: الإدارة التنفيذية."], "quote": "مجالات الإدارة ← (1) الإدارة العامة، (2) إدارة الأعمال، (3) إدارة الهيئات والمنظمات المتخصصة، (4) الإدارة الإقليمية والدولية، (5) إدارة المؤسسات العامة", "locate": "شكل «مجالات الإدارة» أسفل الصفحة"}, {"page": 16, "section": "1-2 مجالات الإدارة", "q": ["ما المقصود بالإدارة العامة؟", "ممارسة العملية الإدارية في الأجهزة الإدارية للدولة هي ......", "تعرف الإدارة العامة بأنها ......"], "a": "الإدارة العامة هي ممارسة العملية الإدارية في الأجهزة الإدارية للدولة، وتختص بتنفيذ السياسة العامة للدولة؛ بما يحقق الصالح العام", "true": "الإدارة العامة هي ممارسة العملية الإدارية في الأجهزة الإدارية للدولة، وتختص بتنفيذ السياسة العامة للدولة بما يحقق الصالح العام.", "false": ["الإدارة العامة هي إدارة النشاطات والمشروعات ذات الطابع الاقتصادي الهادف لتحقيق الربح.", "الإدارة العامة هي ممارسة العملية الإدارية في الشركات الخاصة."], "quote": "الإدارة العامّة هي ممارسة العملية الإدارية  الربح في المقام الأول، إضافة إلى إسهامها في خدمة المجتمع.", "false": ["إدارة الأعمال لا تسهم في خدمة المجتمع مطلقًا.", "تسعى إدارة الأعمال إلى خدمة المجتمع في المقام الأول ولا تهدف إلى الربح."], "quote": "وتسعى من خلال أنشطتها التجارية، والصناعية، والزراعية، والتعليمية، والطبية، وغيرها إلى تحقيق الربح في المقام الأول، إضافة إلى إسهامها في خدمة المجتمع.", "locate": "تحت «ثانيًا: إدارة الأعمال»، الفقرة الثانية"}, {"page": 16, "section": "1-2 مجالات الإدارة", "q": ["ما المقصود بإدارة الهيئات والمنظمات المتخصصة؟", "إدارة أوجه النشاط في المنظمات التي تقدم خدماتها إلى فئات خاصة ولا تهدف إلى تحقيق الربح هي ......"], "a": "إدارة الهيئات والمنظمات المتخصصة: تعني بإدارة أوجه النشاط في المنظمات التي تقدم خدماتها إلى فئات خاصة، ولا تهدف إلى تحقيق الربح", "true": "إدارة الهيئات والمنظمات المتخصصة تعني بإدارة أوجه النشاط في المنظمات التي تقدم خدماتها إلى فئات خاصة ولا تهدف إلى تحقيق الربح.", "false": ["إدارة الهيئات والمنظمات المتخصصة تقدم خدماتها إلى فئات خاصة وتهدف إلى تحقيق الربح.", "إدارة الهيئات والمنظمات المتخصصة تقدم خدمات عامة لجميع أفراد المجتمع."], "quote": "وتعني بإدارة أوجه النشاط في المنظمات التي تقدم خدماتها إلى فئات خاصّة، ولا تهدف إلى تحقيق الربح.", "locate": "تحت «ثالثًا: إدارة الهيئات والمنظمات المتخصصة»، التعريف"}, {"page": 16, "section": "1-2 مجالات الإدارة", "q": ["بم يختلف مجال إدارة الهيئات والمنظمات المتخصصة عن الإدارة العامة؟", "الفرق بين إدارة الهيئات المتخصصة والإدارة العامة:"], "a": "في أنه لا يهدف إلى تقديم خدمات عامة؛ إنما يهتم بفئة خاصة من المجتمع", "true": "يختلف مجال إدارة الهيئات والمنظمات المتخصصة عن الإدارة العامة في أنه لا يهدف إلى تقديم خدمات عامة، إنما يهتم بفئة خاصة من المجتمع.", "false": ["يختلف مجال إدارة الهيئات المتخصصة عن الإدارة العامة في أنه يهدف إلى تحقيق الربح.", "مجال إدارة الهيئات المتخصصة يقدم خدمات عامة مثل الإدارة العامة تمامًا."], "quote": "وهذا المجال يختلف عن الإدارة العامة في أنه لا يهدف إلى تقديم خدمات عامة؛ إنما يهتم بفئة خاصّة من المجتمع", "locate": "تحت «ثالثًا»، الفقرة الثانية (المقارنة)"}, {"page": 16, "section": "1-2 مجالات الإدارة", "q": ["بم يختلف مجال إدارة الهيئات والمنظمات المتخصصة عن منظمات الأعمال؟", "إلى أين يوجه دخل الهيئات والمنظمات المتخصصة؟"], "a": "من حيث إنه لا يهدف لتحقيق أرباح بمفهومها العام، إنما يُوجّه دخلها إلى رعاية الفئة الخاصة بها", "true": "تختلف الهيئات والمنظمات المتخصصة عن منظمات الأعمال في أنها لا تهدف لتحقيق أرباح بمفهومها العام، إنما يوجه دخلها إلى رعاية الفئة الخاصة بها.", "false": ["يوجه دخل الهيئات والمنظمات المتخصصة إلى توزيع الأرباح على الملاك.", "تهدف الهيئات والمنظمات المتخصصة لتحقيق أرباح بمفهومها العام مثل منظمات الأعمال."], "quote": "فإنه يختلف عن منظمات الأعمال؛ من حيث إنه لا يهدف لتحقيق أرباح بمفهومها العام، إنما يُوجّه دخلها إلى رعاية الفئة الخاصة بها.", "locate": "تحت «ثالثًا»، نهاية الفقرة الثانية"}, {"page": 16, "section": "1-2 مجالات الإدارة", "q": ["جمعية الأطفال المعوقين مثال على مجال ......", "أي مما يلي مثال على الهيئات والمنظمات المتخصصة؟"], "a": "إدارة الهيئات والمنظمات المتخصصة (ورد شعار جمعية الأطفال المعوقين مثالًا عليها)", "true": "جمعية الأطفال المعوقين مثال على الهيئات والمنظمات المتخصصة.", "false": ["جمعية الأطفال المعوقين مثال على إدارة الأعمال.", "جمعية الأطفال المعوقين مثال على الإدارة الإقليمية والدولية."], "quote": "شعار جمعية الأطفال المعوقين - Disabled Children's Association", "locate": "صورة الشعار أسفل فقرة «ثالثًا: إدارة الهيئات والمنظمات المتخصصة»"}, {"page": 17, "section": "1-2 مجالات الإدارة", "q": ["بم يختص مجال الإدارة الإقليمية والدولية؟", "ما المقصود بالإدارة الإقليمية والدولية؟", "يختص بإدارة المنظمات التي لها الصفة الإقليمية أو الدولية التي لا تتبع أيًّا من الحكومات مجال ......"], "a": "يختص بإدارة المنظمات التي لها الصفة الإقليمية أو الدولية التي لا تتبع أيًّا من الحكومات التي تنشأ في دولها، وتهدف إلى خدمة المجتمع الإقليمي أو العالمي أو جزء منه مستعينة بالإمكانات التي تقدمها الدول المشاركة", "true": "تختص الإدارة الإقليمية والدولية بإدارة المنظمات ذات الصفة الإقليمية أو الدولية التي لا تتبع أيًّا من الحكومات التي تنشأ في دولها.", "false": ["تختص الإدارة الإقليمية والدولية بإدارة منظمات تتبع حكومة الدولة التي تنشأ فيها.", "تعتمد المنظمات الإقليمية والدولية على أرباحها التجارية فقط دون إمكانات الدول المشاركة."], "quote": "يختص هذا المجال بإدارة المنظمات التي لها الصفة الإقليمية، أو الدّولية التي لا تتبع أيًّا من الحكومات التي تنشأ في دولها", "locate": "تحت «رابعًا: الإدارة الإقليمية والدولية»"}, {"page": 17, "section": "1-2 مجالات الإدارة", "q": ["إلى ماذا تهدف المنظمات الإقليمية والدولية؟", "بم تستعين المنظمات الإقليمية والدولية لتحقيق أهدافها؟"], "a": "تهدف إلى خدمة المجتمع الإقليمي أو العالمي أو جزء منه، مستعينة بالإمكانات التي تقدمها الدول المشاركة", "true": "تهدف المنظمات الإقليمية والدولية إلى خدمة المجتمع الإقليمي أو العالمي أو جزء منه مستعينة بالإمكانات التي تقدمها الدول المشاركة.", "false": ["تهدف المنظمات الإقليمية والدولية إلى خدمة مجتمع دولة واحدة فقط.", "تستعين المنظمات الإقليمية والدولية بإمكانات الشركات الخاصة فقط."], "quote": "وتهدف إلى خدمة المجتمع الإقليمي أو العالمي، أو جزء منه مستعينة بالإمكانات التي تقدّمها الدول المشاركة.", "locate": "تحت «رابعًا: الإدارة الإقليمية والدولية»، تكملة الفقرة"}, {"page": 17, "section": "1-2 مجالات الإدارة", "q": ["مجلس التعاون لدول الخليج العربية مثال على مجال ......", "أي مما يلي مثال على الإدارة الإقليمية؟"], "a": "الإدارة الإقليمية والدولية", "true": "مجلس التعاون لدول الخليج العربية مثال على الإدارة الإقليمية والدولية.", "false": ["مجلس التعاون لدول الخليج العربية مثال على إدارة الأعمال.", "مجلس التعاون لدول الخليج العربية مثال على إدارة المؤسسات العامة."], "quote": "صورة: شعار مجلس التعاون لدول الخليج العربية", "locate": "صورة الشعار أسفل فقرة «رابعًا: الإدارة الإقليمية والدولية»"}, {"page": 17, "section": "1-2 مجالات الإدارة", "q": ["ما المقصود بالمؤسسات العامة؟", "المؤسسات العامة هي مرفق عام يخدم ......", "هل تحقيق الربح هو الهدف الرئيس للمؤسسات العامة؟"], "a": "المؤسسات العامة هي مرفق عام يخدم الصالح العام للدولة، ويخضع لسلطتها، وتسير وفقًا لتوجهاتها، ولا يعد تحقيق الربح الهدف الرئيس لها", "true": "المؤسسات العامة مرفق عام يخدم الصالح العام للدولة ويخضع لسلطتها ويسير وفقًا لتوجهاتها، ولا يعد تحقيق الربح الهدف الرئيس لها.", "false": ["المؤسسات العامة تهدف إلى تحقيق الربح بوصفه هدفها الرئيس.", "المؤسسات العامة لا تخضع لسلطة الدولة."], "quote": "المؤسسات العامة هي مرفق عام يخدم الصالح العام للدولة، ويخضع لسلطتها، وتسير وفقًا لتوجهاتها، ولا يعد تحقيق الربح الهدف الرئيس لها.", "locate": "تحت «خامسًا: إدارة المؤسسات العامة»، التعريف"}, {"page": 17, "section": "1-2 مجالات الإدارة", "q": ["بم تتسم الأجهزة التي أنشأتها الدول وفق المنهج الجديد في الإدارة (المؤسسات العامة)؟", "لماذا منحت المؤسسات العامة الشخصية المعنوية؟", "تمثلت الأجهزة القادرة على ممارسة أنشطتها والمتسمة بالمرونة في اتخاذ قراراتها في ......"], "a": "تتسم بالمرونة في اتخاذ قراراتها، وتمثلت في المؤسسات العامة التي مُنحت الشخصية المعنوية بغرض تحقيق أكبر قدر من الكفاءة والفعالية", "true": "المؤسسات العامة أجهزة تتسم بالمرونة في اتخاذ قراراتها، ومُنحت الشخصية المعنوية بغرض تحقيق أكبر قدر من الكفاءة والفعالية.", "false": ["المؤسسات العامة أجهزة تتسم بالجمود في اتخاذ قراراتها.", "منحت المؤسسات العامة الشخصية المعنوية بغرض تحقيق أكبر قدر من الأرباح."], "quote": "وتتسم بالمرونة في اتخاذ قراراتها، وتمثّلت هذه الأجهزة في المؤسسات العامة التي مُنحت الشخصية المعنوية؛ بغرض تحقيق أكبر قدر من الكفاءة والفعالية.", "locate": "تحت «خامسًا: إدارة المؤسسات العامة»، تكملة الفقرة"}, {"page": 17, "section": "1-2 مجالات الإدارة", "q": ["المؤسسة العامة للتأمينات الاجتماعية مثال على مجال ......", "أي مما يلي مثال على المؤسسات العامة؟"], "a": "إدارة المؤسسات العامة", "true": "المؤسسة العامة للتأمينات الاجتماعية مثال على إدارة المؤسسات العامة.", "false": ["المؤسسة العامة للتأمينات الاجتماعية مثال على الإدارة الإقليمية والدولية.", "المؤسسة العامة للتأمينات الاجتماعية مثال على إدارة الأعمال."], "quote": "صورة: شعار المؤسسة العامة للتأمينات الاجتماعية - General Organization for Social Insurance", "locate": "صورة الشعار أسفل فقرة «خامسًا: إدارة المؤسسات العامة»"}, {"page": 18, "section": "1-2 مجالات الإدارة", "q": ["شركة أرامكو تمثل مجال ......", "جمعية إنسان تمثل مجال ......", "مجلس التعاون الخليجي يمثل مجال ......"], "a": "من سؤال الربط في التقويم: شركة أرامكو ← إدارة الأعمال، جمعية إنسان ← إدارة المنظمات والهيئات المتخصصة، مجلس التعاون الخليجي ← الإدارة الإقليمية", "true": "مجلس التعاون الخليجي مثال على الإدارة الإقليمية، وشركة أرامكو مثال على إدارة الأعمال، وجمعية إنسان مثال على المنظمات والهيئات المتخصصة.", "false": ["شركة أرامكو مثال على إدارة المنظمات والهيئات المتخصصة.", "جمعية إنسان مثال على الإدارة الإقليمية."], "quote": "1 الإدارة الإقليمية | ( ) شركة أرامكو 2 إدارة المنظمات والهيئات المتخصصة | ( ) وزارة الاقتصاد والتخطيط 3 إدارة الأعمال | ( ) مجلس التعاون الخليجي", "locate": "تقويم 1-2، سؤال الربط بين القائمتين (الإجابة مستنتجة من تعريفات ص16–17)"}, {"page": 19, "section": "1-3 المهارات الإدارية", "q": ["من أهم العناصر المؤثرة في إدارة المنظمات والمعنيون بالتعامل مع تحدياتها:", "يشكل ...... أحد أهم العناصر المؤثرة في إدارة المنظمات"], "a": "المديرون", "true": "تواجه المنظمات في العصر الراهن العديد من التحديات، ويشكل المديرون أحد أهم العناصر المؤثرة في إدارتها والمعنيين بالتعامل مع هذه التحديات.", "false": ["لا تواجه المنظمات في العصر الراهن أي تحديات أو صعوبات.", "يشكل العملاء أحد أهم العناصر المؤثرة في إدارة المنظمات والمعنيين بالتعامل مع تحدياتها."], "quote": "تواجه المنظمات في العصر الراهن العديد من التحديات والصعوبات، ويشكل المديرون أحد أهم العناصر المؤثرة في إدارة هذه المنظمات", "locate": "مقدمة الموضوع 1-3، الفقرة الأولى"}, {"page": 19, "section": "1-3 المهارات الإدارية", "q": ["نجاح المنظمات أو فشلها مرهون بدرجة كبيرة بـ ......", "علام يتوقف نجاح المنظمات أو فشلها؟"], "a": "بمدى تمتع المديرين بالمهارات الإدارية المناسبة لطبيعة الأدوار التي يؤدونها في مختلف المواقع والمستويات التنظيمية", "true": "نجاح المنظمات أو فشلها مرهون بدرجة كبيرة بمدى تمتع المديرين بالمهارات الإدارية المناسبة لطبيعة أدوارهم.", "false": ["نجاح المنظمات أو فشلها لا علاقة له بالمهارات الإدارية للمديرين.", "نجاح المنظمات مرهون بحجم رأس مالها فقط."], "quote": "أن نجاح المنظمات أو فشلها مرهون بدرجة كبيرة بمدى تمتع المديرين بالمهارات الإدارية المناسبة لطبيعة الأدوار التي يؤدونها", "locate": "مقدمة الموضوع 1-3، الفقرة الثانية"}, {"page": 19, "section": "1-3 المهارات الإدارية", "q": ["متى يتجدد ويطرح سؤال «هل الإدارة علم أم مهارة؟»", "سؤال «هل الإدارة علم أم مهارة» يطرح في حال بروز قائد إداري ......"], "a": "في حال بروز قائد إداري دون أن يكون لديه مؤهل علمي في مجال الإدارة", "true": "يتجدد سؤال «هل الإدارة علم أم مهارة؟» في حال بروز قائد إداري دون أن يكون لديه مؤهل علمي في مجال الإدارة.", "false": ["يطرح سؤال «هل الإدارة علم أم مهارة؟» فقط عند حصول المدير على الدكتوراه في الإدارة.", "لم يطرح سؤال «هل الإدارة علم أم مهارة؟» إلا مرة واحدة."], "quote": "سؤال يتجدد ويُطرح في كل مناسبة في حال بروز قائد إداري دون أن يكون لديه مؤهلًا علميًا في مجال الإدارة.", "locate": "تحت «الهدف الأول» في 1-3"}, {"page": 19, "section": "1-3 المهارات الإدارية", "q": ["التنبؤ في الإدارة قائم على ......", "التنبؤ في الإدارة من المهام ...... في معظم وظائف الإدارة"], "a": "التنبؤ من المهام الرئيسة في معظم وظائف الإدارة، وهو قائم على الأسلوب العلمي بعيدًا عن الآراء الشخصية والتخمين", "true": "التنبؤ في الإدارة من المهام الرئيسة في معظم وظائف الإدارة، وهو قائم على الأسلوب العلمي بعيدًا عن الآراء الشخصية والتخمين.", "false": ["التنبؤ في الإدارة قائم على الآراء الشخصية والتخمين.", "التنبؤ في الإدارة من المهام الثانوية التي لا تحتاجها وظائف الإدارة."], "quote": "التنبؤ في الإدارة من المهام الرئيسة في معظم وظائف الإدارة، وهو تنبؤ قائم على الأسلوب العلمي بعيدًا عن الآراء الشخصية والتخمين.", "locate": "تحت «مفهوم الإدارة بصفتها علمًا»، الفقرة الأولى"}, {"page": 19, "section": "1-3 المهارات الإدارية", "q": ["لماذا يعد بعض المهتمين الإدارة علمًا؟", "يعد بعض المهتمين بعلم الإدارة أن الإدارة علم لأنها تقوم على ......"], "a": "لأنها تقوم على مجموعة متكاملة من الأسس والمفاهيم والمبادئ العلمية التي اختبرت وثبت صحتها، وتحوي نظريات علمية ومبادئ تطبيقية تدرس في كليات متخصصة", "true": "يعد بعض المهتمين الإدارة علمًا لأنها تقوم على مجموعة متكاملة من الأسس والمفاهيم والمبادئ العلمية التي اختبرت وثبت صحتها.", "false": ["الإدارة هي علم فقط؛ لأنها مجموعة متكاملة من الأسس والمفاهيم والمبادئ العلمية التي اختبرت وثبت صحتها.", "يعد أنصار الإدارة كعلم أنها تقوم على خصائص الأشخاص وقدراتهم."], "quote": "يعدُّ بعض المهتمين بعلم الإدارة أن الإدارة علم لأنها تقوم على مجموعة متكاملة من الأسس والمفاهيم والمبادئ العلمية التي اختبرت وثبت صحتها", "locate": "تحت «مفهوم الإدارة بصفتها علمًا»، الفقرة الثانية (والعبارة الخاطئة من تقويم ص22)"}, {"page": 19, "section": "1-3 المهارات الإدارية", "q": ["بم يعلل أنصار الإدارة كعلم رأيهم؟", "الإدارة أصبحت تضم العديد من ......"], "a": "بما تحويه الإدارة من نظريات علمية ومبادئ تطبيقية تدرّس في كليات متخصصة، بل أصبحت تضم العديد من فروع المعرفة والتخصصات الفرعية", "true": "يعلل أنصار الإدارة كعلم رأيهم بما تحويه من نظريات علمية ومبادئ تطبيقية تدرس في كليات متخصصة، وبأنها أصبحت تضم العديد من فروع المعرفة والتخصصات الفرعية.", "false": ["لا تدرس نظريات الإدارة في كليات متخصصة.", "الإدارة لا تضم أي فروع معرفة أو تخصصات فرعية."], "quote": "ويعللون ذلك بما تحويه الإدارة من نظريات علمية ومبادئ تطبيقية تُدرّس في كليات متخصصة؛ بل إن الإدارة أصبحت تضم العديد من فروع المعرفة والتخصصات الفرعية", "locate": "تحت «مفهوم الإدارة بصفتها علمًا»، الفقرة الثانية"}, {"page": 19, "section": "1-3 المهارات الإدارية", "q": ["كيف تستخدم الإدارة الأسلوب العلمي في ممارسة وظائفها (عند أنصار الإدارة كعلم)؟", "تحتاج الإدارة إلى الأسلوب العلمي من خلال ملاحظة الظواهر والمشكلات الإدارية وتفسيرها والتنبؤ بحدوثها من أجل ......"], "a": "من خلال ملاحظة الظواهر والمشكلات الإدارية، وتفسيرها، والتنبؤ بحدوثها من أجل التحكم بها، أو على الأقل التكيف معها", "true": "الإدارة في نظر أنصار الإدارة كعلم تحتاج إلى الأسلوب العلمي من خلال ملاحظة الظواهر والمشكلات الإدارية وتفسيرها والتنبؤ بحدوثها من أجل التحكم بها أو التكيف معها.", "false": ["تتجاهل الإدارة كعلم ملاحظة الظواهر والمشكلات الإدارية.", "الهدف من التنبؤ بحدوث المشكلات الإدارية هو تجاهلها."], "quote": "فالإدارة في نظرهم تحتاج إلى الأسلوب العلمي في ممارسة وظائفها من خلال ملاحظة الظواهر والمشكلات الإدارية، وتفسيرها، والتّنبؤ بحدوثها من أجل التحكم بها، أو على الأقل التكيف معها.", "locate": "تحت «مفهوم الإدارة بصفتها علمًا»، نهاية الفقرة الثانية"}, {"page": 20, "section": "1-3 المهارات الإدارية", "q": ["علام يعتمد النجاح في تطبيق مبادئ وقواعد الإدارة عند الفريق الذي يرى أن الإدارة مهارة؟", "يرى فريق أن الإدارة تعتمد على ...... وليست علمًا"], "a": "يعتمد بالدرجة الأولى على خصائص الأشخاص، وهم يختلفون فيما بينهم بحسب إمكاناتهم وقدراتهم", "true": "يرى الفريق القائل بأن الإدارة مهارة أن النجاح في تطبيق مبادئ وقواعد الإدارة يعتمد بالدرجة الأولى على خصائص الأشخاص.", "false": ["يرى الفريق القائل بأن الإدارة مهارة أن الإعداد العلمي وحده يضمن وجود الأشخاص الإداريين الناجحين.", "يرى الفريق القائل بأن الإدارة مهارة أن النجاح يعتمد على النظريات العلمية المتعمقة فقط."], "quote": "أنّ النجاح في تطبيق مبادئ وقواعد الإدارة يعتمد بالدرجة الأولى على خصائص الأشخاص، وهم يختلفون فيما بينهم بحسب إمكاناتهم وقدراتهم", "locate": "تحت «مفهوم الإدارة بصفتها مهارة»، الفقرة الأولى"}, {"page": 20, "section": "1-3 المهارات الإدارية", "q": ["هل يضمن الإعداد العلمي وحده وجود الأشخاص الإداريين الناجحين (عند أنصار الإدارة مهارة)؟", "بم يستدل أنصار الإدارة كمهارة على رأيهم؟"], "a": "لا؛ فالإعداد العلمي وحده لا يضمن وجود الأشخاص الإداريين الناجحين، مشيرين إلى أمثلة للنجاح الكبير الذي حققه الكثير من الأشخاص دون الالتحاق بالكليات أو المعاهد المتخصصة أو دراسة النظريات الإدارية المتعمقة", "true": "يرى أنصار الإدارة كمهارة أن الإعداد العلمي وحده لا يضمن وجود الأشخاص الإداريين الناجحين.", "false": ["يرى أنصار الإدارة كمهارة أن النجاح الإداري مستحيل دون الالتحاق بالكليات المتخصصة.", "يرى أنصار الإدارة كمهارة أن الإعداد العلمي وحده يضمن النجاح الإداري."], "quote": "فالإعداد العلمي وحده لا يضمن وجود الأشخاص الإداريين الناجحين؛ مشيرين إلى العديد من الأمثلة للنجاح الكبير الذي حققه الكثير من الأشخاص", "locate": "تحت «مفهوم الإدارة بصفتها مهارة»، الفقرة الأولى"}, {"page": 20, "section": "1-3 المهارات الإدارية", "q": ["ما رأي الفريق الثالث في الإدارة (علم أم مهارة)؟", "حاول الفريق الثالث التوفيق بين رأيي ......", "كم عدد الآراء (الفرق) في الإدارة هل هي علم أم مهارة؟"], "a": "ثلاثة آراء: علم، مهارة، وفريق ثالث وفّق بينهما؛ يرى أن الإداري الناجح لابد له من الإلمام بالأسس والمفاهيم والمبادئ العلمية للإدارة، بالإضافة إلى اكتساب المهارات الإدارية من خلال الممارسة والتجارب والخبرات المختلفة مع مرور الوقت", "true": "ظهر فريق ثالث يرى أن الإداري الناجح لابد له من الإلمام بالأسس والمبادئ العلمية للإدارة، بالإضافة إلى اكتساب المهارات الإدارية من خلال الممارسة والتجارب والخبرات.", "false": ["يرى الفريق الثالث أن الإدارة علم فقط ولا تحتاج إلى مهارة.", "يرى الفريق الثالث أن المهارات الإدارية لا يمكن اكتسابها بالممارسة."], "quote": "ظهر فريق ثالث حاول التوفيق بين هذين الرأيين حيث يرى أن الإداري الناجح لابد له من الإلمام بالأسس والمفاهيم والمبادئ العلمية للإدارة", "locate": "تحت «مفهوم الإدارة بصفتها مهارة»، الفقرة الثانية"}, {"page": 20, "section": "1-3 المهارات الإدارية", "q": ["كيف يكتسب الإداري المهارات الإدارية؟", "يمكن اكتساب المهارات الإدارية من خلال ......"], "a": "من خلال الممارسة، والتجارب والخبرات المختلفة مع مرور الوقت", "true": "يمكن للإداري أن يكتسب المهارات الإدارية من خلال الممارسة والتجارب والخبرات المختلفة مع مرور الوقت.", "false": ["لا يمكن اكتساب المهارات الإدارية إلا بالوراثة.", "تكتسب المهارات الإدارية دفعة واحدة دون الحاجة إلى مرور الوقت."], "quote": "اكتسابه للمهارات الإدارية التي يمكن أن يكتسبها من خلال الممارسة، والتجارب والخبرات المختلفة مع مرور الوقت.", "locate": "نهاية فقرة الفريق الثالث"}, {"page": 20, "section": "1-3 المهارات الإدارية", "q": ["هل يمكن الاستفادة من المهارات الإدارية في الحياة الخاصة؟", "المهارات الإدارية لها علاقة بـ ......"], "a": "نعم؛ المهارات الإدارية من المهارات المهمة التي لها علاقة بحياة الإنسان، ويمكن أن نستفيد منها في حياتنا الخاصة والعامة على حد سواء", "true": "المهارات الإدارية لها علاقة بحياة الإنسان، ويمكن أن نستفيد منها في حياتنا الخاصة والعامة على حد سواء.", "false": ["المهارات الإدارية يستفاد منها في الحياة العامة فقط ولا علاقة لها بالحياة الخاصة.", "المهارات الإدارية لا علاقة لها بحياة الإنسان."], "quote": "من المهارات المهمة التي لها علاقة بحياة الإنسان، ويمكن أن نستفيد منها في حياتنا الخاصة والعامة على حد سواء", "locate": "تحت «الهدف الثاني» في 1-3، الفقرة الأولى"}, {"page": 20, "section": "1-3 المهارات الإدارية", "q": ["من أمثلة الحاجة إلى مهارة التخطيط:", "هل التخطيط يكون في مرحلة ما بعد الدراسة فقط؟"], "a": "مهارة التخطيط مهمة للجميع؛ فأنت تحتاج للتخطيط للقيام برحلة، أو للاستعداد للاختبارات، أو لما تريد أن تكون عليه في المستقبل (فلا يقتصر على ما بعد الدراسة)", "true": "مهارة التخطيط مهمة للجميع، فأنت تحتاج للتخطيط للقيام برحلة أو للاستعداد للاختبارات أو لما تريد أن تكون عليه في المستقبل.", "false": ["التخطيط يكون في مرحلة ما بعد الدراسة فقط، ولا يكون قبل ذلك.", "مهارة التخطيط لا يحتاجها إلا المديرون في المنظمات."], "quote": "فمهارة التخطيط لا يخفى مدى أهميتها للجميع؛ فأنت تحتاج للتخطيط للقيام برحلة، أو التخطيط للاستعداد للاختبارات", "locate": "تحت «الهدف الثاني» في 1-3 (والعبارة الخاطئة من تقويم ص22)"}, {"page": 20, "section": "1-3 المهارات الإدارية", "q": ["متى تحتاج مهارة حل المشكلات واتخاذ القرارات؟", "من أمثلة المواقف التي تتطلب الاختيار بين عدة بدائل:", "من الأمثلة على المهارات الإدارية التوجيه و......"], "a": "في المواقف التي تتطلب الاختيار بين عدة بدائل؛ مثل شراء سلعة معينة، واختيار تخصص في الدراسة. (ومن المهارات أيضًا التنظيم والتوجيه والرقابة)", "true": "من الأمثلة على المهارات الإدارية التوجيه وحل المشكلات، وتحتاج مهارة حل المشكلات واتخاذ القرارات في المواقف التي تتطلب الاختيار بين عدة بدائل.", "false": ["شراء سلعة معينة واختيار تخصص في الدراسة لا يتطلبان مهارة اتخاذ القرار.", "حل المشكلات ليس من المهارات الإدارية."], "quote": "وكذلك مهارة التوجيه والرقابة، وحل المشكلات و اتخاذ القرارات في العديد من المواقف التي تتطلب منك الاختيار بين عدة بدائل؛ مثل شراء سلعة معينة، اختيار تخصص في الدراسة", "locate": "تحت «الهدف الثاني» في 1-3 (والعبارة الصحيحة من تقويم ص22)"}, {"page": 20, "section": "1-3 المهارات الإدارية", "q": ["ما فوائد دراسة مهارات السكرتارية والعمل المكتبي؟", "عند دراستك لمهارات السكرتارية والعمل المكتبي فإنك تتمكن من ......"], "a": "تنظيم أوراقك وكتبك والوثائق والملفات التي تحتفظ بها، ومساعدة أفراد أسرتك في أعمالهم المكتبية، وإتقان مهارات الاتصال مع الآخرين، والتهيئة للعمل المكتبي في المؤسسات العامة أو الخاصة", "true": "عند لتنظيم ← التوجيه ← الرقابة ← الاتصال ← السكرتارية ← إدارة المشروعات الصغيرة", "locate": "الشكل أعلى الصفحة بعد عبارة «إذًا سيتناول هذا المقرر»"}, {"page": 21, "section": "1-3 المهارات الإدارية", "q": ["إدارة المشروعات الصغيرة من ......", "أي مما يلي من المهارات الإدارية؟"], "a": "إدارة المشروعات الصغيرة والسكرتارية والاتصال من المهارات الإدارية التي يتناولها المقرر", "true": "إدارة المشروعات الصغيرة من المهارات الإدارية.", "false": ["إدارة المشروعات الصغيرة من مجالات الإدارة الخمسة.", "السكرتارية من مستويات الإدارة."], "quote": "مهارة السكرتارية | | | مهارة إدارة المشروعات الصغيرة", "locate": "الشكل وجدول تقييم المهارات في الصفحة"}, {"page": 25, "section": "الفصل الثاني: مهارة التخطيط", "q": ["ما مواضيع الفصل الثاني (مهارة التخطيط)؟", "يتناول فصل مهارة التخطيط الموضوعات الآتية ......", "أي مما يلي ليس من مواضيع فصل مهارة التخطيط؟"], "a": "التخطيط (المفهوم، الأهمية) - أنواع التخطيط - عناصر التخطيط - خطوات التخطيط", "true": "مواضيع فصل مهارة التخطيط: التخطيط (المفهوم والأهمية)، وأنواع التخطيط، وعناصر التخطيط، وخطوات التخطيط.", "false": ["مواضيع فصل مهارة التخطيط: التخطيط، وأنواع التخطيط، وعناصر التنظيم، وخطوات التخطيط.", "يتكون فصل مهارة التخطيط من ثلاثة مواضيع فقط."], "quote": "1. التخطيط (المفهوم، الأهمية) 2. أنواع التخطيط 3. عناصر التخطيط 4. خطوات التخطيط", "locate": "صفحة عنوان الفصل الثاني، قائمة المواضيع"}, {"page": 26, "section": "2-1 التخطيط (المفهوم، الأهمية)", "q": ["ما أولى المهارات الإدارية؟", "أولى المهارات الإدارية التي يتناولها الكتاب هي ......", "تعد ...... أولى المهارات الإدارية."], "a": "التخطيط", "true": "أولى المهارات الإدارية هي التخطيط.", "false": ["أولى المهارات الإدارية هي التنظيم.", "أولى المهارات الإدارية هي الرقابة."], "quote": "سنتناول بداية من هذا الموضوع بتناول أولى المهارات الإدارية؛ وهي التخطيط", "locate": "مقدمة موضوع 2-1، الفقرة الأولى"}, {"page": 26, "section": "2-1 التخطيط (المفهوم، الأهمية)", "q": ["يعد التخطيط أحد أهم أسباب النجاح لـ ......", "التخطيط من أهم أسباب النجاح للأفراد والمنظمات والدول (صح أم خطأ)"], "a": "للأفراد والمنظ صر التخطيط", "q": ["إلام تشير عناصر التخطيط؟", "عرف عناصر التخطيط.", "تشير عناصر التخطيط إلى جميع العناصر التي تدخل في عملية تحديد ......"], "a": "جميع العناصر التي تدخل في عملية تحديد مهمة المنظمة وقيمها، وتوثيقها من خلال إطار عمل محدد جيدا يحدد الأولويات", "true": "تشير عناصر التخطيط إلى جميع العناصر التي تدخل في عملية تحديد مهمة المنظمة وقيمها، وتوثيقها من خلال إطار عمل محدد جيدا يحدد الأولويات.", "false": ["تشير عناصر التخطيط إلى العناصر التي تدخل في تنفيذ العمل فقط دون تحديد مهمة المنظمة.", "تشير عناصر التخطيط إلى إطار عمل غير محدد لا يحدد الأولويات."], "quote": "تشير عناصر التخطيط إلى جميع العناصر التي تدخل في عملية تحديد مهمة المنظمة وقيمها، وتوثيقها من خلال إطار عمل محدد جيدًا يحدد الأولويات", "locate": "تحت عنوان «عناصر التخطيط»، الفقرة التعريفية"}, {"page": 34, "section": "2-3 عناصر التخطيط", "q": ["ما الذي يطور من خلال عناصر التخطيط؟", "من خلال عناصر التخطيط يطور وضع أهداف المنظمة و...... و......"], "a": "وضع أهداف المنظمة (طويلة/متوسطة/قصيرة الأجل)، واتخاذ القرارات المناسبة، والاستغلال الأمثل للموارد", "true": "من خلال عناصر التخطيط يطور وضع أهداف المنظمة، واتخاذ القرارات المناسبة، والاستغلال الأمثل للموارد.", "false": ["من خلال عناصر التخطيط يطور وضع الأهداف قصيرة الأجل فقط.", "من خلال عناصر التخطيط يتم هدر الموارد."], "quote": "ومن خلالها يُطور وضع أهداف المنظمة (طويلة/متوسطة/قصيرة الأجل)، واتخاذ القرارات المناسبة، والاستغلال الأمثل للموارد", "locate": "تحت عنوان «عناصر التخطيط»، نهاية الفقرة التعريفية"}, {"page": 34, "section": "2-3 عناصر التخطيط", "q": ["ما أول عناصر التخطيط؟", "العنصر الرابع (الأخير) من عناصر التخطيط هو ......", "ما ترتيب عناصر التخطيط؟"], "a": "الأول: الأهداف، ثم السياسات، ثم القواعد، والرابع: الإجراءات", "true": "أول عناصر التخطيط الأهداف، وآخرها الإجراءات.", "false": ["أول عناصر التخطيط السياسات.", "آخر عناصر التخطيط القواعد."], "quote": "01 الأهداف ← 02 السياسات ← 03 القواعد ← 04 الإجراءات", "locate": "الرسم في آخر الصفحة (ترتيب العناصر 01-04)"}, {"page": 35, "section": "2-3 عناصر التخطيط", "q": ["عرف الأهداف (كعنصر من عناصر الت , "true": "خطوة التنفيذ تختص بوضع البديل الذي اعتمد موضع التنفيذ الفعلي.", "false": ["خطوة جمع المعلومات تختص بوضع البديل الذي اعتمد موضع التنفيذ الفعلي.", "خطوة التنفيذ تختص بالبحث عن البدائل المتاحة."], "quote": "وهذه الخطوة تختص بوضع البديل الذي اعتُمِد موضع التنفيذ الفعلي", "locate": "الخطوة الخامسة «التنفيذ»"}, {"page": 41, "section": "2-4 خطوات التخطيط", "q": ["ماذا يأتي بعد البدء بتنفيذ البديل؟", "بعد البدء بالتنفيذ تأتي مرحلة تقويم النتائج للمطابقة بين ......"], "a": "مرحلة تقويم النتائج للمطابقة بين المخطط والمنفذ", "true": "بعد البدء بتنفيذ البديل تأتي مرحلة تقويم النتائج للمطابقة بين المخطط والمنفذ.", "false": ["بعد البدء بالتنفيذ تأتي مرحلة جمع المعلومات.", "تقويم النتائج يهدف للمطابقة بين الأهداف والسياسات."], "quote": "وبعد البدء بتنفيذه تأتي مرحلة تقويم النتائج للمطابقة بين المخطط والمنفذ", "locate": "الخطوة الخامسة «التنفيذ»"}, {"page": 41, "section": "2-4 خطوات التخطيط", "q": ["ما أهمية التقويم في التخطيط؟", "التقويم يعد خطوة ...... من خطوات التخطيط الفعال", "متى يجرى التقويم؟", "يجرى التقويم في نهاية الخطة فقط (صح أم خطأ)"], "a": "التقويم خطوة أساسية من خطوات التخطيط الفعال، ويجرى مع كل خطوة من خطوات التخطيط لتصحيح الانحرافات في حينها، ثم تقويم النتائج التي تحققت", "true": "التقويم يعد خطوة أساسية من خطوات التخطيط الفعال، ويجرى مع كل خطوة من خطوات التخطيط؛ لتصحيح الانحرافات في حينها.", "false": ["يجرى التقويم في نهاية الخطة فقط.", "التقويم خطوة ثانوية في التخطيط الفعال."], "quote": "تنويه: التقويم يعد خطوة أساسية من خطوات التخطيط الفعال، ويُجرى التقويم مع كل خطوة من خطوات التخطيط؛ وذلك لتصحيح الانحرافات في حينها", "locate": "«تنويه» بعد خطوة التنفيذ"}, {"page": 46, "section": "الفصل الثالث: مهارة التنظيم (صفحة افتتاح الفصل)", "q": ["ما مواضيع الفصل الثالث «مهارة التنظيم»؟", "يتناول الفصل الثالث مهارة التنظيم ثلاثة مواضيع هي ......", "ما عنوان الفصل الثالث؟"], "a": "الفصل الثالث: مهارة التنظيم، ومواضيعه: 1) التنظيم (المفهوم، الأهمية) 2) التنظيم (الأنواع، المبادئ) 3) التصميم التنظيمي", "true": "مواضيع الفصل الثالث (مهارة التنظيم) هي: التنظيم (المفهوم، الأهمية)، والتنظيم (الأنواع، المبادئ)، والتصميم التنظيمي.", "false": ["مواضيع الفصل الثالث (مهارة التنظيم) هي: التنظيم (المفهوم، الأهمية)، والتنظيم (الأنواع، المبادئ)، والتخطيط الاستراتيجي.", "يتناول الفصل الثالث مهارة التنظيم في موضوعين فقط."], "quote": "مهارة التنظيم المواضيع: 1. التنظيم (المفهوم، الأهمية). 2. التنظيم (الأنواع، المبادئ). 3. التصميم التنظيمي.", "locate": "صفحة افتتاح الفصل، قائمة المواضيع"}, {"page": 47, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["مم يتكون الجهاز الإداري في المدرسة؟", "يتكون الجهاز الإداري للمدرسة من ......", "أي مما يلي من الجهاز الإداري للمدرسة؟"], "a": "مدير المدرسة، ووكيل أو وكلاء المدرسة، والكاتب الإداري", "true": "تتكون المدرسة من جهاز إداري (مدير المدرسة، ووكيل أو وكلاء المدرسة، الكاتب الإداري)، ومشرفين ومعلمين وموجه طلابي ومحضري مختبرات، وطلاب.", "false": ["يتكون الجهاز الإداري للمدرسة من المعلمين والطلاب فقط.", "الموجه الطلابي ومحضرو المختبرات هم الجهاز الإداري للمدرسة."], "quote": "هذه المدرسة تتكون من جهاز إداري (مدير المدرسة، ووكيل أو وكلاء المدرسة، الكاتب الإداري)، ومشرفين ومعلمين وموجه طلابي ومحضري مختبرات، وطلاب", "locate": "تحت «تأمل بيئة المدرسة التي أنت فيها الآن»"}, {"page": 47, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["ماذا يعني أداء الأدوار في المدرسة أداءً صحيحًا؟", "أداء الأدوار أداءً صحيحًا يعني أن هناك ...... صحيحًا في المدرسة", "هل دور المدير في المدرسة مماثل لدور المدرس والطالب؟"], "a": "يعني أن هناك «تنظيمًا» صحيحًا في المدرسة تعود آثاره الإيجابية على العملية التعليمية؛ ولكل فرد دوره المحدد (دور المدير يختلف عن دور المدرس والطالب)", "true": "أداء الأدوار أداءً صحيحًا يعني أن هناك تنظيمًا صحيحًا في المدرسة تعود آثاره الإيجابية على العملية التعليمية.", "false": ["أداء الأدوار أداءً صحيحًا يعني أن هناك تخطيطًا صحيحًا في المدرسة.", "دور المدير في المدرسة لا يختلف عن دور المدرس والطالب."], "quote": "فدور المدير يختلف عن دور المدرس والطالب، ومن ثَمَّ فإن أداء الأدوار أداءً صحيحًا يعني أن هناك «تنظيمًا» صحيحًا في المدرسة تعود آثاره الإيجابية على العملية التعليمية", "locate": "تحت «تأمل بيئة المدرسة»، نهاية الفقرة"}, {"page": 47, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["عرّف التنظيم بأنه عملية تنسيق الجهود البشرية ...", "يعرف التنظيم بأنه عملية ...... في المنظمة حتى تتمكن من تحقيق أهدافها بأقل التكاليف وبأقصى كفاية إنتاجية ممكنة", "ما مفهوم التنظيم؟"], "a": "عملية تنسيق الجهود البشرية في المنظمة حتى تتمكن من تحقيق أهدافها بأقل التكاليف، وبأقصى كفاية إنتاجية ممكنة", "true": "من تعريفات التنظيم: عملية تنسيق الجهود البشرية في المنظمة حتى تتمكّن من تحقيق أهدافها بأقل التكاليف، وبأقصى كفاية إنتاجية ممكنة.", "false": ["عملية تنسيق الجهود البشرية في المنظمة يمكنها من تحقيق أهدافها بأعلى التكاليف، وبأقصى كفاية إنتاجية ممكنة.", "من تعريفات التنظيم: عملية تنسيق الجهود البشرية في المنظمة حتى تتمكن من تحقيق أهدافها بأقل التكاليف وبأدنى كفاية إنتاجية."], "quote": "عملية تنسيق الجهود البشرية في المنظمة حتى تتمكّن من تحقيق أهدافها بأقل التكاليف، وبأقصى كفاية إنتاجيه ممكنة.", "locate": "تحت «تعريف التنظيم»، التعريف الأول"}, {"page": 47, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["التنظيم الجيد يساعد المنظمة على تخفيض التكاليف التشغيلية (صح أم خطأ)؟", "هل يحقق التنظيم الأهداف بأقل التكاليف أم بأعلاها؟"], "a": "صح؛ فالتنظيم يمكّن المنظمة من تحقيق أهدافها بأقل التكاليف وبأقصى كفاية إنتاجية ممكنة", "true": "التنظيم الجيد يساعد المنظمة على تحقيق أهدافها بأقل التكاليف.", "false": ["التنظيم يمكّن المنظمة من تحقيق أهدافها بأعلى التكاليف.", "التنظيم يزيد التكاليف التشغيلية للمنظمة."], "quote": "حتى تتمكّن من تحقيق أهدافها بأقل التكاليف، وبأقصى كفاية إنتاجيه ممكنة", "locate": "تحت «تعريف التنظيم»، التعريف الأول (وهو جواب سؤال التقويم ص49)"}, {"page": 47, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["عرّف التنظيم بأنه توزيع المسؤوليات ...", "يعرف التنظيم بأنه ...... والتنسيق بين كافة العاملين بشكل يضمن تحقيق أقصى درجة ممكنة من الكفاية في تحقيق الأهداف المحددة"], "a": "توزيع المسؤوليات والتنسيق بين كافة العاملين بشكل يضمن تحقيق أقصى درجة ممكنة من الكفاية في تحقيق الأهداف المحددة", "true": "من تعريفات التنظيم: توزيع المسؤوليات والتنسيق بين كافة العاملين بشكل يضمن تحقيق أقصى درجة ممكنة من الكفاية في تحقيق الأهداف المحددة.", "false": ["من تعريفات التنظيم: توزيع المسؤوليات والتنسيق بين كافة العاملين بشكل يضمن تحقيق أدنى درجة من الكفاية.", "من تعريفات التنظيم: تركيز المسؤوليات في يد المدير وحده دون تنسيق بين العاملين."], "quote": "توزيع المسؤوليات والتنسيق بين كافة العاملين بشكل يضمن تحقيق أقصى درجة ممكنة من الكفاية في تحقيق الأهداف المحددة.", "locate": "تحت «تعريف التنظيم»، التعريف الثاني"}, {"page": 47, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["عرّف التنظيم بأنه ترتيب الأعمال أو الأنشطة ...", "يعرف التنظيم بأنه ترتيب الأعمال أو الأنشطة في ...... يسهل الإشراف عليها مع تحديد العلاقات الرسمية"], "a": "ترتيب الأعمال أو الأنشطة في وحدات إدارية يسهل الإشراف عليها، مع تحديد العلاقات الرسمية بين أولئك الذين يعينون أو يخصصون للقيام بتلك الأعمال", "true": "من تعريفات التنظيم: ترتيب الأعمال أو الأنشطة في وحدات إدارية يسهل الإشراف عليها، مع تحديد العلاقات الرسمية بين أولئك الذين يعينون أو يخصصون للقيام بتلك الأعمال.", "false": ["من تعريفات التنظيم: ترتيب الأعمال أو الأنشطة في وحدات إدارية يصعب الإشراف عليها.", "من تعريفات التنظيم: ترتيب الأعمال في وحدات إدارية مع تحديد العلاقات الشخصية غير الرسمية بين العاملين."], "quote": "ترتيب الأعمال أو الأنشطة في وحدات إدارية يسهل الإشراف عليها، مع تحديد العلاقات الرسمية بين أولئك الذين يُعيّنون أو يخصّصون للقيام بتلك الأعمال.", "locate": "تحت «تعريف التنظيم»، التعريف الثالث"}, {"page": 47, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["هل للتنظيم تعريف واحد؟", "ما أهم تعريفات التنظيم؟", "كم تعريفًا للتنظيم ذكرها الكتاب؟"], "a": "تتعدد تعريفات التنظيم، وذكر الكتاب ثلاثة من أهمها: تنسيق الجهود البشرية...، توزيع المسؤوليات والتنسيق...، ترتيب الأعمال أو الأنشطة في وحدات إدارية...", "true": "تتعدد تعريفات التنظيم.", "false": ["للتنظيم تعريف واحد متفق عليه.", "ذكر الكتاب تعريفًا واحدًا فقط للتنظيم."], "quote": "تعريف التنظيم: تتعدّد تعريفات التنظيم؛ ومن أهم هذه التعريفات:", "locate": "تحت «تعريف التنظيم»، السطر الأول"}, {"page": 48, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["ما الخطوة الأولى التي يعتمدها المديرون لتفعيل الخطط وتنفيذها؟", "تكمن أهمية التنظيم في كونه ...... التي يعتمدها المديرون في تفعيل الخطط وتنفيذها", "فيمَ تكمن أهمية التنظيم؟"], "a": "التنظيم؛ فهو الخطوة الأولى التي يعتمدها المديرون في تفعيل الخطط وتنفيذها", "true": "تكمن أهمية التنظيم في كونه الخطوة الأولى التي يعتمدها المديرون في تفعيل الخطط وتنفيذها.", "false": ["تكمن أهمية التنظيم في كونه الخطوة الأخيرة التي يعتمدها المديرون في تفعيل الخطط وتنفيذها.", "الرقابة هي الخطوة الأولى التي يعتمدها المديرون في تفعيل الخطط وتنفيذها."], "quote": "تكمن أهمية التنظيم في كونه الخطوة الأولى التي يعتمدها المديرون في تفعيل الخطط وتنفيذها", "locate": "تحت «الهدف الثاني: توضيح أهمية التنظيم»، أول الفقرة"}, {"page": 48, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["هل يمكن إنجاز أهداف الخطط دون تنظيم؟", "التنظيم يخلق العلاقة بين ......", "ماذا يخلق التنظيم؟"], "a": "لا؛ فدون التنظيم لا يمكن إنجاز الأهداف الواردة في الخطط، والتنظيم يخلق العلاقة بين مختلف موارد المنظمة", "true": "دون التنظيم لا يمكن إنجاز الأهداف الواردة في الخطط، والتنظيم يخلق العلاقة بين مختلف موارد المنظمة.", "false": ["يمكن إنجاز الأهداف الواردة في الخطط دون التنظيم.", "التنظيم يلغي العلاقة بين مختلف موارد المنظمة."], "quote": "فدون التنظيم لا يمكن إنجاز الأهداف الواردة في الخطط، والتنظيم يخلق العلاقة بين مختلف موارد المنظمة", "locate": "تحت «الهدف الثاني: توضيح أهمية التنظيم»، الفقرة الأولى"}, {"page": 48, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["ما أبرز النقاط التي يحققها التنظيم؟", "اذكر أهمية التنظيم (ما يحققه التنظيم)", "كم عدد النقاط التي يحققها التنظيم كما في الكتاب؟"], "a": "أربع نقاط: 1) يساعد في تحديد العلاقات بين العاملين في المنظمة 2) معرفة العاملين بالأنشطة التي سيقومون بأدائها تحديدًا 3) تحقيق الاستغلال الأمثل للموارد البشرية والمادية 4) عدم الازدواجية في العمل أثناء القيام بالأنشطة اللازمة لتحقيق الأهداف", "true": "من أبرز النقاط التي يحققها التنظيم: تحديد العلاقات بين العاملين، ومعرفة العاملين بأنشطتهم، والاستغلال الأمثل للموارد، وعدم الازدواجية في العمل.", "false": ["من أبرز النقاط التي يحققها التنظيم: الازدواجية في العمل أثناء القيام بالأنشطة.", "من أبرز النقاط التي يحققها التنظيم: زيادة التكاليف التشغيلية."], "quote": "ومن أبرز النقاط التي يحققها التنظيم ما يأتي: 1. التنظيم يساعد في تحديد العلاقات بين العاملين في المنظمة.", "locate": "تحت «الهدف الثاني»، القائمة المرقمة (4 نقاط)"}, {"page": 48, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["التنظيم يساعد في تحديد العلاقات بين العاملين في المنظمة (صح أم خطأ)؟", "التنظيم يساعد في تحديد ...... بين العاملين في المنظمة"], "a": "صح؛ التنظيم يساعد في تحديد العلاقات بين العاملين في المنظمة", "true": "التنظيم يساعد في تحديد العلاقات بين العاملين في المنظمة.", "false": ["التنظيم لا علاقة له بتحديد العلاقات بين العاملين في المنظمة.", "التنظيم يساعد في تحديد الرواتب بين العاملين في المنظمة."], "quote": "1. التنظيم يساعد في تحديد العلاقات بين العاملين في المنظمة.", "locate": "تحت «الهدف الثاني»، النقطة 1"}, {"page": 48, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["من النقاط التي يحققها التنظيم معرفة العاملين بـ ......", "أي مما يلي يحققه التنظيم بالنسبة لأنشطة العاملين؟"], "a": "معرفة العاملين بالأنشطة التي سيقومون بأدائها تحديدًا", "true": "من النقاط التي يحققها التنظيم معرفة العاملين بالأنشطة التي سيقومون بأدائها تحديدًا.", "false": ["التنظيم يجعل العاملين يجهلون الأنشطة التي سيقومون بأدائها.", "من النقاط التي يحققها التنظيم معرفة العاملين برواتب زملائهم تحديدًا."], "quote": "2. معرفة العاملين بالأنشطة التي سيقومون بأدائها تحديدًا.", "locate": "تحت «الهدف الثاني»، النقطة 2"}, {"page": 48, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["من النقاط التي يحققها التنظيم تحقيق الاستغلال الأمثل لـ ......", "هل يحقق التنظيم الاستغلال الأمثل للموارد؟"], "a": "تحقيق الاستغلال الأمثل للموارد البشرية والمادية", "true": "من النقاط التي يحققها التنظيم تحقيق الاستغلال الأمثل للموارد البشرية والمادية.", "false": ["التنظيم يحقق الاستغلال الأمثل للموارد المادية فقط دون البشرية.", "من النقاط التي يحققها التنظيم هدر الموارد البشرية والمادية."], "quote": "3. تحقيق الاستغلال الأمثل للموارد البشرية والمادية.", "locate": "تحت «الهدف الثاني»، النقطة 3"}, {"page": 48, "section": "3-1 التنظيم (المفهوم، الأهمية)", "q": ["من النقاط التي يحققها التنظيم عدم ...... في العمل", "هل يؤدي التنظيم إلى الازدواجية في العمل؟"], "a": "عدم الازدواجية في العمل أثناء القيام بالأنشطة اللازمة لتحقيق الأهداف", "true": "من النقاط التي يحققها التنظيم عدم الازدواجية في العمل أثناء القيام بالأنشطة اللازمة لتحقيق الأهداف.", "false": ["التنظيم يؤدي إلى الازدواجية في العمل أثناء القيام بالأنشطة.", "من النقاط التي يحققها التنظيم تكرار العمل نفسه بين أكثر من عامل."], "quote": "4. عدم الازدواجية في العمل أثناء القيام بالأنشطة اللازمة لتحقيق الأهداف.", "locate": "تحت «الهدف الثاني»، النقطة 4"}, {"page": 50, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["علام يساعد التنظيم؟", "تنظيم الأمور وترتيبها من الأمور المهمة لـ ......", "أي مما يلي من فوائد التنظيم؟"], "a": "التنظيم يساعد على تحقيق الأهداف، وتوفير الوقت والجهد، وتقليل الإجهاد والتوتر؛ وتنظيم الأمور وترتيبها من الأمور المهمة للنجاح في الأعمال", "true": "التنظيم يساعد على تحقيق الأهداف، وتوفير الوقت والجهد، وتقليل الإجهاد والتوتر.", "false": ["التنظيم يساعد على زيادة الإجهاد والتوتر.", "التنظيم يستهلك الوقت والجهد ولا يوفرهما."], "quote": "تنظيم الأمور وترتيبها من الأمور المهمة للنجاح في الأعمال؛ فالتنظيم يساعد على تحقيق الأهداف، وتوفير الوقت والجهد، وتقليل الإجهاد والتوتر", "locate": "الفقرة التمهيدية للموضوع 3-2"}, {"page": 50, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما أنواع التنظيم؟", "كم عدد أنواع التنظيم؟", "يتفرع التنظيم إلى نوعين هما ......"], "a": "نوعان: التنظيم الرسمي، والتنظيم غير الرسمي (ولكل نوع مزايا وعيوب)", "true": "هناك نوعان من أنواع التنظيم تنشأ عادة في المجتمع بين الأفراد والمنظمات؛ وهما التنظيم الرسمي والتنظيم غير الرسمي.", "false": ["هناك ثلاثة أنواع للتنظيم: الرسمي وغير الرسمي والمختلط.", "التنظيم غير الرسمي من مبادئ التنظيم وليس من أنواعه."], "quote": "وهناك نوعان من أنواع التنظيم تنشأ عادة في المجتمع بين الأفراد والمنظمات؛ وهما التنظيم الرسمي و التنظيم غير الرسمي", "locate": "الفقرة التمهيدية، ومخطط «أنواع موظفين في العمل.", "locate": "أعلى الصفحة، تحت عنوان «عيوب التنظيم غير الرسمي» (3 نقاط)"}, {"page": 52, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["يركز على المصلحة الفردية ورضا الأفراد مقارنة بالاهتمام التنظيمي من عيوب التنظيم ......", "على ماذا يركز التنظيم غير الرسمي؟"], "a": "التنظيم غير الرسمي؛ يركز على المصلحة الفردية ورضا الأفراد مقارنة بالاهتمام التنظيمي", "true": "من عيوب التنظيم غير الرسمي أنه يركز على المصلحة الفردية، ورضا الأفراد مقارنة بالاهتمام التنظيمي.", "false": ["من عيوب التنظيم غير الرسمي أنه يركز على الاهتمام التنظيمي مقارنة بالمصلحة الفردية.", "من عيوب التنظيم الرسمي أنه يركز على المصلحة الفردية ورضا الأفراد."], "quote": "▪ يركز على المصلحة الفردية، ورضا الأفراد مقارنة بالاهتمام التنظيمي.", "locate": "تحت «عيوب التنظيم غير الرسمي»، النقطة الثانية"}, {"page": 52, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["معارضة أي تغيير أو تطوير في المنظمة من عيوب التنظيم ......", "هل يدعم التنظيم غير الرسمي التغيير والتطوير في المنظمة؟"], "a": "من عيوب التنظيم غير الرسمي معارضة أي تغيير أو تطوير في المنظمة", "true": "من عيوب التنظيم غير الرسمي معارضة أي تغيير أو تطوير في المنظمة.", "false": ["من مزايا التنظيم غير الرسمي دعم أي تغيير أو تطوير في المنظمة.", "من عيوب التنظيم الرسمي معارضة أي تغيير أو تطوير في المنظمة."], "quote": "▪ معارضة أي تغيير أو تطوير في المنظمة.", "locate": "تحت «عيوب التنظيم غير الرسمي»، النقطة الثالثة"}, {"page": 52, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما المقصود بمبادئ التنظيم؟", "تعرف مبادئ التنظيم بأنها مجموعة ...... التي يسترشد بها عند تصميم الهيكل التنظيمي للمنشأة", "عرّف مبادئ التنظيم"], "a": "مجموعة التوجيهات التي يسترشد بها عند تصميم الهيكل التنظيمي للمنشأة، وتوضح مهام كل وحدة إدارية في هذا الهيكل بغرض أداء العمل الإداري بكفاية عالية وبأقل تكاليف ممكنة", "true": "مبادئ التنظيم هي مجموعة التوجيهات التي يسترشد بها عند تصميم الهيكل التنظيمي للمنشأة، وتوضح مهام كل وحدة إدارية في هذا الهيكل بغرض أداء العمل الإداري بكفاية عالية وبأقل تكاليف ممكنة.", "false": ["مبادئ التنظيم هي مجموعة التوجيهات التي يسترشد بها عند تصميم الهيكل التنظيمي بغرض أداء العمل الإداري بأعلى تكاليف ممكنة.", "مبادئ التنظيم هي مجموعة العلاقات الشخصية بين العاملين."], "quote": "ويمكن تعريف هذه المبادئ على أنها مجموعة التوجيهات التي يُسترشد بها عند تصميم الهيكل التنظيمي للمنشاة، وتوضح مهام كل وحدة إدارية في هذا الهيكل", "locate": "تحت «الهدف الثاني: توضيح مبادئ التنظيم»، الفقرة الأولى"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما مبادئ التنظيم؟", "كم عدد مبادئ التنظيم التي ذكرها الكتاب؟", "أي مما يلي من مبادئ التنظيم؟"], "a": "تسعة مبادئ: 1) مبدأ الهدف 2) مبدأ الوظيفة 3) مبدأ التخصص وتقسيم العمل 4) مبدأ وحدة القيادة 5) مبدأ نطاق الإشراف 6) مبدأ تكافؤ السلطة والمسؤولية 7) مبدأ التفويض 8) مبدأ التنسيق 9) مبدأ المرونة", "true": "من مبادئ التنظيم: مبدأ الهدف، ومبدأ الوظيفة، ومبدأ التخصص وتقسيم العمل، ومبدأ وحدة القيادة، ومبدأ نطاق الإشراف، ومبدأ تكافؤ السلطة والمسؤولية، ومبدأ التفويض، ومبدأ التنسيق، ومبدأ المرونة.", "false": ["وحدة القيادة من أنواع التنظيم وليست من مبادئه.", "مبدأ المركزية المطلقة من مبادئ التنظيم المذكورة في الكتاب."], "quote": "3. مبدأ التخصص وتقسيم العمل: يعتمد على تقسيم أنشطة المنظمة إلى أقسام وظيفية رئيسة", "locate": "قائمة المبادئ المرقمة تبدأ في ص52 (مبدأ الهدف، مبدأ الوظيفة) وتكمل في ص53 (من 3 إلى 9)"}, {"page": 52, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما مبدأ الهدف؟", "لماذا تعد أهداف المنظمة من الأسس الرئيسة للتنظيم؟", "أي مبادئ التنظيم يؤكد وجود هدف واضح ومحدد في أي عملية تنظيم إداري؟"], "a": "مبدأ الهدف: أهداف المنظمة تعد من الأسس الرئيسة للتنظيم؛ لأن المقصود بالتنظيم هو ترتيب الأنشطة الضرورية في المنظمة من أجل تحقيق أهدافها، لذلك لابد من وجود هدف واضح ومحدد في أي عملية تنظيم إداري", "true": "وفق مبدأ الهدف لابد من وجود هدف واضح ومحدد في أي عملية تنظيم إداري.", "false": ["وفق مبدأ الهدف لا يشترط وجود هدف واضح ومحدد في عملية التنظيم الإداري.", "أهداف المنظمة ليست من الأسس الرئيسة للتنظيم."], "quote": "1. مبدأ الهدف: أهداف المنظمة تعد من الأسس الرئيسة للتنظيم؛ لأن المقصود بالتنظيم هو ترتيب الأنشطة الضرورية في المنظمة من أجل تحقيق أهدافها", "locate": "تحت «ومن أهم المبادئ ما يأتي»، المبدأ 1"}, {"page": 52, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما الوحدة الأساسية في أي تنظيم إداري؟", "تعد ...... الوحدة الأساسية في أي تنظيم إداري", "ما مبدأ الوظيفة؟"], "a": "الوظيفة؛ وهي منصب معين يتضمن واجبات ومسؤوليات محددة", "true": "تعد الوظيفة الوحدة الأساسية في أي تنظيم إداري، وهي منصب معين يتضمن واجبات ومسؤوليات محددة.", "false": ["يعد الموظف الوحدة الأساسية في أي تنظيم إداري.", "الوظيفة منصب معين لا يتضمن واجبات ومسؤوليات محددة."], "quote": "2. مبدأ الوظيفة: تعد الوظيفة الوحدة الأساسية في أي تنظيم إداري، وهي منصب معيّن، يتضمّن واجبات ومسؤوليات محددة", "locate": "تحت «ومن أهم المبادئ ما يأتي»، المبدأ 2"}, {"page": 52, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["وفق مبدأ الوظيفة، أيهما يأتي أولًا: إنشاء الوظيفة أم تعيين شاغلها؟", "تنص القواعد على أن الوظائف تنشأ ...... وبعد ذلك تحدد حقوق من يشغلها ومسؤولياته"], "a": "الوظائف تنشأ أولًا، وبعد ذلك تحدد حقوق من يشغلها ومسؤولياته قبل أن يعين عليها أحد", "true": "تنص القواعد على أن الوظائف تنشأ أولًا، وبعد ذلك تحدد حقوق من يشغلها ومسؤولياته قبل أن يعين عليها أحد.", "false": ["تنص القواعد على أن يعين الموظف أولًا ثم تنشأ الوظيفة حسب قدراته.", "تحدد حقوق شاغل الوظيفة ومسؤولياته بعد أن يعين عليها."], "quote": "وتنُص القواعد على أن الوظائف تُنشأ أولًا، وبعد ذلك تُحدَد حقوق من يشغلها ومسؤولياته قبل أن يُعيّن عليها أحد.", "locate": "تحت المبدأ 2 «مبدأ الوظيفة»، نهاية الفقرة"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما مبدأ التخصص وتقسيم العمل؟", "على ماذا يعتمد مبدأ التخصص وتقسيم العمل؟", "أي مبادئ التنظيم يعتمد على تقسيم أنشطة المنظمة إلى أقسام وظيفية رئيسة ثم فرعية؟"], "a": "يعتمد على تقسيم أنشطة المنظمة إلى أقسام وظيفية رئيسة، ثم تقسيمها إلى أقسام فرعية وهكذا إلى أدنى تقسيم؛ بحيث تربط النشاطات المتجانسة مع بعضها بعلاقات وظيفية محددة، ويوزع الأفراد على هذه الأقسام مع إعطائهم الصلاحيات الملائمة", "true": "مبدأ التخصص وتقسيم العمل يعتمد على تقسيم أنشطة المنظمة إلى أقسام وظيفية رئيسة، ومن ثم تقسيم هذه الأنشطة الرئيسة إلى أقسام فرعية.", "false": ["مبدأ التنسيق يعتمد على تقسيم أنشطة المنظمة إلى أقسام وظيفية رئيسة ثم فرعية.", "في مبدأ التخصص وتقسيم العمل يوزع الأفراد على الأقسام دون إعطائهم أي صلاحيات."], "quote": "بحيث تُربط النشاطات المتجانسة مع بعضها بعلاقات وظيفية محددة. ويُوزَّع الأفراد على هذه الأقسام مع إعطائهم الصلاحيات الملائمة للقيام بما أُسند إليهم من أعمال.", "locate": "المبدأ 3 «مبدأ التخصص وتقسيم العمل»، أعلى الصفحة"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما مبدأ وحدة القيادة؟", "يقصد بمبدأ ...... أن يكون للموظف قائد أو رئيس واحد يتلقى منه الأوامر والتعليمات والتوجيهات", "لماذا تعد وحدة القيادة أحد مبادئ التنظيم؟"], "a": "أن يكون للموظف قائد أو رئيس واحد يتلقى منه الأوامر والتعليمات والتوجيهات، ويؤدي دوره وفقًا لها؛ ويساعد هذا المبدأ على تحديد المسؤولية ويضمن التنسيق", "true": "يقصد بمبدأ وحدة القيادة أن يكون للموظف قائد أو رئيس واحد يتلقى منه الأوامر والتعليمات والتوجيهات.", "false": ["يقصد بمبدأ وحدة القيادة أن يكون للموظف أكثر من رئيس يتلقى منهم الأوامر.", "يقصد بمبدأ نطاق الإشراف أن يكون للموظف رئيس واحد يتلقى منه الأوامر."], "quote": "ويُقصد به أن يكون للموظف قائد أو رئيس واحد يتلقّى منه الأوامر والتعليمات والتوجيهات، ويؤدي الموظف دوره في العمل وفقًا لهذه الأوامر", "locate": "المبدأ 4 «مبدأ وحدة القيادة»"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما الأسماء الأخرى لمبدأ وحدة القيادة؟", "يطلق على مبدأ وحدة القيادة عدة أسماء منها ......", "وحدة الأمر هي اسم آخر لمبدأ ......"], "a": "وحدة الأمر، ووحدة الرئاسة، ووحدة إصدار الأوامر", "true": "يطلق على مبدأ وحدة القيادة عدة أسماء؛ مثل وحدة الأمر، ووحدة الرئاسة، ووحدة إصدار الأوامر.", "false": ["وحدة الأمر اسم آخر لمبدأ التفويض.", "يطلق على مبدأ وحدة القيادة اسم نطاق الإشراف."], "quote": "4. مبدأ وحدة القيادة: يطلق على هذا المبدأ عدة أسماء؛ مثل وحدة الأمر، ووحدة الرئاسة، ووحدة إصدار الأوامر", "locate": "المبدأ 4 «مبدأ وحدة القيادة»، أول الفقرة"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["علام يساعد مبدأ وحدة القيادة؟", "مبدأ وحدة القيادة يساعد على تحديد ...... ويضمن ......"], "a": "يساعد على تحديد المسؤولية، ويضمن التنسيق", "true": "يساعد مبدأ وحدة القيادة على تحديد المسؤولية، ويضمن التنسيق.", "false": ["مبدأ وحدة القيادة يؤدي إلى تشتت المسؤولية.", "يساعد مبدأ وحدة القيادة على تحديد المسؤولية لكنه لا يضمن التنسيق."], "quote": "ويؤدي الموظف دوره في العمل وفقًا لهذه الأوامر، ويساعد هذا المبدأ على تحديد المسئولية، ويضمن التنسيق.", "locate": "المبدأ 4 «مبدأ وحدة القيادة»، نهاية الفقرة"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما مبدأ نطاق الإشراف؟", "يقصد بمبدأ ...... عدد المرؤوسين الذين يستطيع المشرف أن يشرف على عملهم إشرافًا مباشرًا بكفاءة", "عدد المرؤوسين الذين يستطيع المدير الإشراف عليهم مباشرة بكفاءة يسمى ......"], "a": "مبدأ نطاق الإشراف: عدد المرؤوسين الذين يستطيع المشرف (المدير أو الرئيس) أن يشرف على عملهم إشرافًا مباشرًا بكفاءة", "true": "يقصد بمبدأ نطاق الإشراف عدد المرؤوسين الذين يستطيع المشرف (المدير أو الرئيس) أن يشرف على عملهم إشرافًا مباشرًا بكفاءة.", "false": ["يقصد بمبدأ وحدة القيادة عدد المرؤوسين الذين يستطيع المشرف أن يشرف على عملهم إشرافًا مباشرًا بكفاءة.", "يقصد بمبدأ نطاق الإشراف عدد المديرين الذين يتلقى منهم الموظف الأوامر."], "quote": "5. مبدأ نطاق الإشراف: ويقصد به عدد المرؤوسين الذين يستطيع المشرف (المدير أو الرئيس) أن يشرف على عملهم إشرافًا مباشرًا بكفاءة.", "locate": "المبدأ 5 «مبدأ نطاق الإشراف»"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما مبدأ تكافؤ السلطة والمسؤولية؟", "كيف تحدد السلطة؟ وما المسؤولية؟", "المسؤولية هي ...... بأداء ذلك العمل"], "a": "السلطة والمسؤولية مرتبطتان بعمل معين؛ فالسلطة تحدد طبقًا لاحتياجات أداء عمل معين، والمسؤولية هي الالتزام بأداء ذلك العمل", "true": "وفق مبدأ تكافؤ السلطة والمسؤولية: السلطة تحدد طبقًا لاحتياجات أداء عمل معين، والمسؤولية هي الالتزام بأداء ذلك العمل.", "false": ["السلطة هي الالتزام بأداء العمل، والمسؤولية تحدد طبقًا لاحتياجات أداء العمل.", "السلطة والمسؤولية غير مرتبطتين بعمل معين."], "quote": "6. مبدأ تكافؤ السُّلطة والمسؤولية: السلطة والمسؤولية مرتبطتان بعمل معين؛ فالسلطة تُحدد طبقًا لاحتياجات أداء عمل معين، والمسؤولية هي الالتزام بأداء ذلك العمل", "locate": "المبدأ 6 «مبدأ تكافؤ السلطة والمسؤولية»"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["متى يتسع نطاق السلطة والمسؤولية؟", "يتسع نطاق السلطة والمسؤولية كلما تدرجنا إلى ...... في الهيكل التنظيمي"], "a": "كلما تدرجنا إلى الأعلى في الهيكل التنظيمي", "true": "يتسع نطاق السلطة والمسؤولية كلما تدرجنا إلى الأعلى في الهيكل التنظيمي.", "false": ["يتسع نطاق السلطة والمسؤولية كلما تدرجنا إلى الأسفل في الهيكل التنظيمي.", "يضيق نطاق السلطة والمسؤولية كلما تدرجنا إلى الأعلى في الهيكل التنظيمي."], "quote": "ويتّسع نطاق السلطة والمسؤولية كلّما تدرّجنا إلى الأعلى في الهيكل التنظيمي.", "locate": "المبدأ 6، نهاية الفقرة"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["ما التفويض؟", "منح الرئيس أو المدير السلطة لأحد مرؤوسيه لأداء عمل معين يسمى ......", "منح المدير السلطة للمرؤوسين يرتبط بمبدأ ......"], "a": "مبدأ التفويض: التفويض هو منح الرئيس أو المدير السلطة لأحد مرؤوسيه أو مجموعة من مرؤوسيه لأداء عمل معين", "true": "التفويض هو منح الرئيس أو المدير السلطة لأحد مرؤوسيه أو مجموعة من مرؤوسيه؛ لأداء عمل معين.", "false": ["التنسيق هو منح الرئيس أو المدير السلطة لأحد مرؤوسيه لأداء عمل معين.", "التفويض هو منح المرؤوس السلطة لرئيسه لأداء عمل معين."], "quote": "7. مبدأ التفويض: التفويض هو منح الرئيس أو المدير السلطةَ لأحد مرؤوسيه أو مجموعة من مرؤوسيه؛ لأداء عمل معين", "locate": "المبدأ 7 «مبدأ التفويض»، أول الفقرة"}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "q": ["هل تنتقل مسؤولية المدير إلى المرؤوس عند تفويض السلطة؟", "تفويض المدير سلطته لأداء عمل معين لا يعني انتقال ...... إلى المرؤوس"], "a": "لا؛ تفويض المدير سلطته لا يعني انتقال مسؤوليته عن العمل إلى المرؤوس، بل يبقى مسؤولًا عنه", "true": "تفويض المدير سلطته لأداء عمل معين لا يعني انتقال مسؤوليته عن هذا العمل إلى المرؤوس، بل يبقى مسؤولًا عنه.", "false": ["تفويض المدير سلطته لأداء عمل معين يعني انتقال مسؤوليته عن هذا العمل إلى المرؤوس.", "عند التفويض يصبح المرؤوس وحده مسؤولًا عن العمل ولا يبقى المدير مسؤولًا عنه."] . [مخطط] الرئيس ← يتفرع إلى: مدير فرع جدة | مدير فرع الدمام | مدير فرع أبها", "locate": "الأساس 2 ومخططه أعلى الصفحة"}, {"page": 57, "section": "3-3 التصميم التنظيمي", "q": ["ما مثال التنظيم على أساس العملاء؟", "مدير المشاريع الحكومية ومدير مشاريع الأفراد ومدير مشاريع الشركات مثال على التنظيم على أساس ......"], "a": "التنظيم على أساس العملاء؛ مثاله: الرئيس يتفرع إلى مدير المشاريع الحكومية، ومدير مشاريع الأفراد، ومدير مشاريع الشركات", "true": "تقسيم الهيكل إلى مدير المشاريع الحكومية ومدير مشاريع الأفراد ومدير مشاريع الشركات مثال على التنظيم على أساس العملاء.", "false": ["تقسيم الهيكل إلى مدير المشاريع الحكومية ومدير مشاريع الأفراد ومدير مشاريع الشركات مثال على التنظيم على الأساس الجغرافي.", "تقسيم الهيكل إلى مدير المشاريع الحكومية والأفراد والشركات مثال على التنظيم على أساس المنتج."], "quote": "3. التنظيم على أساس العملاء. [مخطط] الرئيس ← يتفرع إلى: مدير المشاريع الحكومية | مدير مشاريع الأفراد | مدير مشاريع الشركات", "locate": "الأساس 3 ومخططه وسط الصفحة"}, {"page": 57, "section": "3-3 التصميم التنظيمي", "q": ["ما مثال التنظيم على أساس المنتج؟", "رئيس قسم إنتاج الحليب ورئيس قسم إنتاج العصائر ورئيس قسم إنتاج الأجبان مثال على التنظيم على أساس ......"], "a": "التنظيم على أساس المنتج؛ مثاله: المدير يتفرع إلى رئيس قسم إنتاج الحليب، ورئيس قسم إنتاج العصائر، ورئيس قسم إنتاج الأجبان", "true": "تقسيم الهيكل إلى رئيس قسم إنتاج الحليب ورئيس قسم إنتاج العصائر ورئيس قسم إنتاج الأجبان مثال على التنظيم على أساس المنتج.", "false": ["تقسيم الهيكل إلى أقسام إنتاج الحليب والعصائر والأجبان مثال على التنظيم على أساس العملاء.", "تقسيم الهيكل إلى أقسام إنتاج الحليب والعصائر والأجبان مثال على التنظيم على الأساس الجغرافي."], "quote": "4. التنظيم على أساس المنتج. [مخطط] المدير ← يتفرع إلى: رئيس قسم إنتاج الحليب | رئيس قسم إنتاج العصائر | رئيس قسم إنتاج الأجبان", "locate": "الأساس 4 ومخططه"}, {"page": 57, "section": "3-3 التصميم التنظيمي", "q": ["ما التنظيم المختلط؟", "التنظيم الذي يجمع بين أكثر من طريقة في التنظيم يسمى ......", "هل تقوم أغلب المنظمات على أساس نوع واحد من التنظيمات؟"], "a": "التنظيم المختلط: من النادر أن نجد تنظيمًا يقوم على أساس نوع واحد؛ إذ غالبًا ما تجمع الكثير من المنظمات بين أكثر من طريقة في التنظيم", "true": "من النادر أن نجد تنظيمًا يقوم على أساس نوع واحد من التنظيمات السابقة؛ إذ غالبًا ما نجد أن الكثير من المنظمات تجمع بين أكثر من طريقة في التنظيم (التنظيم المختلط).", "false": ["أغلب المنظمات تقوم على أساس نوع واحد فقط من التنظيمات.", "التنظيم المختلط هو التنظيم على أساس المنتج فقط."], "quote": "5. التنظيم المختلط: من النادر أن نجده تنظيمًا يقوم على أساس نوع واحد من التنظيمات السابقة؛ إذ غالبًا ما نجد أن الكثير من المنظمات تجمع بين أكثر من طريقة في التنظيم", "locate": "الأساس 5 «التنظيم المختلط»"}, {"page": 57, "section": "3-3 التصميم التنظيمي", "q": ["على ماذا يعتمد جمع المنظمات بين أكثر من طريقة في التنظيم (التنظيم المختلط)؟", "يعتمد التنظيم المختلط على ......"], "a": "اعتمادًا على أهداف المنظمة، واحتياجاتها الراهنة والمستقبلية، وحجمها، ونوع الخدمات التي تقدمها، والعملاء الذين تتعامل معهم", "true": "تجمع المنظمات بين أكثر من طريقة في التنظيم اعتمادًا على أهداف المنظمة، واحتياجاتها الراهنة والمستقبلية، وحجمها، ونوع الخدمات التي تقدمها والعملاء الذين تتعامل معهم.", "false": ["يعتمد التنظيم المختلط على رغبات الموظفين الشخصية فقط.", "لا يتأثر اختيار التنظيم المختلط بحجم المنظمة."], "quote": "وذلك اعتمادًا على أهداف المنظمة، واحتياجاتها الراهنة والمستقبلية، وحجمها، ونوع الخدمات التي تقدمها والعملاء الذين تتعامل معهم.", "locate": "الأساس 5 «التنظيم المختلط»، نهاية الفقرة"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["ما خطوات تصميم الهيكل التنظيمي؟", "كم عدد خطوات تصميم الهيكل التنظيمي؟", "رتب خطوات تصميم الهيكل التنظيمي"], "a": "سبع خطوات: 1) تحليل أهداف المنظمة بغرض تحديد الأنشطة الرئيسة 2) تحليل الأنشطة الرئيسة إلى أنشطة فرعية 3) تحديد الأنشطة المساندة 4) تجميع الأنشطة المتشابهة وتكوين الوحدات الإدارية 5) وصف المهام الأساسية للوحدات الإدارية 6) تحديد طبيعة عمل الوحدات الإدارية وارتباطاتها التنظيمية 7) إعداد الهيكل التنظيمي", "true": "يصمم الهيكل التنظيمي من خلال خطوات أولها تحليل أهداف المنظمة بغرض تحديد الأنشطة الرئيسة، وآخرها إعداد الهيكل التنظيمي.", "false": ["أول خطوات تصميم الهيكل التنظيمي إعداد الهيكل التنظيمي.", "أول خطوات تصميم الهيكل التنظيمي تحديد الأنشطة المساندة."], "quote": "يُصمم الهيكل التنظيمي من خلال الخطوات الآتية: 1. تحليل أهداف المنظمة بغرض تحديد الأنشطة الرئيسة.", "locate": "تحت «الهدف الثالث: تطبيق خطوات تصميم الهيكل التنظيمي» (الخطوات 1–5 في ص58 و6–7 في ص59)"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["ما الخطوة الأولى في تصميم الهيكل التنظيمي؟", "التعرف على هدف أو أهداف المنظمة وتحليلها إلى أهداف فرعية بغرض تحديد الأنشطة الرئيسة هو الخطوة ...... في تصميم الهيكل التنظيمي"], "a": "تحليل أهداف المنظمة بغرض تحديد الأنشطة الرئيسة (التعرف على هدف أو أهداف المنظمة وتحليلها إلى أهداف فرعية)", "true": "التعرف على هدف أو أهداف المنظمة وتحليلها إلى أهداف فرعية بغرض تحديد الأنشطة الرئيسة هو الخطوة الأولى في تصميم الهيكل التنظيمي.", "false": ["التعرف على أهداف المنظمة وتحليلها هو الخطوة الأخيرة في تصميم الهيكل التنظيمي.", "الخطوة الأولى في تصميم الهيكل التنظيمي هي وصف المهام الأساسية للوحدات الإدارية."], "quote": "لذا فإن التعرف على هدف أو أهداف المنظمة وتحليلها إلى أهداف فرعية بغرض تحديد الأنشطة الرئيسة هو الخطوة الأولى في تصميم الهيكل التنظيمي.", "locate": "الخطوة 1، نهاية الفقرة"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["ما السبب وراء وجود المنظمة؟", "هل هدف وزارة معنية بالتعليم مماثل لهدف وزارة معنية بالمواصلات؟", "لكل منظمة هدف رئيس أو أهداف رئيسة هي ......"], "a": "لكل منظمة هدف رئيس أو أهداف رئيسة هي السبب وراء وجودها، وتختلف الأهداف بين المنظمات (هدف وزارة التعليم يختلف عن هدف وزارة المواصلات، وهدف شركة المقاولات المعمارية يختلف عن هدف شركة تجارة المواد الغذائية)", "true": "لكل منظمة هدف رئيس أو أهداف رئيسة هي السبب وراء وجود هذه المنظمة، فهدف وزارة معنية بالتعليم سيكون مختلفًا عن هدف وزارة معنية بالمواصلات.", "false": ["هدف وزارة معنية بالتعليم مماثل لهدف وزارة معنية بالمواصلات.", "ليس لكل منظمة هدف رئيس يبرر وجودها."], "quote": "لكل منظمة هدف رئيس أو أهداف رئيسة هي السبب وراء وجود هذه المنظمة، فهدف وزارة معنية بالتعليم سيكون مختلفًا عن هدف وزارة معنية بالمواصلات", "locate": "الخطوة 1، أول الفقرة"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["ما الخطوة الثانية في تصميم الهيكل التنظيمي؟", "لماذا نحتاج إلى تحليل النشاط الرئيس إلى أنشطته الفرعية؟", "ما المقصود بالنشاط الفرعي؟"], "a": "تحليل الأنشطة الرئيسة إلى أنشطة فرعية؛ لأن النشاط الرئيس غالبًا مركب من عدة أنشطة فنحلله ليسهل التعامل معها. والنشاط الفرعي: المهام أو الأعمال التي يؤدي القيام بها إلى تنفيذ النشاط الرئيس في المنظمة، ومن ثم تحقيق أهدافها", "true": "يقصد بالنشاط الفرعي المهام أو الأعمال التي يؤدي القيام بها إلى تنفيذ النشاط الرئيس في المنظمة، ومن ثم تحقيق أهداف المنظمة.", "false": ["النشاط الرئيس غالبًا ما يكون بسيطًا لا يحتاج إلى تحليل إلى أنشطة فرعية.", "يقصد بالنشاط الفرعي الأنشطة التي لا علاقة لها بتنفيذ النشاط الرئيس."], "quote": "ويقصد بالنشاط الفرعي هنا المهام أو الأعمال التي يؤدي القيام بها إلى تنفيذ النشاط الرئيس في المنظمة، ومن ثَمَّ تحقيق أهداف المنظمة.", "locate": "الخطوة 2 «تحليل الأنشطة الرئيسة إلى أنشطة فرعية»"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["ما الخطوة الثالثة في تصميم الهيكل التنظيمي؟", "ما الأنشطة المساندة؟ وهل تعد جزءًا من أهداف المنظمة؟", "لماذا تعد الأنشطة المساندة مهمة؟"], "a": "تحديد الأنشطة المساندة؛ وهي أنشطة داعمة لتنفيذ الأنشطة الرئيسة والفرعية لا تعد جزءًا من أهداف المنظمة لكنها مهمة، إذ دونها لن تتمكن المنظمة من تحقيق أهدافها الرئيسة أو الفرعية", "true": "الأنشطة المساندة لا تعد جزءًا من أهداف المنظمة، ولكنها مهمة في أي عملية تنظيم هيكل تنظيمي أو تصميمه.", "false": ["الأنشطة المساندة تعد جزءًا من أهداف المنظمة الرئيسة.", "يمكن للمنظمة تحقيق أهدافها الرئيسة دون وجود الأنشطة المساندة."], "quote": "وذلك أنه دون وجود هذه الأنشطة المساندة فإن المنظمة لن تتمكن من تحقيق أهدافها الرئيسة أو الفرعية", "locate": "الخطوة 3 «تحديد الأنشطة المساندة»"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["ما أبرز مثال على الأنشطة المساندة؟", "نشاط الشؤون الإدارية والمالية مثال على الأنشطة ......"], "a": "نشاط الشؤون الإدارية والمالية", "true": "أبرز مثال على الأنشطة المساندة نشاط الشؤون الإدارية والمالية.", "false": ["نشاط الشؤون الإدارية والمالية مثال على الأنشطة الرئيسة للمنظمة.", "أبرز مثال على الأنشطة المساندة نشاط الإنتاج."], "quote": "ولعل أبرز مثال على الأنشطة المساندة نشاط الشؤون الإدارية والمالية.", "locate": "الخطوة 3، نهاية الفقرة"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["ما الخطوة الرابعة في تصميم الهيكل التنظيمي؟", "لماذا تجمع الأنشطة المتشابهة في مجموعة واحدة؟"], "a": "تجميع الأنشطة المتشابهة وتكوين الوحدات الإدارية؛ تجمع الأنشطة المتشابهة (ما أمكن) في مجموعة واحدة ليسهل تكوين الوحدات الإدارية", "true": "في خطوة تجميع الأنشطة المتشابهة تجمع الأنشطة المتشابهة -ما أمكن- في مجموعة واحدة؛ ليسهل علينا تكوين الوحدات الإدارية.", "false": ["في خطوة تجميع الأنشطة المتشابهة تفصل الأنشطة المتشابهة في مجموعات مختلفة.", "تجميع الأنشطة المتشابهة هو الخطوة الأولى في تصميم الهيكل التنظيمي."], "quote": "لذا فإنه في هذه الخطوة من تصميم الهيكل التنظيمي تُجمع الأنشطة المتشابهة -ما أمكن- في مجموعة واحدة؛ ليسهل علينا تكوين الوحدات الإدارية.", "locate": "الخطوة 4 «تجميع الأنشطة المتشابهة وتكوين الوحدات الإدارية»"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["ما أهم خطوات تصميم الهيكل التنظيمي وأصعبها؟", "تعد خطوة ...... من بين أهم خطوات تصميم الهيكل التنظيمي وأصعبها"], "a": "وصف المهام الأساسية للوحدات الإدارية (الخطوة الخامسة)", "true": "تعد خطوة وصف المهام الأساسية للوحدات الإدارية من بين أهم خطوات تصميم الهيكل التنظيمي وأصعبها.", "false": ["تعد خطوة إعداد الهيكل التنظيمي من أسهل خطوات تصميم الهيكل وأقلها أهمية.", "تعد خطوة وصف المهام الأساسية للوحدات الإدارية من أسهل خطوات تصميم الهيكل التنظيمي."], "quote": "5. وصف المهام الأساسية للوحدات الإدارية. إن هذه الخطوة تُعد من بين أهم خطوات تصميم الهيكل التنظيمي وأصعبها", "locate": "الخطوة 5، أول الفقرة"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["كيف يحصل القائم بوصف المهام على المعلومات اللازمة؟", "من وسائل جمع المعلومات لكتابة المهام الأساسية للوحدات الإدارية ......"], "a": "من خلال استمارة لجمع المعلومات تعد لهذا الغرض، إضافة إلى المقابلات الشخصية والزيارات الميدانية", "true": "المعلومات اللازمة لكتابة المهام الأساسية لكل وحدة إدارية يمكن الحصول عليها من خلال استمارة لجمع المعلومات، إضافة إلى المقابلات الشخصية والزيارات الميدانية.", "false": ["تجمع المعلومات اللازمة لوصف المهام من خلال الإعلانات التجارية فقط.", "لا تستخدم المقابلات الشخصية في جمع المعلومات لوصف مهام الوحدات الإدارية."], "quote": "وهذه المعلومات يمكن الحصول عليها من خلال استمارة لجمع المعلومات تعد لهذا الغرض، إضافة إلى المقابلات الشخصية والزيارات الميدانية.", "locate": "الخطوة 5، وسط الفقرة"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "q": ["هل يختلف وصف مهام الوحدات الإدارية من منظمة لأخرى؟ ولماذا؟", "يختلف وصف المهام من منظمة لأخرى باختلاف ......"], "a": "نعم؛ يختلف باختلاف طبيعة نشاط المنظمة، وتاريخ نشأتها (منظمة جديدة لم يسبق أن مارست نشاطها، أو حديثة النشأة، أو قديمة النشأة)", "true": "وصف المهام سوف يختلف من منظمة لأخرى باختلاف طبيعة نشاط المنظمة، وتاريخ نشأتها.", "false": ["وصف المهام الأساسية للوحدات الإدارية واحد في جميع المنظمات.", "لا يتأثر وصف المهام بتاريخ نشأة المنظمة."], "quote": "وبالطبع فإن وصف هذه المهام سوف يختلف من منظمة لأخرى باختلاف طبيعة نشاط المنظمة، وتاريخ نشأتها", "locate": "الخطوة 5، نهاية الفقرة"}, {"page": 59, "section": "3-3 التصميم التنظيمي", "q": ["ما الخطوة السادسة في تصميم الهيكل التنظيمي؟", "ما الخطوة التي تأتي بعد وصف المهام الأساسية للوحدات الإدارية؟"], "a": "تحديد طبيعة عمل الوحدات الإدارية وارتباطاتها التنظيمية؛ وذلك بحسب دورها في تحقيق أهداف المنظمة", "true": "بعد وصف المهام الأساسية للوحدات الإدارية تأتي خطوة تحديد طبيعة عمل الوحدات الإدارية وارتباطاتها التنظيمية.", "false": ["بعد وصف المهام الأساسية للوحدات الإدارية تأتي خطوة تحليل أهداف المنظمة.", "تحديد طبيعة عمل الوحدات الإدارية هو الخطوة الأولى في تصميم الهيكل التنظيمي."], "quote": "بعد وصف المهام الأساسية للوحدات الإدارية تأتي الخطوة الآتية في إعداد الهيكل التنظيمي المتضمنة تحديد طبيعة عمل الوحدات الإدارية؛ وذلك بحسب دورها في تحقيق أهداف المنظمة", "locate": "الخطوة 6، أعلى الصفحة"}, {"page": 59, "section": "3-3 التصميم التنظيمي", "q": ["ما أقسام الوحدات الإد ه (المفهوم، الأهمية)", "q": ["ما الذي سنتعرف عليه في فصل التوجيه؟"], "a": "مفهوم التوجيه، وأهميته، وأدواته", "true": "في فصل التوجيه نتعرف على مفهوم التوجيه، وأهميته، وأدواته.", "false": ["في فصل التوجيه نتعرف على مفهوم التوجيه وأنواع الهياكل التنظيمية."], "quote": "وفي هذا الفصل سنتعرف على مفهوم التوجيه، وأهميته، وأدواته", "locate": "آخر فقرة المقدمة"}, {"page": 64, "section": "4-1 التوجيه (المفهوم، الأهمية)", "q": ["يعرف التوجيه بأنه", "التوجيه هو فن ......", "...... هو فن التعامل مع مجموعة من الناس الذين يمارس المشرف عليهم سلطته بطريقة تحقق أقصى فاعلية في أداء العمل"], "a": "فن التعامل مع مجموعة من الناس الذين يمارس المشرف عليهم سلطته بطريقة تحقق أقصى فاعلية في أداء العمل", "true": "التوجيه هو فن التعامل مع مجموعة من الناس الذين يمارس المشرف عليهم سلطته بطريقة تحقق أقصى فاعلية في أداء العمل.", "false": ["التنظيم هو فن التعامل مع مجموعة من الناس الذين يمارس المشرف عليهم سلطته بطريقة تحقق أقصى فاعلية في أداء العمل.", "التوجيه هو فن التعامل مع مجموعة من الآلات بطريقة تحقق أقل تكلفة في أداء العمل."], "quote": "التوجيه هو فن التّعامل مع مجموعة من الناس الذين يمارس المشرف عليهم سلطته بطريقة تحقق أقصى فاعلية في أداء العمل", "locate": "تعريف التوجيه، التعريف الأول"}, {"page": 64, "section": "4-1 التوجيه (المفهوم، الأهمية)", "q": ["توجيه وقيادة المرؤوسين إلى العمل بأقصى طاقاتهم هو تعريف ......", "من تعريفات التوجيه", "ما التعريف الثاني للتوجيه؟"], "a": "توجيه وقيادة المرؤوسين إلى العمل بأقصى طاقاتهم، والعمل على تحقيق الأهداف المتبادلة بين الإدارة والمرؤوسين عن طريق التشجيع والتحفيز والاتصالات المتبادلة، ومعرفة احتياجات المرؤوسين، وتحقيق التوازن بين أهداف الإدارة وأهداف العاملين", "true": "من تعريفات التوجيه: توجيه وقيادة المرؤوسين إلى العمل بأقصى طاقاتهم، والعمل على تحقيق الأهداف المتبادلة بين الإدارة والمرؤوسين.", "false": ["من تعريفات التخطيط: توجيه وقيادة المرؤوسين إلى العمل بأقصى طاقاتهم.", "من تعريفات التوجيه: توجيه المرؤوسين إلى العمل بأدنى طاقاتهم."], "quote": "توجيه وقيادة المرؤوسين إلى العمل بأقصى طاقاتهم، والعمل على تحقيق الأهداف المتبادلة بين الإدارة والمرؤوسين وسون بقبول أوامره وطاعته", "true": "المصدر الرابع الشرعية (القانون أو النظام)؛ يعطي النظام القائد السلطة التي من خلالها يلتزم المرؤوسون بقبول أوامره وطاعته.", "false": ["المصدر الرابع من مصادر التأثير البيانات والمعلومات.", "في مصدر الشرعية يعطي المرؤوسون القائد السلطة بالانتخاب."], "quote": "يعطي النظام القائد السلطة التي من خلالها يلتزم المرؤوسون بقبول أوامره وطاعته", "locate": "المصدر الرابع: الشرعية (القانون أو النظام)"}, {"page": 76, "section": "4-3 أدوات التوجيه (القيادة)", "q": ["المصدر الخامس من مصادر التأثير في القيادة", "من يمتلك المعلومات السليمة يمكنه ......"], "a": "البيانات والمعلومات: من يمتلك المعلومات السليمة يمكنه اتخاذ القرارات الناجحة، ويستطيع القائد من خلال موقعه التعرف على الكثير من المعلومات", "true": "تعد البيانات والمعلومات مصدرًا مهمًا في العمل الإداري؛ فمن يمتلك المعلومات السليمة يمكنه اتخاذ القرارات الناجحة.", "false": ["المصدر الخامس من مصادر التأثير الحوافز الإيجابية.", "البيانات والمعلومات ليست مصدرًا مهمًا في العمل الإداري."], "quote": "تُعدّ البيانات والمعلومات مصدرًا مهمًا في العمل الإداري؛ فمن يمتلك المعلومات السليمة يمكنه اتخاذ القرارات الناجحة، ويستطيع القائد من خلال موقعه التعرف على الكثير من المعلومات", "locate": "المصدر الخامس: البيانات والمعلومات"}, {"page": 76, "section": "4-3 أدوات التوجيه (القيادة)", "q": ["المصدر السادس من مصادر التأثير في القيادة", "إحساس المرؤوسين بانتمائهم إلى المنظمة يجعلهم ......"], "a": "الانتماء: إحساس المرؤوسين بانتمائهم إلى المنظمة يجعلهم يستجيبون لأوامر القائد الذي يمثلها", "true": "المصدر السادس الانتماء؛ حيث إن إحساس المرؤوسين بانتمائهم إلى المنظمة يجعلهم يستجيبون لأوامر القائد الذي يمثلها.", "false": ["المصدر السادس من مصادر التأثير الخبرة.", "إحساس المرؤوسين بانتمائهم إلى المنظمة يجعلهم يرفضون أوامر القائد."], "quote": "إحساس المروؤسين بانتمائهم إلى المنظمة يجعلهم يستجيبون لأوامر القائد الذي يمثلها", "locate": "المصدر السادس: الانتماء"}, {"page": 76, "section": "4-3 أدوات التوجيه (القيادة)", "q": ["مصادر التأثير قد تتكامل فيما بينها", "قد يؤدي استخدام الحوافز الإيجابية إلى زيادة ......"], "a": "الانتماء؛ لأن مصادر التأثير قد تتكامل فيما بينها", "true": "مصادر التأثير قد تتكامل فيما بينها؛ فقد يؤدي استخدام الحوافز الإيجابية إلى زيادة الانتماء.", "false": ["مصادر التأثير منفصلة ولا تتكامل فيما بينها.", "قد يؤدي استخدام الحوافز الإيجابية إلى نقص الانتماء."], "quote": "من الواضح أن مصادر التأثير السابقة قد تتكامل فيما بينها؛ فقد يؤدي استخدام الحوافز الإيجابية إلى زيادة الانتماء", "locate": "آخر فقرة مصادر التأثير"}, {"page": 77, "section": "4-3 أدوات التوجيه (القيادة)", "q": ["ما أنماط القيادة الإدارية؟", "عدد أنماط القيادة", "كم عدد أنماط القيادة الإدارية؟", "أي مما يلي ليس من أنماط القيادة الإدارية؟"], "a": "ثلاثة: القيادة التسلطية (Autocratic)، القيادة الديمقراطية (Democratic)، النمط الإسلامي للقيادة الإدارية", "true": "أنماط القيادة الإدارية: القيادة التسلطية، والقيادة الديمقراطية، والنمط الإسلامي للقيادة الإدارية.", "false": ["أنماط القيادة الإدارية خمسة أنماط.", "من أنماط القيادة الإدارية القيادة المتسيبة."], "quote": "أنماط القيادة الإدارية (Styles of Leadership):\n1. القيادة التسلطية (Autocratic).\n2. القيادة الديمقراطية (Democratic).\n3. النمط الإسلامي للقيادة الإدارية.", "locate": "أنماط القيادة الإدارية (قائمة من 3)"}, {"page": 77, "section": "4-3 أدوات التوجيه (القيادة)", "q": ["أهم ما يميز موضوع القيادة الإدارية ......"], "a": "كثرة ما كتب عنه وتنوعه، وبصفة خاصة في مجال تحديد الأنماط القيادية", "true": "أهم ما يميز موضوع القيادة الإدارية هو كثرة ما كتب عنه وتنوعه، وبصفة خاصة في مجال تحديد الأنماط القيادية.", "false": ["أهم ما يميز موضوع القيادة الإدارية قلة ما كتب عنه."], "quote": "لعل أهم ما يميز موضوع القيادة الإدارية هو كثرة ما كتب عنه وتنوعه، وبصفة خاصة في مجال تحديد الأنماط القيادية", "locate": "فقرة بعد قائمة الأنماط"}, {"page": 77, "section": "4-3 أدوات التوجيه (القيادة)", "q": ["القيادة التسلطية (Autocratic) هي", "النمط الذي يقوم فيه القائد بكل العمل ويتخذ القرارات بنفسه دون الرجوع إلى مرؤوسيه ولا يقر بأخطائه هو ......", "Autocratic"], "a": "القيادة التسلطية: يقوم القائد بكل العمل، ويتخذ القرارات بنفسه دون الرجوع إلى مرؤوسيه، ولا يقر ب
