const FN=Math.max(1,FX.length);
const idf=w=>Math.log(1+(FN-(FDF[w]||0)+.5)/((FDF[w]||0)+.5));
function wfrac(src,dst){ const d=new Set(dst); let h=0,t=0; new Set(src).forEach(w=>{const v=idf(w); t+=v; if(d.has(w)) h+=v;}); return t?h/t:0; }
function sim(a,b){ return (wfrac(a,b)+wfrac(b,a))/2; }
const NEG=new Set(['لا','ليس','ليست','غير','لم','لن','عدم','ولا']);
const hasNeg=s=>norm(s).split(' ').some(w=>NEG.has(w));
const ALL_RE=/(جميع|كل)\s*ما\s*سبق|جميع\s*الاجابات|كل\s*الاجابات/;

function splitOptions(raw){
  const m=(' '+raw).split(/\s[(\[]?(أ|ب|ج|د|a|b|c|d)\s*[)\]\-.:]\s*/i);
  if(m.length>=5){ const stem=m[0]; const opts=[]; for(let i=2;i<m.length;i+=2) if(m[i]&&m[i].trim()) opts.push(m[i].trim()); if(opts.length>=2) return {stem, opts}; }
  const lines=raw.split(/\n+/).map(s=>s.replace(/^[\s\-•*·\d.)(]+/,'').trim()).filter(Boolean);
  if(lines.length>=3) return {stem:lines[0], opts:lines.slice(1)};
  return {stem:raw, opts:[]};
}
function rankFacts(text, mode){
  const t=toks(text);
  return FX.map((x,i)=>{
    const qv=Math.max(0,...x.qs.map(q=>sim(t,q)));
    const body=sim(t,[...x.tt,...x.qu,...x.at]);
    const tf= mode==='tf' ? Math.max(sim(t,x.tt),...x.ft.map(f=>sim(t,f)),0) : 0;
    const s = mode==='tf' ? Math.max(tf, 0.85*body, 0.7*qv) : Math.max(qv, 0.8*body);
    return {i,s};
  }).sort((a,b)=>b.s-a.s);
}
function answerMcq(raw){
  const {stem,opts}=splitOptions(raw);
  const r=rankFacts(stem||raw,'mcq'); if(!r.length||r[0].s<0.18) return null;
  let best=r[0];
  // with options: prefer the top fact whose answer covers one of the options well
  let choice=null;
  if(opts.length){
    const cand=r.slice(0,6).map(c=>{
      const x=FX[c.i], factT=[...x.at,...x.tt,...x.qu];
      const cov=opts.map(o=>ALL_RE.test(norm(o))?-1:wfrac(toks(o),factT));
      return {c,cov,top:Math.max(...cov)};
    });
    const pick=cand.find(z=>z.top>=0.6 && z.c.s>=r[0].s*0.8) || cand[0];
    best=pick.c;
    const strong=pick.cov.filter(v=>v>=0.6).length, allIx=opts.findIndex(o=>ALL_RE.test(norm(o)));
    if(allIx>=0 && strong>=2) choice=opts[allIx];
    else if(pick.top>=0.4) choice=opts[pick.cov.indexOf(pick.top)];
  }
  return {fact:FACTS[best.i], score:best.s, choice, alts:r.slice(1,4).filter(a=>a.s>r[0].s*0.6).map(a=>FACTS[a.i])};
}
function answerTf(raw){
  const r=rankFacts(raw,'tf'); if(!r.length||r[0].s<0.2) return null;
  const x=FX[r[0].i], f=FACTS[r[0].i], t=toks(raw);
  const sT=Math.max(sim(t,x.tt), 0.95*sim(t,x.qu)), sF=Math.max(0,...x.ft.map(ff=>sim(t,ff)));
  let ok = sT>=sF;
  // words in the statement that the book's sentence does not contain (swapped key words)
  const known=new Set([...x.tt,...x.qu,...x.at,...x.qs.flat()]);
  const foreign=t.filter(w=>!known.has(w));
  const fw=foreign.reduce((a,w)=>a+idf(w),0)/Math.max(1e-9,t.reduce((a,w)=>a+idf(w),0));
  if(ok && fw>0.18 && x.ft.some(ff=>foreign.some(w=>ff.includes(w)))) ok=false;
  if(hasNeg(raw)!==hasNeg(f.true)) ok=!ok;
  const sure = r[0].s>=0.5 && (Math.abs(sT-sF)>0.06 || hasNeg(raw)!==hasNeg(f.true));
  return {fact:f, ok, sure, score:r[0].s, alts:r.slice(1,4).filter(a=>a.s>r[0].s*0.6).map(a=>FACTS[a.i])};
}

/* verify a quote against the book: returns {page, exact} */
function locateQuote(quote, claimed){
  const nq=norm(quote); if(nq.length<8) return null;
  const pages = BOOK.map(p=>({page:p.page, n:norm(p.text)}));
  const hit = pages.find(p=>p.page===claimed && p.n.includes(nq)) || pages.find(p=>p.n.includes(nq));
  if(hit) return {page:hit.page, exact:true};
  // fuzzy: share of quote tokens present on page
  const qt=toks(quote); let best=null;
  pages.forEach(p=>{ const pt=new Set(toks(p.n)); const r=qt.filter(w=>pt.has(w)).length/qt.length; if(!best||r>best.r||(r===best.r&&p.page===claimed)) best={page:p.page,r}; });
  return best && best.r>=0.75 ? {page:best.page, exact:false, r:best.r} : null;
}

/* ---------- Claude ---------- */
let samplePromise = (window.claude && window.claude.use) ? window.claude.use('sample').catch(()=>null) : Promise.resolve(null);
const BOOK_TEXT = BOOK.map(p=>`<<صفحة ${p.page}>> [${p.section}]\n${p.text}`).join('\n\n');

function buildPrompt(mode,q){
  const common = `أنت مساعد دقيق جدًا لطالب يذاكر كتاب «المهارات الإدارية» (السعودية، 1448هـ). ستجد أدناه النص الكامل للفصول من الأول إلى الرابع، وكل صفحة مسبوقة بعلامة <<صفحة N>> حيث N هو رقم الصفحة المطبوع في الكتاب.

قواعد صارمة:
- أجب فقط مما هو مكتوب في نص الكتاب أدناه. لا تضف أي معلومة من خارجه ولا تستنتج ما ليس مكتوبًا.
- "page" يجب أن يكون رقم الصفحة التي ورد فيها الجواب نصًا (من علامة <<صفحة N>>).
- "quote" جملة أو مقطع منقول حرفيًا كما هو من تلك الصفحة (بدون تغيير كلمة)، وهو الذي يثبت الإجابة. من 6 إلى 40 كلمة.
- "locate": وصف قصير لمكان الإجابة في الصفحة ليجدها الطالب بسرعة، مثل: «تحت عنوان: تعريف الإدارة — التعريف الثاني» أو «في الجدول، الصف الثالث».
- "section": عنوان الدرس كما في الكتاب.
- إن لم تجد الإجابة في النص فاجعل "found": false ولا تخمّن.
- اكتب بالعربية الفصحى المختصرة.`;
  const spec = mode==='mcq'
  ? `السؤال الذي كتبه الطالب (قد يحتوي خيارات أ/ب/ج/د أو بدون خيارات):
«${q}»

أعد JSON فقط بهذا الشكل:
{"found":true,"answer":"الإجابة الصحيحة مختصرة كما في الكتاب","choice":"نص الخيار الصحيح حرفيًا من الخيارات التي كتبها الطالب، أو null إن لم يكتب خيارات","page":34,"section":"...","locate":"...","quote":"..."}`
  : `العبارة التي كتبها الطالب ويريد معرفة هل هي صحيحة أم خاطئة حسب الكتاب:
«${q}»

أعد JSON فقط بهذا الشكل:
{"found":true,"verdict":"صح" أو "خطأ","correct":"العبارة الصحيحة كما في الكتاب (إن كانت العبارة صحيحة فأعدها مصاغة كما في الكتاب)","why":"سطر واحد يوضح موضع الخطأ إن كانت خاطئة، أو فارغ","page":34,"section":"...","locate":"...","quote":"..."}`;
  return common + '\n\n' + spec + '\n\n===== نص الكتاب =====\n' + BOOK_TEXT;
}

/* ---------- UI ---------- */
const app=document.getElementById('app'), backBtn=document.getElementById('back');
backBtn.onclick=()=>{ location.hash=''; home(); };
let ctl=null;

function home(){
  backBtn.hidden=true; if(ctl) ctl.abort();
  app.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:16px">
    <p class="muted" style="margin:0">اكتب سؤالك أو العبارة، ويرد عليك الجواب من الكتاب نفسه مع <b>رقم الصفحة المطبوع في الكتاب</b> ومكان الجواب فيها.</p>
    <div class="tiles">
      <button class="tile" id="go-mcq"><span class="ico">؟</span><h2>اختيارات</h2><p>اكتب السؤال (ومعه الخيارات إن وجدت) وخذ الإجابة الصحيحة ورقم صفحتها.</p></button>
      <button class="tile" id="go-tf"><span class="ico">✓✗</span><h2>صح وخطأ</h2><p>اكتب العبارة وتعرف هل هي صح أو خطأ، ومع الخطأ تجيك العبارة الصحيحة وصفحتها.</p></button>
    </div>
    <div class="scope"><h3>نطاق المجيب</h3>
      <div class="chapters">${CHAPTERS.map(c=>`<span>${c[0]}<b>ص ${c[1]}–${c[2]}</b></span>`).join('')}</div>
    </div>
  </div>`;
  document.getElementById('go-mcq').onclick=()=>mode('mcq');
  document.getElementById('go-tf').onclick=()=>mode('tf');
}

function getHist(m){ try{ return JSON.parse(localStorage.getItem('h-'+m)||'[]'); }catch(e){ return []; } }
function addHist(m,q){ try{ const h=[q,...getHist(m).filter(x=>x!==q)].slice(0,6); localStorage.setItem('h-'+m,JSON.stringify(h)); }catch(e){} }

function mode(m){
  location.hash=m; backBtn.hidden=false;
  const isMcq=m==='mcq';
  const hist=getHist(m);
  app.innerHTML=`
  <div style="display:flex;flex-direction:column;gap:16px">
    <form class="ask" id="form">
      <label for="q">${isMcq?'اختيارات: اكتب السؤال':'صح وخطأ: اكتب العبارة'}</label>
      <textarea id="q" placeholder="${isMcq?'مثال: من مستويات الإدارة: (أ) العليا (ب) الوسطى (ج) الإشرافية (د) جميع ما سبق':'مثال: التخطيط هو أول وظائف الإدارة'}"></textarea>
      <div class="row"><button class="btn primary" id="ask" type="submit">${isMcq?'أعطني الإجابة':'صح ولا خطأ؟'}</button><span class="hint">Ctrl + Enter للإرسال</span></div>
      ${hist.length?`<div class="hist">${hist.map(h=>`<button type="button" data-h="${esc(h)}">${esc(h)}</button>`).join('')}</div>`:''}
    </form>
    <div id="out"></div>
    <div id="local"></div>
  </div>`;
  const ta=document.getElementById('q');
  ta.focus();
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); run(m); } });
  document.getElementById('form').addEventListener('submit',e=>{ e.preventDefault(); run(m); });
  app.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{ ta.value=b.dataset.h; run(m); });
}

function renderLocal(q){
  const r=search(q,4), el=document.getElementById('local');
  if(!r.length){ el.innerHTML=''; return; }
  el.innerHTML=`<div class="matches"><h3>أقرب المواضع في الكتاب</h3>${r.map(c=>`
    <div class="m"><div class="pg"><small>صفحة</small><b>${c.page}</b></div>
    <div class="body"><span class="s">${esc(c.section)}</span><span class="x">${highlight(c.text,q)}</span></div></div>`).join('')}</div>`;
}

async function run(m){
  const q=document.getElementById('q').value.trim(); if(!q) return;
  addHist(m,q);
  const out=document.getElementById('out'), btn=document.getElementById('ask');
  renderLocal(q);
  if(ctl) ctl.abort();
  showBank(m,q);
}

function factToR(m,f,extra){
  return m==='mcq'
    ? {found:true, answer:f.a, choice:extra.choice, page:f.page, section:f.section, locate:f.locate, quote:f.quote}
    : {found:true, verdict:extra.ok?'صح':'خطأ', correct:f.true, page:f.page, section:f.section, locate:f.locate, quote:f.quote};
}
function showBank(m,q){
  const out=document.getElementById('out');
  const res = m==='mcq' ? answerMcq(q) : answerTf(q);
  if(!res){ out.innerHTML=`<div class="answer"><div class="err">ما لقيت هذه المعلومة في الفصول 1–4. جرّب تكتب السؤال بكلمات الكتاب، أو شوف أقرب المواضع بالأسفل.</div>${deepBtn()}</div>`; wireDeep(m,q); return; }
  const low = m==='mcq' ? res.score<0.4 : !res.sure;
  const note = low ? `<div class="err">${m==='tf'?'تأكد بنفسك: قارن عبارتك بالعبارة الصحيحة تحت (هل فيها كلمة متبدلة؟).':'تأكد إن هذا هو المقصود بسؤالك، وإلا شوف الاحتمالات الثانية تحت.'}</div>` : '';
  showAnswer(m,q,factToR(m,res.fact,res),'bank');
  const card=out.querySelector('.answer');
  card.insertAdjacentHTML('beforeend', note + (res.alts.length?`<div class="alts"><div class="lbl">قد تقصد أيضًا</div>${res.alts.map((f,i)=>`<button type="button" class="alt" data-alt="${i}"><b>ص ${f.page}</b> ${esc(f.q[0])}</button>`).join('')}</div>`:'') + deepBtn());
  card.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{
    const f=res.alts[+b.dataset.alt];
    const ex = m==='mcq' ? {choice:null} : (()=>{ const t=answerTf(q); return {ok: t&&t.fact===f ? t.ok : sim(toks(q),toks(f.true))>=Math.max(0,...f.false.map(x=>sim(toks(q),toks(x))))}; })();
    showAnswer(m,q,factToR(m,f,ex),'bank'); out.querySelector('.answer').insertAdjacentHTML('beforeend',deepBtn()); wireDeep(m,q);
  });
  wireDeep(m,q);
}
function deepBtn(){ return SAMPLE_OK ? `<div class="row"><button type="button" class="btn" id="deep">تحقق أعمق بالذكاء الاصطناعي</button><span class="hint">يقرأ الفصول كاملة (يأخذ ثواني)</span></div>` : ''; }
function wireDeep(m,q){ const b=document.getElementById('deep'); if(b) b.onclick=()=>runDeep(m,q); }

let SAMPLE_OK=false;
samplePromise.then(s=>{ SAMPLE_OK=!!s; });

async function runDeep(m,q){
  const out=document.getElementById('out'), btn=document.getElementById('ask');
  const sample=await samplePromise; if(!sample) return;
  if(ctl) ctl.abort(); ctl=new AbortController();
  btn.disabled=true;
  out.innerHTML=`<div class="answer"><div class="status"><span class="spin"></span>يبحث في الكتاب ويتحقق من رقم الصفحة…</div><div class="row"><button class="btn" id="stop" type="button">إيقاف</button></div></div>`;
  document.getElementById('stop').onclick=()=>ctl.abort();
  try{
    const r=await sample.json(buildPrompt(m,q),{signal:ctl.signal, modelTier:'default', cache:{gcTime:86400000}});
    showAnswer(m,q,r||{});
  }catch(e){
    const msg = e&&e.code==='cancelled' ? 'تم الإيقاف.'
      : e&&(e.code==='not_granted'||e.code==='sampling_disabled') ? 'لم يُسمح للصفحة باستخدام Claude، فلا يظهر إلا البحث المحلي بالأسفل.'
      : e&&e.code==='rate_limited' ? 'طلبات كثيرة خلال وقت قصير. انتظر قليلًا ثم أعد المحاولة.'
      : e&&e.code==='invalid_json' ? 'وصل رد غير مكتمل. اضغط الزر مرة ثانية.'
      : 'تعذر الاتصال الآن. اضغط الزر مرة ثانية.';
    out.innerHTML=`<div class="err">${msg}</div>`;
  }finally{ btn.disabled=false; }
}

function showAnswer(m,q,r){
  const out=document.getElementById('out');
  if(r.found===false || !r.page){
    out.innerHTML=`<div class="answer"><div class="err">ما لقيت هذه المعلومة في الفصول من 1 إلى 4. راجع صياغة السؤال، أو شوف أقرب المواضع بالأسفل.</div></div>`;
    return;
  }
  let page=Number(r.page), check='';
  const v=locateQuote(r.quote||'', page);
  if(v && v.exact){
    if(v.page!==page) page=v.page;
    check=`<span class="check ok">✓ النص موجود حرفيًا في صفحة ${page}</span>`;
  } else if(v){
    if(v.page!==page) page=v.page;
    check=`<span class="check ok">✓ مطابق لمحتوى صفحة ${page}</span>`;
  } else {
    check=`<span class="check warn">تحقق بنفسك: لم أجد النص المنقول حرفيًا، راجع أقرب المواضع بالأسفل</span>`;
  }
  const sec = (BOOK.find(p=>p.page===page)||{}).section || r.section || '';
  const loc=`<div class="loc"><div class="tab"><small>صفحة</small><b>${page}</b></div>
    <div class="loc-info"><span class="sec">${esc(sec)}</span>${r.locate?`<span class="where">${esc(r.locate)}</span>`:''}${check}</div></div>`;
  const quote = r.quote ? `<div><div class="lbl">من الكتاب</div><div class="quote"><mark>${esc(r.quote)}</mark></div></div>` : '';
  let main='';
  if(m==='mcq'){
    main=`<div><div class="lbl">الإجابة</div><div class="ans-text">${esc(r.answer||'')}</div></div>
      ${r.choice?`<div><div class="lbl">الخيار الصحيح</div><span class="choice">${esc(r.choice)}</span></div>`:''}`;
  } else {
    const ok = String(r.verdict||'').trim()==='صح';
    main=`<div class="verdict ${ok?'ok':'bad'}"><span class="mk">${ok?'✓':'✗'}</span>العبارة ${ok?'صحيحة':'خاطئة'}</div>
      ${r.correct?`<div><div class="lbl">${ok?'العبارة كما في الكتاب':'العبارة الصحيحة'}</div><div class="correct">${esc(r.correct)}</div></div>`:''}
      ${!ok&&r.why?`<div class="muted" style="font-size:15px">${esc(r.why)}</div>`:''}`;
  }
  out.innerHTML=`<div class="answer">${loc}${main}${quote}</div>`;
}

(location.hash==='#mcq'||location.hash==='#tf') ? mode(location.hash.slice(1)) : home();
</script>
</body></html>
