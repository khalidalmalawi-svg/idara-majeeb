<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>مُجيب المهارات الإدارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: one study column. Home = two mode tiles; mode = search bar, then answer card (verdict, page tab, highlighted quote), then local matches. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --sunk:#E8EAF0; --line:#D3D7E2;
  --ink:#161B2E; --muted:#5B6278;
  --accent:#27408B; --accent-soft:#DFE5F6; --on-accent:#FFFFFF;
  --marker:#FFE68A; --marker-ink:#3A2F00;
  --ok:#1C7A44; --ok-soft:#DDF1E5; --bad:#B3313A; --bad-soft:#F7DEE0; --warn:#946200; --warn-soft:#F7ECD2;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1220; --surface:#171B2C; --sunk:#20253A; --line:#2E3550;
  --ink:#E6E8F0; --muted:#9AA1B8;
  --accent:#8EA6F0; --accent-soft:#232D52; --on-accent:#0D1430;
  --marker:#5C4D12; --marker-ink:#FFF3C4;
  --ok:#62CE8D; --ok-soft:#163223; --bad:#F0838A; --bad-soft:#3A1C20; --warn:#E5B54F; --warn-soft:#352A12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1220; --surface:#171B2C; --sunk:#20253A; --line:#2E3550;
  --ink:#E6E8F0; --muted:#9AA1B8;
  --accent:#8EA6F0; --accent-soft:#232D52; --on-accent:#0D1430;
  --marker:#5C4D12; --marker-ink:#FFF3C4;
  --ok:#62CE8D; --ok-soft:#163223; --bad:#F0838A; --bad-soft:#3A1C20; --warn:#E5B54F; --warn-soft:#352A12; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.8;margin:0}
.wrap{max-width:780px;margin:0 auto;padding-inline:16px;padding-block:22px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.35;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}

.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head .t{display:flex;flex-direction:column;min-width:0}
.head small{color:var(--muted);font-size:13px}
.head h1{font-size:clamp(22px,4.6vw,30px)}
.back{margin-inline-start:auto;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 14px;font-size:14px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{display:flex;flex-direction:column;gap:8px;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:22px;transition:border-color .15s, transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-family:var(--f-display);font-weight:700;font-size:20px}
.tile h2{font-size:22px}
.tile p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.7}
.scope{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.scope h3{font-size:16px}
.chapters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font-size:14px}
.chapters span{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding-block:3px}
.chapters b{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:600}

.ask{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.ask label{font-weight:600;font-size:15px}
.ask textarea{font:inherit;font-size:17px;line-height:1.7;width:100%;min-height:96px;resize:vertical;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);color:var(--ink)}
.ask textarea:focus{outline:none;border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:11px;padding:10px 22px;font-family:var(--f-display);font-weight:600;background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:13px;color:var(--muted)}

.answer{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.loc{display:flex;gap:14px;align-items:stretch}
.tab{flex:none;min-width:92px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 10px;line-height:1.2}
.tab small{font-size:12px;opacity:.85}
.tab b{font-family:var(--f-display);font-size:34px;font-variant-numeric:tabular-nums}
.loc-info{display:flex;flex-direction:column;gap:4px;min-width:0;justify-content:center}
.loc-info .sec{font-weight:600}
.loc-info .where{font-size:14px;color:var(--muted)}
.check{font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center;padding:2px 10px;border-radius:999px;width:fit-content}
.check.ok{background:var(--ok-soft);color:var(--ok)} .check.warn{background:var(--warn-soft);color:var(--warn)}
.verdict{font-family:var(--f-display);font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.verdict .mk{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:22px}
.verdict.ok .mk{background:var(--ok)} .verdict.bad .mk{background:var(--bad)}
.ans-text{font-size:18px;font-weight:500;line-height:1.85}
.lbl{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.01em}
.correct{background:var(--ok-soft);border-radius:12px;padding:12px 14px;font-size:17px;font-weight:500}
.choice{display:inline-block;background:var(--ok-soft);color:var(--ok);border-radius:10px;padding:4px 12px;font-weight:700}
.quote{border-inline-start:4px solid var(--accent);padding:6px 14px;font-size:16px;line-height:1.95}
.quote mark{background:var(--marker);color:var(--marker-ink);padding:0 2px;border-radius:3px}
.status{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:15px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.err{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:15px}

.matches{display:flex;flex-direction:column;gap:10px}
.matches h3{font-size:16px}
.m{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.m .pg{flex:none;width:56px;border-radius:10px;background:var(--sunk);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.m .pg small{font-size:11px;color:var(--muted)}
.m .pg b{font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums;color:var(--accent)}
.m .body{min-width:0;display:flex;flex-direction:column;gap:2px}
.m .s{font-size:12.5px;color:var(--muted);font-weight:600}
.m .x{font-size:15px;line-height:1.85}
.m mark{background:var(--marker);color:var(--marker-ink);padding:0 2px;border-radius:3px}

.alts{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.alt{text-align:start;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14.5px;line-height:1.6}
.alt:hover{border-color:var(--accent)}
.alt b{color:var(--accent);font-variant-numeric:tabular-nums;margin-inline-end:6px}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 12px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

@media (max-width:560px){
  .tiles{grid-template-columns:1fr}
  .chapters{grid-template-columns:1fr}
  .tab{min-width:76px} .tab b{font-size:28px}
  .verdict{font-size:22px}
}
</style>

<script>
const BOOK = [{"page": 7, "section": "الفصل الأول: مدخل إلى المهارات الإدارية", "text": "الفصل الأول\nمدخل إلى المهارات الإدارية\nالمواضيع:\n1. الإدارة (المفهوم - الأهمية - المستويات).\n2. مجالات الإدارة.\n3. المهارات الإدارية."}, {"page": 8, "section": "1-1 الإدارة (المفهوم، الأهمية، المستويات)", "text": "1-1 الإدارة (المفهوم، الأهمية، المستويات)\nالفكرة المحورية: التعرف على مفهوم الإدارة وأهميتها ومستوياتها.\nالمفاهيم الرئيسة: مفهوم الإدارة - أهمية الإدارة - مستويات الإدارة\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. استنتاج مفهوم الإدارة.\n2. شرح أهمية الإدارة.\n3. التعرف على مستويات الإدارة.\n\nتستخدم الإدارة استخدامًا واسعًا في حياتنا اليومية، ومن أجل الوصول إلى فهم عام للمهارات الإدارية لابدَّ من التطرق إلى تعريف الإدارة، والتعرف على أهميتها في الحياة العملية، وهل هي علم كبقية العلوم الأخرى؟ أم مهارة تحتاج إلى التطبيق؟ وما أهم التحديات التي تواجه إدارة المنظمات المعاصرة؟\nوفي هذا الموضوع سنتعرف على مفهوم الإدارة، وأهميتها، ومستوياتها.\n\nالهدف الأول: أن يكون الطلبة قادرين على استنتاج مفهوم الإدارة.\nتعريف الإدارة:\nتعددت التعريفات التي وضعها المتخصصون في مفهوم الإدارة؛ نورد منها ما يأتي:\n■ أن تعرف بالضبط ماذا تريد؟ ثم تتأكد من أن الأفراد يؤدونه بأحسن طريقة ممكنة، وأقلها تكلفة.\n■ استغلال الموارد المتاحة عن طريق تنظيم الجهود الجماعية، وتنسيقها تنسيقًا يحقق الأهداف المحددة بكفاءة وفاعلية.\n■ النشاط الخاص بقيادة الجهود البشرية وتوجيهها، وتخطيط عناصر الإنتاج الأخرى وتنظيمها، وتحقيق الرقابة عليها بقصد الوصول إلى الأهداف التي تسعى إليها المنظمة."}, {"page": 9, "section": "1-1 الإدارة (المفهوم، الأهمية، المستويات)", "text": "[نشاط تطبيقي]\nهل لك أن تتخيل وضع المدرسة لو لم يكن لها إدارة؟\n• اكتب ما يمكن أن تكون عليه المدرسة.\n• ما الأعمال التي تقوم بها إدارة المدرسة؟"}, {"page": 10, "section": "1-1 الإدارة (المفهوم، الأهمية، المستويات)", "text": "الهدف الثاني: أن يكون الطلبة قادرين على شرح أهمية الإدارة.\nأهمية الإدارة:\nتمثل الإدارة أهم الوسائل التي يمكن أن يستثمرها الفرد كما تستثمرها المنظمة والدولة من أجل تحقيق أسباب الرخاء والأمن والتقدم؛ فعن طريق الإدارة يتحدد مستوى التعليم، والأمن، والعدل، والرعاية الصحية، والرعاية الاجتماعية، والزراعة، والصناعة، والإسكان، والاتصالات، والمواصلات، وكافة أوجه النشاطات والخدمات التي يحتاج إليها الفرد والمجتمع.\nلقد زادت أهمية الإدارة في وقتنا الراهن بسبب التغيرات الاجتماعية والاقتصادية والتقنية التي تركت أثرها على جميع المجتمعات؛ لأنه دون وجود إدارة ذات كفاءة عالية فإننا لن نستطيع أن نعمل على تحديد أهدافنا، ولا أن نرسم المسارات التي يمكن أن نصل من خلالها إلى تحقيق هذه الأهداف.\nمما سبق يمكن أن نخلص إلى أن الإدارة تمثل عنصرًا مهمًا في حياة الفرد والمنظمة والمجتمع.\nويمكن القول بأن هناك عددًا من العوامل أسهمت في زيادة أهمية الإدارة؛ ومن أبرزها ما يأتي:\n01: الإدارة وسيلة المجتمع لتحقيق أهدافه، وتلبية احتياجات أفراده؛ وذلك من خلال ممارسة المهارات الإدارية لتحديد أولويات هذه الاحتياجات، واستثمار الموارد المتاحة فيه.\n02: ازدياد عدد المنظمات الإدارية، وكبر حجمها، وتنوع أعمالها فرض أهمية الإدارة من حيث حاجة هذه المنظمات إلى التخصصات الإدارية المختلفة.\n03: الفصل بين منظمات الأعمال وملاكها؛ مما دفع ملاك أغلب هذه المنظمات إلى إسناد إدارتها إلى أفراد مختصين في الإدارة؛ مما يزيد من أهمية الإدارة، والإعداد اللازم لمن يقومون عليها.\n04: المنافسة الشديدة في الأسواق العالمية؛ الأمر الذي يتطلب التجديد والابتكار؛ من خلال الإدارة الجيدة لطرق الإنتاج والتسويق؛ لذلك ازدادت المنافسة بين الشركات على اجتياح الأسواق العالمية.\nرغبة الأفراد في الوصول إلى مراكز اجتماعية وقيادية متميزة؛ هذه الرغبة في تحسين المستقبل الوظيفي للأفراد دفعت الكثير منهم إلى الاتجاه لدراسة الإدارة من أجل تنمية معارفهم ومهاراتهم الإدارية؛ بما يمكنهم من التعامل مع مشاكل تقديم الخدمات، والإنتاج، والتسويق، والتمويل، وإدارة الأفراد في المنظمات التي يعملون بها."}, {"page": 11, "section": "1-1 الإدارة (المفهوم، الأهمية، المستويات)", "text": "[نشاط تطبيقي]\nمن خلال العوامل السابقة التي توضّح أهمية الإدارة؛ بيّن أهمية الإدارة ودورها في حياتنا في ضوء المجالات الآتية:\n(شعارات: وزارة الصحة - وزارة التعليم - وزارة التجارة)\n\nالهدف الثالث: أن يكون الطلبة قادرين على التعرف على مستويات الإدارة.\nالمدير (Manager) هو الفرد الذي ينجز عملًا معينًا من خلال مرؤوسيه بغض النظر عن مستواه الإداري؛ حيث يقوم بوظائف التخطيط والتنظيم وتوجيه الآخرين والإشراف عليهم، والرقابة، وذلك بحكم منصبه؛ لتحقيق الأهداف المحددة.\nوتختلف المستويات الإدارية من منظمة الأخرى، فكلما زاد حجم المنظمة وطاقتها الإنتاجية وعدد العاملين فيها زادت المستويات الإدارية؛ حيث تقسم المستويات الإدارية إلى ثلاثة مستويات.\nشكل (هرم): مستويات الإدارة: 01 الإدارة العليا (قمة الهرم) ← 02 الإدارة الوسطى ← 03 الإدارة التنفيذية (قاعدة الهرم)"}, {"page": 12, "section": "1-1 الإدارة (المفهوم، الأهمية، المستويات)", "text": "أولًا: مستوى الإدارة العليا (Top- Level Management):\nيوجد هذا المستوى في قمة الهرم التنظيمي للمنظمة، ويحتله مديرو الإدارة العليا؛ كالمدير العام، والمدير التنفيذي، ونائب المدير العام، وفيما يأتي بعض مسؤوليات هذا المستوى:\n1. رسم السياسات والاستراتيجيات، وتحديد الأهداف الشاملة للمنظمة.\n2. توجيه عملية التفاعل بين المنظمة والبيئة المحيطة بها.\n3. وضع الخطط المستقبلية الكفيلة بتحقيق الأهداف المحددة.\n4. وضع الهيكل التنظيمي للمنظمة، وتحديد المستويات الإدارية، وتوزيع المراكز الوظيفية.\n\nثانيًا: مستوى الإدارة الوسطى (Middle-Level Management):\nيمثل هذا المستوى أكبر مجموعة من المديرين في المنظمة بأسماء مختلفة؛ مدير العمليات، مدير القسم، مدير المصنع، ونحوها، ويختص هذا المستوى بالإشراف على النشاطات الكفيلة بتنفيذ السياسات والاستراتيجيات التي حددتها الإدارة العليا، ويضعونها موضع التطبيق من جانب الإدارة في مستوى الإدارة الدنيا.\nوفيما يأتي بعض المسؤوليات التي يعنى بها هذا المستوى من الإدارة:\n1. وضع الخطط الفرعية في ضوء الخطة العامة التي تضعها الإدارة العليا؛ مثل خطة الرواتب، وخطة الإنتاج، وخطة المبيعات وخطة المشتريات، وغيرها.\n2. استخدام الهيكل التنظيمي لتحديد السلطة للعاملين في المنظمة، والمسؤولية التي يتحملونها.\n3. تحديد معايير الرقابة والأداء في الإدارات والأقسام المختلفة.\n4. الإسهام في وضع السياسة والخطة العامة من خلال تقديم البيانات والمعلومات للإدارة العليا.\n\nثالثًا: مستوى الإدارة التنفيذية (Lower-Level Management):\nيطلق على هذا المستوى اسم الإدارة المباشرة، أو الإدارة الإشرافية، أو خط الإشراف الأول، ويمثل المستوى الأدنى- أو القاعدة- للهرم التنظيمي. ويطلق على المديرين في هذا المستوى اسم المشرفين؛ إذ يشرفون مباشرة على العمال التشغيليين معظم الوقت داخل ورش العمل.\nوعمومًا فإن هذا المستوى يقوم بما يأتي:\n1. الإشراف العام على مستوى تنفيذ الخطط والبرامج والأنشطة.\n2. تقويم أداء العاملين للأنشطة، والعمل على تصحيح الأخطاء المكتشفة مباشرة.\n3. إرشاد العاملين من خلال خريطة تنظيمية مبيّن عليها موقع كل مستوى إداري بالنسبة للآخر."}, {"page": 13, "section": "1-1 الإدارة (المفهوم، الأهمية، المستويات)", "text": "[نشاط تطبيقي]\nابحث في مصادر التعلم عن الهيكل التنظيمي لوزارة التعليم؛ وحدد المستويات الإدارية، ودور كل مستوى.\n\n[نشاطات مقترحة]\n■ بعد زيارتك لإحدى المنظمات الإدارية؛ اكتب تقريرًا عمَّا لاحظته عن المستويات الإدارية، وأسماء الإدارات، والأقسام، والمسؤوليات المنوطة بها."}, {"page": 14, "section": "1-1 الإدارة (المفهوم، الأهمية، المستويات)", "text": "[التقويم]\nأجب عن الأسئلة الآتية:\n■ من وجهة نظرك اذكر تعريف الإدارة.\n■ بين أهمية الإدارة على مستوى الفرد.\n■ عدد المستويات الإدارية، موضحًا دور كل مستوى منها.\n■ ضع علامة (✓) أمام الجملة الصحيحة وعلامة (✗) أمام الجملة غير الصحيحة لما يأتي:\n- المدير العام من الأمثلة على الإدارة الوسطى. ( )\n- تُعرف الإدارة بأنها استغلال الموارد المتاحة عن طريق تنظيم الجهود الجماعية وتنسيقها تنسيقًا يحقق الأهداف المحددة بكفاية وفاعلية. ( )\n- المدير هو الفرد الذي ينجز عملًا معينًا من خلال مرؤوسيه بشرط أن يكون في المستوى الإداري الأعلى. ( )"}, {"page": 15, "section": "1-2 مجالات الإدارة", "text": "1-2 مجالات الإدارة\nالفكرة المحورية: التعرف على أهم مجالات الإدارة.\nالمفاهيم الرئيسة: الإدارة العامة - إدارة الأعمال - إدارة الهيئات والمنظمات المتخصصة - الإدارة الإقليمية والدولية - إدارة المؤسسات العامة\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. تعداد مجالات الإدارة.\n2. المقارنة بين مجالات الإدارة.\n\nتتنوع مجالات الإدارة بحسب تنوع قطاعات المجتمع والأهداف التي يسعى كل قطاع إلى تحقيقها؛ فهناك قطاع يسعى إلى المحافظة على النظام، وتحقيق الأمن والعدالة، وتوفير وسائل التنمية والرفاهية لأفراد المجتمع؛ وهذا كله يتطلب إدارة متخصصة تقوم بهذه الأنشطة وتحقق أهدافها. من جانب آخر هناك قطاع آخر يسعى من وراء أنشطته التجارية، والصناعية، والزراعية، والتعليمية، والطبية، وغيرها إلى تحقيق الربح في المقام الأول؛ وإن كان ذلك لا يلغي إسهامه في خدمة المجتمع، وهناك بعض القطاعات الاجتماعية الخيرية والتطوعية على مستوى المجتمع التي تهدف من وراء أنشطتها إلى التعامل مع قضايا خاصة -غالبًا- لا تتعامل الحكومة أو القطاع الخاص معها مباشرة كما هو الحال في الجمعيات العلمية أو الخيرية أو التطوعية، إلى جانب تلك القطاعات السابقة هناك قطاع رابع يتعامل في نشاطه مع قضايا تمس النطاق الإقليمي والدولي؛ وليس مجتمعًا بعينه، وسنتعرف في هذا الموضوع على مجالات الإدارة.\n\nالهدف الأول: أن يكون الطلبة قادرين على تعداد مجالات الإدارة.\nفرض التنوّع في المجتمع إيجاد مجالات متنوعة للإدارة؛ حيث أوجد لكل منها مجاله الخاص بالدراسة والممارسة.\nويمكن تحديد مجالات الإدارة في الآتي:\nشكل: مجالات الإدارة ← (1) الإدارة العامة، (2) إدارة الأعمال، (3) إدارة الهيئات والمنظمات المتخصصة، (4) الإدارة الإقليمية والدولية، (5) إدارة المؤسسات العامة"}, {"page": 16, "section": "1-2 مجالات الإدارة", "text": "[نشاط تطبيقي]\nبعد تعرفك على مجالات الإدارة، وبالاستفادة من مصادر المعلومات المختلفة؛ هات أمثلة لجهات تمثل كل مجال من مجالات الإدارة:\n■ الإدارة العامة: ......\n■ إدارة الأعمال: ......\n■ إدارة الهيئات المتخصصة: ......\n■ إدارة المؤسسات العامة: ......\n■ الإدارة الإقليمية والدولية: ......\n\nالهدف الثاني: أن يكون الطلبة قادرين على المقارنة بين مجالات الإدارة.\nأولًا: الإدارة العامّة:\nالإدارة العامّة هي ممارسة العملية الإدارية في الأجهزة الإدارية للدولة، وتختص بتنفيذ السياسة العامة للدولة؛ بما يحقّق الصالح العام.\nويهدف هذا المجال في الإدارة إلى المحافظة على النظام، وتحقيق الأمن والعدالة، وتوفير وسائل التنمية والرفاهية لأفراد المجتمع؛ مما يتطلب وجود إدارة متخصّصة تقوم بهذه الأنشطة، وتحقّق أهدافها.\n\nثانيًا: إدارة الأعمال:\nإدارة الأعمال تُعرف بأنها إدارة النشاطات والمشروعات ذات الطابع الاقتصادي الهادف لتحقيق الربح.\nوتسعى من خلال أنشطتها التجارية، والصناعية، والزراعية، والتعليمية، والطبية، وغيرها إلى تحقيق الربح في المقام الأول، إضافة إلى إسهامها في خدمة المجتمع.\n\nثالثًا: إدارة الهيئات والمنظمات المتخصصة:\nوتعني بإدارة أوجه النشاط في المنظمات التي تقدم خدماتها إلى فئات خاصّة، ولا تهدف إلى تحقيق الربح.\nوهذا المجال يختلف عن الإدارة العامة في أنه لا يهدف إلى تقديم خدمات عامة؛ إنما يهتم بفئة خاصّة من المجتمع، ومن ناحية أخرى فإنه يختلف عن منظمات الأعمال؛ من حيث إنه لا يهدف لتحقيق أرباح بمفهومها العام، إنما يُوجّه دخلها إلى رعاية الفئة الخاصة بها.\n(صورة: شعار جمعية الأطفال المعوقين - Disabled Children's Association)"}, {"page": 17, "section": "1-2 مجالات الإدارة", "text": "رابعًا: الإدارة الإقليمية والدّولية:\nيختص هذا المجال بإدارة المنظمات التي لها الصفة الإقليمية، أو الدّولية التي لا تتبع أيًّا من الحكومات التي تنشأ في دولها، وتهدف إلى خدمة المجتمع الإقليمي أو العالمي، أو جزء منه مستعينة بالإمكانات التي تقدّمها الدول المشاركة.\n(صورة: شعار مجلس التعاون لدول الخليج العربية)\n\nخامسًا: إدارة المؤسسات العامة:\nالمؤسسات العامة هي مرفق عام يخدم الصالح العام للدولة، ويخضع لسلطتها، وتسير وفقًا لتوجهاتها، ولا يعد تحقيق الربح الهدف الرئيس لها. وقد اتبعت الدول منهجًا جديدًا في الإدارة من خلاله تُنشِئ أجهزة معينة قادرة على ممارسة أنشطتها، وتتسم بالمرونة في اتخاذ قراراتها، وتمثّلت هذه الأجهزة في المؤسسات العامة التي مُنحت الشخصية المعنوية؛ بغرض تحقيق أكبر قدر من الكفاءة والفعالية.\n(صورة: شعار المؤسسة العامة للتأمينات الاجتماعية - General Organization for Social Insurance)\n\n[نشاط تطبيقي]\n(شعارات: المراعي Almarai - منظمة التجارة العالمية World Trade Organization - مسك مؤسسة محمد بن سلمان Misk Mohammed Bin Salman Foundation)\nبرأيك هل هناك اختلاف بين الجهات المذكورة أعلاه؟ وضح ذلك."}, {"page": 18, "section": "1-2 مجالات الإدارة", "text": "[نشاطات مقترحة]\n■ ينقسم الطلاب إلى أربع مجموعات، كل مجموعة تزور إحدى المنظمات في مجال مختلف عن المجموعة الأخرى، ثم تقدم كل مجموعة عرضًا تقديميًا عن المنظمة يتضمن مجال المنظمة، وأهدافها، والمستفيدين من خدماتها، ثم يقارنون بين ما توصلت إليه المجموعات.\n\n[التقويم]\nأجب عن الأسئلة الآتية:\n■ ما المقصود بإدارة الأعمال؟ وما أوجه الاتفاق -والاختلاف- بينها والإدارة العامة؟\n■ ما المقصود بالهيئات والمنظمات المتخصصة؟ وما العناصر الأساسية التي يتضمنها التعريف؟\n■ اربط كل مجالات الإدارة في القائمة الأولى بما يناسبه من القائمة الثانية بوضع الرقم المناسب أمام القائمة الثانية:\nالقائمة الأولى | القائمة الثانية\n1 الإدارة الإقليمية | ( ) شركة أرامكو\n2 إدارة المنظمات والهيئات المتخصصة | ( ) وزارة الاقتصاد والتخطيط\n3 إدارة الأعمال | ( ) مجلس التعاون الخليجي\n4 المؤسسات العامة | ( ) جمعية إنسان"}, {"page": 19, "section": "1-3 المهارات الإدارية", "text": "1-3 المهارات الإدارية\nالفكرة المحورية: التعرف على المهارات الإدارية.\nالمفاهيم الرئيسة: المهارات الإدارية - الإدارة كعلم - الإدارة كمهارة\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. توضيح مفهوم الإدارة بصفتها علمًا، ومهارةً.\n2. استنتاج أهم المهارات الإدارية.\n\nتواجه المنظمات في العصر الراهن العديد من التحديات والصعوبات، ويشكل المديرون أحد أهم العناصر المؤثرة في إدارة هذه المنظمات، والمعنيون بالتعامل مع مثل هذه التحديات من أجل الوصول بالمنظمات إلى تحقيق أهدافها بفعالية وكفاءة.\nوقد كشف الفكر الإداري والممارسة العملية أن نجاح المنظمات أو فشلها مرهون بدرجة كبيرة بمدى تمتع المديرين بالمهارات الإدارية المناسبة لطبيعة الأدوار التي يؤدونها في مختلف المواقع والمستويات التنظيمية.\nوفي هذا الموضوع سنتعرف على أهم هذه المهارات، وكذلك الإجابة على تساؤل \"هل الإدارة علم؟ أم مهارة؟\"، وما أبرز المهارات المطلوبة في مجال الإدارة؟\n\nالهدف الأول: أن يكون الطلبة قادرين على توضيح مفهوم الإدارة كعلم وكمهارةٍ.\nسؤال يتجدد ويُطرح في كل مناسبة في حال بروز قائد إداري دون أن يكون لديه مؤهلًا علميًا في مجال الإدارة.\nهل الإدارة علم؟ أم مهارة؟\nمفهوم الإدارة بصفتها علمًا:\nالتنبؤ في الإدارة من المهام الرئيسة في معظم وظائف الإدارة، وهو تنبؤ قائم على الأسلوب العلمي بعيدًا عن الآراء الشخصية والتخمين.\nيعدُّ بعض المهتمين بعلم الإدارة أن الإدارة علم لأنها تقوم على مجموعة متكاملة من الأسس والمفاهيم والمبادئ العلمية التي اختبرت وثبت صحتها، ويعللون ذلك بما تحويه الإدارة من نظريات علمية ومبادئ تطبيقية تُدرّس في كليات متخصصة؛ بل إن الإدارة أصبحت تضم العديد من فروع المعرفة والتخصصات الفرعية؛ فالإدارة في نظرهم تحتاج إلى الأسلوب العلمي في ممارسة وظائفها من خلال ملاحظة الظواهر والمشكلات الإدارية، وتفسيرها، والتّنبؤ بحدوثها من أجل التحكم بها، أو على الأقل التكيف معها."}, {"page": 20, "section": "1-3 المهارات الإدارية", "text": "مفهوم الإدارة بصفتها مهارة:\nفي حين ذهب البعض لاعتبار الإدارة علمًا له أسسه ونظرياته التي لابد منها لنجاح العملية الإدارية، نجد في المقابل فريق آخر يرى أن الإدارة تعتمد على المهارة وليست علمًا، وهم يدافعون عن وجهة نظرهم هذه بقولهم أنّ النجاح في تطبيق مبادئ وقواعد الإدارة يعتمد بالدرجة الأولى على خصائص الأشخاص، وهم يختلفون فيما بينهم بحسب إمكاناتهم وقدراتهم؛ فالإعداد العلمي وحده لا يضمن وجود الأشخاص الإداريين الناجحين؛ مشيرين إلى العديد من الأمثلة للنجاح الكبير الذي حققه الكثير من الأشخاص دون أن تتاح لهم فرصة الالتحاق بالكليات أو المعاهد المتخصصة، أو دراسة النظريات العلمية الإدارية المتعمقة.\nمن خلال الرأيين السابقين في الإدارة (علم أو مهارة)، ظهر فريق ثالث حاول التوفيق بين هذين الرأيين حيث يرى أن الإداري الناجح لابد له من الإلمام بالأسس والمفاهيم والمبادئ العلمية للإدارة، بالإضافة إلى أهمية اكتسابه للمهارات الإدارية التي يمكن أن يكتسبها من خلال الممارسة، والتجارب والخبرات المختلفة مع مرور الوقت.\n\n[نشاط تطبيقي]\nبُلغت بإدراج اسمك ضمن المرشحين لإدارة المدرسة أسبوعًا كاملًا وطلب منك تقديم احتياجاتك استعدادًا لهذه المهمة، فما المراجع العلمية التي ستحتاجها، وما أهم المهارات التي ستستند عليها خلال فترة إدارتك للمدرسة؟\n\nالهدف الثاني: أن يكون الطلبة قادرين على استنتاج أهم المهارات الإدارية.\nإن المهارات الإدارية التي ستدرسها من المهارات المهمة التي لها علاقة بحياة الإنسان، ويمكن أن نستفيد منها في حياتنا الخاصة والعامة على حد سواء، فمهارة التخطيط لا يخفى مدى أهميتها للجميع؛ فأنت تحتاج للتخطيط للقيام برحلة، أو التخطيط للاستعداد للاختبارات، أو التخطيط لما تريد أن تكون عليه في المستقبل، كما أنك تحتاج لمهارة التنظيم، وكذلك مهارة التوجيه والرقابة، وحل المشكلات و اتخاذ القرارات في العديد من المواقف التي تتطلب منك الاختيار بين عدة بدائل؛ مثل شراء سلعة معينة، اختيار تخصص في الدراسة. وعند دراستك لمهارات السكرتارية والعمل المكتبي فإنك تتمكن من تنظيم أوراقك، وكتبك، والوثائق والملفات التي تحتفظ بها، كما تفيدك في مساعدة أفراد أسرتك في أعمالهم المكتبية، كما تمكنك (يتبع في صفحة 21)"}, {"page": 21, "section": "1-3 المهارات الإدارية", "text": "(تتمة من صفحة 20) من إتقان مهارات الاتصال مع الآخرين، هذا بالإضافة إلى الاستفادة من هذه المهارات في تهيئتك للعمل المكتبي في المؤسسات العامة أو الخاصة.\nإذًا سيتناول هذا المقرر العديد من المهارات الإدارية؛ وهي:\nشكل: التخطيط ← التنظيم ← التوجيه ← الرقابة ← الاتصال ← السكرتارية ← إدارة المشروعات الصغيرة\n\n[نشاط تطبيقي]\nقيم نفسك في المهارات الإدارية الآتية من حيث: الرغبة فيها؟ والقدرة على ممارستها؟ ومدى حاجتك إليها؟\nجدول: المهارة | أرغب في ممارستها | لدي القدرة على ممارستها | أحتاج إلى ممارستها\nمهارة التخطيط | | |\nمهارة التنظيم | | |\nمهارة التوجيه | | |\nمهارة الرقابة | | |\nمهارات الاتصال | | |\nمهارة حل المشكلات واتخاذ القرار | | |\nمهارة السكرتارية | | |\nمهارة إدارة المشروعات الصغيرة | | |"}, {"page": 22, "section": "1-3 المهارات الإدارية", "text": "[نشاطات مقترحة]\n■ بالتنسيق مع إدارة المدرسة؛ مارس بعض الأعمال الإدارية في المدرسة، ثم اكتب تقريرًا عن أبرز الدروس المستفادة من التجربة.\n\n[التقويم]\nأجب عن الأسئلة الآتية:\n■ ما المقصود بالمهارات الإدارية؟\n■ ما أبرز المهارات الإدارية؟\n■ ضع علامة (✓) أمام الجملة الصحيحة وعلامة (✗) أمام الجملة غير الصحيحة لما يأتي:\n- الإدارة هي علم فقط؛ لأنها مجموعة متكاملة من الأسس والمفاهيم والمبادئ العلمية التي اختبرت وثبت صحتها. ( )\n- من الأمثلة على المهارات الإدارية التوجيه وحل المشكلات. ( )\n- التخطيط يكون في مرحلة ما بعد الدراسة فقط، ولا يكون قبل ذلك. ( )"}, {"page": 23, "section": "المشروعات", "text": "المشروعات\nالمشروع الأول:\nعنوان المشروع: التطور التاريخي للإدارة.\nهدف المشروع: تطبيق البحث العلمي في علم الإدارة.\nالفكرة: إعداد بحث علمي عن التطور التاريخي لعلم الإدارة.\n\nالمشروع الثاني:\nعنوان المشروع: مهارات المستويات الإدارية.\nهدف المشروع: استنتاج المهارات الإدارية.\nالفكرة: إعداد تقرير عن الوظائف في كل مستوى من المستويات الإدارية، مع توصيف الوظائف ثم استنتاج المهارات الإدارية المطلوبة لكل مستوى إداري."}, {"page": 24, "section": "المشروعات", "text": "المشروع الثالث:\nعنوان المشروع: المجالات الإدارية.\nهدف المشروع: توصيف المجالات الإدارية.\nالفكرة: إعداد خريطة ذهنية للمجالات الإدارية موضحًا فيها مفهوم كل مجال والغرض منه، وعددًا من الأمثلة للجهات في كل مجال مميزًا كل جهة عن الأخرى."}, {"page": 25, "section": "الفصل الثاني: مهارة التخطيط", "text": "الفصل الثاني\nمهارة التخطيط\nالمواضيع:\n1. التخطيط (المفهوم، الأهمية)\n2. أنواع التخطيط\n3. عناصر التخطيط\n4. خطوات التخطيط"}, {"page": 26, "section": "2-1 التخطيط (المفهوم، الأهمية)", "text": "2-1 التخطيط (المفهوم، الأهمية)\nالفكرة المحورية: التعرف على مفهوم التخطيط وأهميته.\nالمفاهيم الرئيسة: مفهوم التخطيط - أهمية التخطيط.\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. التعرف على مفهوم التخطيط.\n2. توضيح أهمية التخطيط.\n\nبعد أن تعرّفنا في الموضوع السابق على مفهوم الإدارة، وأهميتها، وأهم المهارات الإدارية، سنتناول بداية من هذا الموضوع بتناول أولى المهارات الإدارية؛ وهي التخطيط.\nيُعد التخطيط أحد أهم أسباب النجاح للأفراد والمنظمات والدول؛ فمن خلاله تُوضع الأهداف، وتُصنع القرارات، ويُتنبّأ بالمستقبل، وعندما يغيب التخطيط تنجز الأعمال بعشوائية، وتصبح القرارات مجرد تصرّفات ارتجالية؛ ينتج عنها تبديد للجهود، وتخبّط في مسارات العمل، وانعدام في التنسيق.\nوفي هذا الموضوع سنتناول بمشيئة الله أهم المفاهيم الأساسية في موضوع التخطيط.\n\nالهدف الأول: أن يكون الطلبة قادرين على التعرف على مفهوم التخطيط.\nتعريف التخطيط:\nيُعرّف التخطيط على أنه التحديد في الوقت الحاضر لما سيُفعل في المستقبل.\nكما يُعرّف بأنه عملية دراسة وسائل تنظيم وتوجيه الموارد البشرية والمادية، واختيارها؛ لتحقيق هدف معين، أو بمعنى آخر هو عملية اتخاذ قرارات تؤثر على مستقبل المنظمة."}, {"page": 27, "section": "2-1 التخطيط (المفهوم، الأهمية)", "text": "[نشاط تطبيقي] بمشاركة زملائك نسق لزيارة رائد النشاط في مدرستك للاطلاع على سجل الخطط والبرامج المقرر تنفيذها.\n\nالهدف الثاني: أن يكون الطلبة قادرين على توضيح أهمية التخطيط.\nأهمية التخطيط:\nمن العوامل التي تبيّن أهمية التخطيط، أنه يُسهم بشكل واضح في:\n1. تحديد الأهداف وسُبل تحقيقها.\n2. زيادة الكفاءة والفاعلية للموارد المتاحة.\n3. تحقيق الرقابة والمتابعة المستمرة لسير العمل.\n4. التحديد الدقيق للوقت -والتكلفة- لكل عملية.\n5. المساعدة في اتخاذ القرارات الصائبة.\n6. التنبؤ بالمستقبل الذي يعتمد على جمع المعلومات من الماضي والحاضر؛ لتصوّر أحوال المستقبل.\n\n[نشاط تطبيقي] اذكر بعض الأهداف التي تحتاج فيها للتخطيط في حياتك المستقبلية."}, {"page": 28, "section": "2-1 التخطيط (المفهوم، الأهمية)", "text": "نشاطات مقترحة:\n- اذكر خمسة أهداف في \"رؤية السعودية 2030\"، واذكر النتائج المتوقع تحقيقها من تلك الأهداف.\n\nالتقويم\nأجب عن الأسئلة الآتية:\n- اذكر أبرز عناصر تعريف التخطيط.\n- وضح أهمية التخطيط في اختيار مسارك الدراسي.\n- ضع علامة (✓) أمام الجملة الصحيحة وعلامة (✗) أمام الجملة غير الصحيحة لما يأتي:\n  • كلما كبر حجم المنظمة تقل أهمية التخطيط. (   )\n  • يُعرّف التخطيط على أنه التحديد في الوقت الحاضر لما سيُعمل في المستقبل. (   )\n  • من أهمية التخطيط التحديد الشامل للوقت والتكلفة. (   )"}, {"page": 29, "section": "2-2 أنواع التخطيط", "text": "2-2 أنواع التخطيط\nالفكرة المحورية: التعرف على أنواع التخطيط.\nالمفاهيم الرئيسة: التخطيط - التخطيط طويل الأجل - التخطيط متوسط الأجل - التخطيط قصير الأجل - التخطيط الاستراتيجي - التخطيط التكتيكي - التخطيط التشغيلي\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. المقارنة بين أنواع التخطيط حسب المدة الزمنية.\n2. التمييز بين أنواع التخطيط حسب المستوى الإداري.\n\n□ تخطط وزارة التعليم للقضاء على الأمية في الحاسب الآلي في بلادنا خلال السنوات القادمة.\n□ قررت إدارة الشركة وضع خطة لزيادة المبيعات خلال السنة القادمة.\n□ لقد وضع مدرب منتخبنا خطة محكمة لمباراة اليوم؛ لكن اللاعبين لم يطبقوها.\n□ قال مشرف العمال: \"لقد وضعت خطة أسبوعية لتسليم الطلبيات؛ ولكن العمال لم ينفذوها\".\n\nنلحظ من خلال الجمل السابقة أن الجميع يضع الخطط، ولهذا العمل العديد من الجوانب والمستويات.\n- هل هذه الخطط جميعها توضع بالطريقة نفسها؟\n- هل المدة الزمنية التي ستُنفذ فيها كل خطة من هذه الخطط متساوية؟\nللتخطيط عدة أنواع مقسمة حسب معايير مختلفة؛ نذكر منها:\n1. التخطيط حسب المدة الزمنية.\n2. التخطيط حسب المستوى الإداري."}, {"page": 30, "section": "2-2 أنواع التخطيط", "text": "الهدف الأول: أن يكون الطلبة قادرين على المقارنة بين أنواع التخطيط حسب المدة الزمنية.\nأولًا: التقسيم حسب المدة الزمنية:\nويُقسّم التخطيط حسب الفترات الزمنية التي يستغرقها وقت تنفيذ الخطة، إلى:\n- تخطيط طويل الأجل: ويهدف لإعطاء صورة واضحة عن المستقبل، ويمتد ما بين ثلاث إلى عشر سنوات أو أكثر، ويطبق في المستويات العليا.\n- تخطيط متوسط الأجل: وهو تفصيل للخطط طويلة الأجل، وتتراوح مدته ما بين سنة وثلاث سنوات، ويطبق في المستويات الوسطى.\n- تخطيط قصير الأجل: ويتعلّق بالخطط التي لا تتجاوز مدتها سنة، وهي أدق من الخطة المتوسطة الأجل، وتحدد تفصيل الأداء، ويطبق في المستوى التنفيذي.\nويتوقف تحديد المدة الزمنية لكل نوع من هذه الخطط على حجم المنظمة ونشاطها، فقد تمتد الخطة طويلة الأجل إلى عشرين سنة أو أكثر؛ كالخطط التي تضعها الدول للتحوّل من دول زراعية إلى دول صناعية مثلًا.\n\n[نشاط تطبيقي] حدد نوع الخطة المناسبة حسب المدة الزمنية لكل خطة من الخطط الآتية:\n(جدول فارغ للإجابة؛ الأعمدة: الخطة | نوع الخطة: طويلة الأجل | متوسطة الأجل | قصيرة الأجل)\nالخطط:\n- خطة لإحدى الدول الزراعية للتحول إلى دولة صناعية.\n- وضع مشرف للعمال بأحد المصانع جدولًا لورديات العمال.\n- وضع أسرة من الأسر خطة لقضاء إجازة منتصف العام.\n- خطة لأحد المصانع للتوسع في مجال التسويق من النطاق المحلي إلى النطاق الدولي.\n- خطة لإحدى الوزارات لإحلال النظام الإلكتروني في تعاملاتها بدلًا من النظام اليدوي."}, {"page": 31, "section": "2-2 أنواع التخطيط", "text": "الهدف الثاني: أن يكون الطلبة قادرين على التمييز بين أنواع التخطيط حسب المستوى الإداري.\nثانيًا: التقسيم حسب المستوى الإداري:\nتُقسَّم -عادة- المنظمة إلى ثلاثة مستويات إدارية؛ الإدارة العليا، والإدارة الوسطى، والإدارة التنفيذية، وذلك حسب المهام والمسؤوليات المتعلّقة بأنشطة المنظمة، ويُخطط في هذا النوع بناء على التقسيم الآتي:\n1. التخطيط على مستوى الإدارة العليا: ويقوم بمهمة التخطيط في هذا المستوى أعضاء مجلس الإدارة بالمنظمة، ويتميّز ببعده الاستراتيجي والأهداف بعيدة المدى.\n2. التخطيط على مستوى الإدارة الوسطى: تُحدد في هذا النوع من التخطيط الخطوات الرئيسة الواجب اتباعها من قبل الإدارات والأقسام داخل المنظمة، وذلك وفق خطة الإدارة العليا، ويقوم به مديرو الإدارات والأقسام في المنظمة، ويتميّز ببعده التفصيلي.\n3. التخطيط على مستوى الإدارة التنفيذية: يتميز هذا النوع من التخطيط أنه تنفيذي؛ أي يركّز على تحقيق أهداف خُطط لها في المستويين السابقين، ويتم في مدة زمنية قصيرة من خلال الأقسام والوحدات داخل المنظمة.\n\n(رسم هرمي للمستويات الإدارية من الأعلى إلى الأسفل: الإدارة العليا ← الإدارة الوسطى ← الإدارة التنفيذية)\n\nجدول (نوع الخطة | يمكن أن تسمى | المستوى الإداري | يتمثل في):\n- الخطة طويلة الأجل | الخطة الإستراتيجية | الإدارة العليا | رئيس مجلس الإدارة - المدير العام - مديرو الإدارات العامة.\n- الخطة متوسطة الأجل | الخطة التكتيكية | الإدارة الوسطى | مديرو الأقسام - مساعدو المديرين.\n- الخطة قصيرة الأجل | الخطة التشغيلية | الإدارة التنفيذية | المشرفون - الموظف المباشر للعمل."}, {"page": 32, "section": "2-2 أنواع التخطيط", "text": "[نشاط تطبيقي] حدد نوع التخطيط حسب المستوى الإداري:\n(جدول فارغ للإجابة؛ الأعمدة: المقارنة | التخطيط الإستراتيجي | التخطيط التكتيكي | التخطيط التنفيذي؛ الصفوف: مدة التخطيط - مستوى الإدارة - أمثلة)\n\nنشاطات مقترحة:\n- من خلال زيارتك لإحدى المنظمات أوجد مثالًا على الخطط طويلة الأجل، ومتوسطة الأجل، وقصيرة الأجل، موضحًا علاقتها وارتباطها بالمستويات الإدارية، ومن يمثل تلك المستويات."}, {"page": 33, "section": "2-2 أنواع التخطيط", "text": "التقويم\nأجب عن الأسئلة الآتية:\n- ما أنواع الخطط حسب تقسيم الفترة الزمنية؟\n- ما طبيعة التخطيط على مستوى الإدارة التنفيذية؟\n- اختر الإجابة الصحيحة فيما يأتي:\n  • تختص بتنفيذ الخطة وليس وضعها؛ هي الإدارة:\n    أ. الاستراتيجية   ب. التنفيذية   ج. التكتيكية\n  • يعطي صورة واضحة عن مستقبل المنظمة؛ هو التخطيط:\n    أ. طويلة الأجل   ب. متوسطة الأجل   ج. قصيرة الأجل\n  • الخطط قصيرة الأجل تكون مدتها:\n    أ. أكثر من سنة   ب. أقل من سنة   ج. سنة – 3 سنوات"}, {"page": 34, "section": "2-3 عناصر التخطيط", "text": "2-3 عناصر التخطيط\nالفكرة المحورية: التعرف على عناصر التخطيط.\nالمفاهيم الرئيسة: عناصر التخطيط - الأهداف - السياسات - القواعد - الإجراءات\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. التعرف على عناصر التخطيط.\n2. تطبيق عناصر التخطيط.\n\nبعد أن عرفنا مفهوم التخطيط، وفوائده، وأنواعه سنستعرض في هذا الموضوع عناصر التخطيط التي هي بمثابة الأركان التي يرتكز عليها التخطيط.\n\nالهدف الأول: أن يكون الطلبة قادرين على التعرف على عناصر التخطيط.\nعناصر التخطيط:\nتشير عناصر التخطيط إلى جميع العناصر التي تدخل في عملية تحديد مهمة المنظمة وقيمها، وتوثيقها من خلال إطار عمل محدد جيدًا يحدد الأولويات، ومن خلالها يُطور وضع أهداف المنظمة (طويلة/متوسطة/قصيرة الأجل)، واتخاذ القرارات المناسبة، والاستغلال الأمثل للموارد.\nوتتمثل عناصر التخطيط فيما يأتي:\n(رسم: 01 الأهداف ← 02 السياسات ← 03 القواعد ← 04 الإجراءات)"}, {"page": 35, "section": "2-3 عناصر التخطيط", "text": "[نشاط تطبيقي] بالنقاش مع زملائك صنف الجمل حسب عنصر التخطيط المناسب لها:\n(جدول؛ الأعمدة: الجملة | العنصر [فارغ للإجابة])\n1. منتجات عالية الجودة.\n2. منع استخدام الجوال في المدرسة.\n3. متطلبات الالتحاق في جامعة الملك سعود.\n4. رفع المبيعات بنسبة (20%) خلال العام 1445 هـ.\n\nالهدف الثاني: أن يكون الطلبة قادرين على تطبيق عناصر التخطيط.\nعناصر التخطيط:\n1. الأهداف:\nهي النتائج المطلوب تحقيقها في المستقبل.\nشروط الأهداف:\n- الوضوح: أن يكون الهدف واضحًا ومحددًا لجميع العاملين والمسؤولين عند تنفيذه في المنظمة.\n- الواقعية: يمكن تحقيقه في حدود الإمكانات المتاحة، والقدرات المتوفرة، والوقت المحدد.\n- قابل للقياس: من خلال ترجمته في صورة كمية تُمكّن من متابعته، وتقويمه، ومعرفة مدى الانحراف.\n- نظامي: بحيث لا يكون الهدف مخالفًا للشرع أو الأنظمة، أو السياسات الموضوعة."}, {"page": 36, "section": "2-3 عناصر التخطيط", "text": "2. السياسات:\nوهي مجموعة المبادئ والقواعد والقوانين التي تضعها الإدارة العليا في المنظمة؛ لكي تسترشد بها بقية المستويات الإدارية.\nوتكون السياسات -غالبًا- ثابتة لا تتغيّر إلا نادرًا أو بعد مدد طويلة، وهي ملزمة لجميع من يعمل في المنظمة.\nمثال: قد تتبع منظمة (أ) سياسة الجودة العالية، وتتبع منظمة (ب) سياسة السعر المخفض، وتعمل كل منظمة منهما على تطبيق هذه السياسة، وتحقق الأهداف النهائية.\n3. القواعد:\nهي ما يجب القيام به، وما ينبغي الامتناع عنه، ويُقصد بها القانون أو النظام الذي تضعه المنظمة في شكل أوامر وتعليمات.\nمثال: تضع إدارة المرور مجموعة من القواعد المرورية؛ لتنظيم حركة السير، والحفاظ على سلامة السائقين.\n4. الإجراءات:\nوهي: سلسلة الأعمال والخطوات والمراحل التي يجب اتباعها؛ لتنفيذ عمل معين.\nوتتصف الإجراءات بأنها متكررة، ومتسلسلة وفق خطوات مرتبة، ومراحل ثابتة.\nمثال: إجراءات الالتحاق في أحد الجامعات:\nالحصول على شهادة المرحلة الثانوية، اختبار القدرات العامة، تعبئة النماذج المطلوبة، المقابلات الشخصية.\n\n[نشاط تطبيقي] بالتعاون مع زملائك وضح السبب في عدم صحة كل هدف من الأهداف الآتية:\n(جدول؛ الأعمدة: الهدف | السبب [فارغ للإجابة])\n1. أحمد طالب في المسار الشرعي وهدفه أن يدخل كلية الهندسة بعد تخرجه.\n2. هدف إحدى شركات الأغذية والتموين الأجنبية فتح فرع في المملكة لبيع لحوم الخنزير.\n3. هدف خالد أن ينجح هذا العام بتقدير مرتفع.\n4. هدف سعيد أن ينهي بناء منزله في شهر واحد."}, {"page": 37, "section": "2-3 عناصر التخطيط", "text": "نشاطات مقترحة:\n- من خلال زيارتك لإحدى المنظمات اكتب تقريرًا يتضمن ما يأتي:\n  • أهداف المنظمة.\n  • السياسات المعتمدة فيها.\n  • القواعد المتبعة فيها.\n  • الإجراءات المحددة للأعمال المختلفة.\nثم قارن ما توصلت إليه مع ما تعلمته في هذا الموضوع.\n\nالتقويم\nأجب عن الأسئلة الآتية:\n- اذكر شروط كتابة الأهداف.\n- قم بصياغة ثلاثة أهداف تحقق شروط الأهداف:\n- اربط كل مفهوم في القائمة الأولى مع ما يناسبه من العناصر في القائمة الثانية:\n(جدول؛ الأعمدة: م | المفهوم | الإجابة [فارغ] | العنصر)\n1 | تُرتَّب حسب أهميتها وتندرج من العام إلى الخاص. | | الأهداف\n2 | سلسلة الأعمال المتبعة لتنفيذ عمل معين. | | السياسات\n3 | حرص إحدى الشركات على جودة منتجاتها. | | القواعد\n4 | قوانين توضع لمعرفة ما ينبغي القيام به والامتناع عنه. | | الإجراءات"}, {"page": 38, "section": "2-4 خطوات التخطيط", "text": "2-4 خطوات التخطيط\nالفكرة المحورية: التعرف على خطوات التخطيط وتطبيقها.\nالمفاهيم الرئيسة: تحديد الأهداف - جمع المعلومات - البدائل - التنفيذ - التقويم\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. استنتاج خطوات التخطيط.\n2. تطبيق خطوات التخطيط.\n\nسبقت الإشارة إلى أن من أهم المهارات الإدارية القيام بعدد من المهارات المختلفة، ويأتي في مقدمتها التخطيط، وإعداد الخطط بأنواعها؛ الاستراتيجية، والتكتيكية، والتشغيلية؛ حيث يُخطط من خلال مجموعة من الخطوات سنتعرف عليها في هذا الموضوع.\n\nالهدف الأول: أن يكون الطلبة قادرين على استنتاج خطوات التخطيط.\nخطوات التخطيط:\nيعتمد التخطيط على تنفيذ عدد من الخطوات؛ هي:\n(رسم دائري بعنوان «خطوات التخطيط»)\n1. تحديد الأهداف\n2. جمع المعلومات\n3. وضع الافتراضات\n4. تحديد البدائل والاختيار بينها\n5. التنفيذ\nهذه الخطوات متتالية، وهذا لا يعني عدم العودة إلى الخطوات السابقة وتحسينها باستمرار، ثم إكمال الخطوات مجددًا."}, {"page": 39, "section": "2-4 خطوات التخطيط", "text": "[نشاط تطبيقي] يرغب عبدالعزيز ببناء مسكنه الخاص وطلب منك مساعدته في ترتيب الخطوات الخاصة بمراحل بناء منزله، رتب هذه الخطوات حسب ما تراه مناسبًا، ثم ناقش ذلك مع زملائك:\n(جدول؛ الأعمدة: الخطوة | الترتيب [فارغ للإجابة])\n- تُمدد الأسلاك الكهربائية داخل الجدران.\n- تُركب الأبواب والنوافذ.\n- تُحفر الأساسات والقواعد.\n- تُصب القواعد والأعمدة الخرسانية للمبنى.\n- تُبنى جدران المبنى.\n- تُركب المصابيح والأفياش الكهربائية.\n- تُدهن جدران المبنى.\n- يُركب الرخام والسيراميك للأرضيات.\n- تُليَّس جدران المبنى.\n- تُمدد الأنابيب الصحية وأنابيب تغذية المياه للمبنى.\n- هل يمكن أن تكون خطوة \"تركيب الرخام والسيراميك للأرضيات\" هي الخطوة الأولى؟"}, {"page": 40, "section": "2-4 خطوات التخطيط", "text": "الهدف الثاني: أن يكون الطلبة قادرين على تطبيق خطوات التخطيط.\nخطوات التخطيط:\n1. تحديد الأهداف:\nهي الغاية التي تسعى إليها المنظمة.\nويمكن تصوّر أهداف المنظمة من خلال المثال الآتي:\nأهداف منظمة منتجة للأجهزة الإلكترونية:\n- الهدف الإستراتيجي: أن تصبح المنظمة أكبر شركة منتجة للأجهزة الإلكترونية منخفضة التكاليف.\n- الهدف التكتيكي: زيادة نصيب المنظمة من سوق الأجهزة الإلكترونية بنسبة (20%).\n- الهدف التشغيلي: تخفيض تكلفة الإنتاج بنسبة (16%).\n2. جمع المعلومات:\nويُقصد بها جمع البيانات والمعلومات حول العوامل المؤثرة في تحقيق الهدف.\nويمكن أن تكون في مثالنا السابق حجم الطلب، المنافسون، التغيّرات التقنية، عناصر الإنتاج، ونحو ذلك.\n3. وضع الافتراضات:\nتوضع الافتراضات من خلال تحديد الوضع المستقبلي المأمول للمنظمة، من خلال تحديد الاتجاهات التسويقية لتحقيق الأهداف الموضوعة، تقدير نسبة الأرباح المتوقعة، البحث عن إحلال بدائل تقنية للتطوير، ويُركز على مختلف الاحتمالات والظروف التي قد تواجه المنظمة خلال مدة تنفيذ الخطة.\n4. تحديد البدائل والاختيار من بينها:\nيُبحث عن مجموعة من البدائل المتاحة، وبعد ذلك تُقوّم للوصول لأفضل بديل، وتُقوَّم البدائل عن طريق وضع مجموعة من المعايير التي تبيّن مزايا كل بديل وعيوبه؛ لتسهيل المقارنة بينها.\nكما يُختار البديل الأفضل الذي لابد أن يكون تنفيذه عمليًّا وواقعيًّا، ولا يتعارض مع السياسات والأنظمة داخل المنظمة وخارجها."}, {"page": 41, "section": "2-4 خطوات التخطيط", "text": "مثال: يمكن لمنظمة تهدف لزيادة أرباحها بنسبة (10%) مثلًا باختيار أحد البديلين الآتيين:\n01 زيادة مبيعاتها: باتخاذ إجراء أو أكثر لتحقيق تلك الزيادة من خلال قرارات التسعير، والترويج، وتنمية مهارات فريق التسويق.\n02 تخفيض التكاليف: ويمكن من خلال هذا البديل أن تقوم المنظمة بأكثر من خيار؛ مثل تخفيض عدد العاملين، والبحث عن بديل اقتصادي للمواد المستخدمة.\n5. التنفيذ:\nوهذه الخطوة تختص بوضع البديل الذي اعتُمِد موضع التنفيذ الفعلي، وبعد البدء بتنفيذه تأتي مرحلة تقويم النتائج للمطابقة بين المخطط والمنفذ.\nتنويه: التقويم يعد خطوة أساسية من خطوات التخطيط الفعال، ويُجرى التقويم مع كل خطوة من خطوات التخطيط؛ وذلك لتصحيح الانحرافات في حينها، ثم تقويم النتائج التي تحققت.\n\n[نشاط تطبيقي] من خلال ما تعلمته؛ ضع خطة دراسية لاختبار نهاية الفصل الدراسي لموادك الدراسية؛ على أن تبدأ الخطة قبل بدء الاختبارات بشهر موضحًا فيها الخطوات التي تعلمتها في هذا الموضوع."}, {"page": 42, "section": "2-4 خطوات التخطيط", "text": "نشاطات مقترحة:\n- أجرِ مقابلة مع أحد أقاربك الذين يعملون بإحدى منظمات الأعمال، وناقشه عن الأهداف في منظمته، والخطوات المتبعة لتحقيق تلك الأهداف، ثم ناقش ذلك مع بقية زملائك مع ما توصلوا إليه.\nمعلومات المنظمة:\nتاريخ المقابلة:   /   / 14 هـ\nاسم الجهة:\nمجالها:\nطبيعة نشاطها:\nأهدافها:"}, {"page": 43, "section": "2-4 خطوات التخطيط", "text": "التقويم\nأجب عن الأسئلة الآتية:\n- اشرح المقصود بخطوة جمع المعلومات، مع ذكر مثال عليها.\n- في أيِّ مرحلة من مراحل التخطيط تُكتب الخطط التشغيلية؟\n- رتب خطوات عملية التخطيط الظاهرة أمامك حسب ترتيبها المناسب خلال عمل الخطة:\n  (مربعات فارغة للترتيب أمام كل خطوة)\n  التنفيذ\n  تحديد الأهداف\n  تحديد البدائل والاختيار من بينها\n  جمع المعلومات\n  وضع الافتراضات"}, {"page": 44, "section": "المشروعات", "text": "المشروعات\nالمشروع الأول:\nعنوان المشروع: عَلِّم.\nهدف المشروع: تعليم وتطبيق كتابة الأهداف.\nالفكرة: إعداد برنامج تدريبي لبناء خطة شخصية، وتقديمه لطلاب المدرسة مراعيًا شروط كتابة الهدف ومتضمنة أهدافًا (قصيرة – متوسطة – طويلة) الأجل.\n\nالمشروع الثاني:\nعنوان المشروع: سياسات المنظمات.\nهدف المشروع: المقارنة بين سياسات المنظمات.\nالفكرة: قُم بمراجعة سياسات 3 من المنظمات، ثم قارن بينها واكتب تقريرًا موضحًا فيه التالي:\n- إيجابيات سياسة كل منظمة.\n- سلبيات سياسة كل منظمة.\n- أوجه التشابه بين السياسات لتلك المنظمات.\n- أوجه الاختلاف بين السياسات لتلك المنظمات."}, {"page": 45, "section": "المشروعات", "text": "المشروع الثالث:\nعنوان المشروع: كتابة الإجراءات.\nهدف المشروع: تطبيق كتابة الإجراءات.\nالفكرة: اختر إحدى المناسبات الوطنية، وعرف عنها بصورة موجزة، واقترح إجراءات الاحتفاء بهذه المناسبة، ثم استعرض ما أنجزت أمام زملائك:\n- اليوم الوطني.\n- يوم التأسيس.\n- يوم العلم."}, {"page": 46, "section": "الفصل الثالث: مهارة التنظيم (صفحة افتتاح الفصل)", "text": "الفصل الثالث\nمهارة التنظيم\nالمواضيع:\n1. التنظيم (المفهوم، الأهمية).\n2. التنظيم (الأنواع، المبادئ).\n3. التصميم التنظيمي."}, {"page": 47, "section": "3-1 التنظيم (المفهوم، الأهمية)", "text": "3-1 التنظيم (المفهوم، الأهمية)\nالفكرة المحورية: التعرف على مفهوم التنظيم وأهميته.\nالمفاهيم الرئيسة: مفهوم التنظيم - أهمية التنظيم\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. التعرف على مفهوم التنظيم.\n2. توضيح أهمية التنظيم.\n\nتأمل بيئة المدرسة التي أنت فيها الآن:\nهذه المدرسة تتكون من جهاز إداري (مدير المدرسة، ووكيل أو وكلاء المدرسة، الكاتب الإداري)، ومشرفين ومعلمين وموجه طلابي ومحضري مختبرات، وطلاب، ولكل منهم دوره المحدد في هذه المدرسة؛ فدور المدير يختلف عن دور المدرس والطالب، ومن ثَمَّ فإن أداء الأدوار أداءً صحيحًا يعني أن هناك «تنظيمًا» صحيحًا في المدرسة تعود آثاره الإيجابية على العملية التعليمية في المدرسة.\nفكر في أداء المدرسة لو كانت الأدوار غير محددة كيف سيكون أثر ذلك على العملية التعليمية؟\n\nالهدف الأول: أن يكون الطلبة قادرين على التعرف على مفهوم التنظيم.\n\nتعريف التنظيم:\nتتعدّد تعريفات التنظيم؛ ومن أهم هذه التعريفات:\n▪ عملية تنسيق الجهود البشرية في المنظمة حتى تتمكّن من تحقيق أهدافها بأقل التكاليف، وبأقصى كفاية إنتاجيه ممكنة.\n▪ توزيع المسؤوليات والتنسيق بين كافة العاملين بشكل يضمن تحقيق أقصى درجة ممكنة من الكفاية في تحقيق الأهداف المحددة.\n▪ ترتيب الأعمال أو الأنشطة في وحدات إدارية يسهل الإشراف عليها، مع تحديد العلاقات الرسمية بين أولئك الذين يُعيّنون أو يخصّصون للقيام بتلك الأعمال."}, {"page": 48, "section": "3-1 التنظيم (المفهوم، الأهمية)", "text": "[نشاط تطبيقي] من خلال مشاهدة زملائك في فناء المدرسة أثناء الفسحة (الاستراحة) ومقارنة هذا المشهد مع طابور الصباح هناك بعض المفارقات بين المشهدين؛ اذكرها:\n\nالهدف الثاني: أن يكون الطلبة قادرين على توضيح أهمية التنظيم.\n\nتكمن أهمية التنظيم في كونه الخطوة الأولى التي يعتمدها المديرون في تفعيل الخطط وتنفيذها، فدون التنظيم لا يمكن إنجاز الأهداف الواردة في الخطط، والتنظيم يخلق العلاقة بين مختلف موارد المنظمة، ومن أبرز النقاط التي يحققها التنظيم ما يأتي:\n1. التنظيم يساعد في تحديد العلاقات بين العاملين في المنظمة.\n2. معرفة العاملين بالأنشطة التي سيقومون بأدائها تحديدًا.\n3. تحقيق الاستغلال الأمثل للموارد البشرية والمادية.\n4. عدم الازدواجية في العمل أثناء القيام بالأنشطة اللازمة لتحقيق الأهداف.\n\n[نشاط تطبيقي] اطلع على المهام الوظيفية لإحدى الوظائف التي ترغب بالعمل بها مستقبلًا، ثم أعرض ما توصلت إليه على زملائك."}, {"page": 49, "section": "3-1 التنظيم (المفهوم، الأهمية)", "text": "[نشاطات مقترحة] من خلال البحث في مصادر المعلومات قدم تقريرًا عن طرائق التنظيم لمنظمة حكومية، وأخرى خاصة مبينًا أهمية ذلك التنظيم.\n\nالتقويم\nأجب عن الأسئلة الآتية:\n▪ عرف مفهوم التنظيم.\n▪ ما الخطوة الأولى التي يعتمدها المديرون لتفعيل الخطط؟\n▪ ضع علامة (✓) أمام الجملة الصحيحة وعلامة (✗) أمام الجملة غير الصحيحة لما يأتي:\n- التنظيم الجيّد يساعد المنظمة على تخفيض التكاليف التشغيلية. (   )\n- عملية تنسيق الجهود البشرية في المنظمة يمكنها من تحقيق أهدافها بأعلى التكاليف، وبأقصى كفاية إنتاجيه ممكنة. (   )\n- التنظيم يساعد في تحديد العلاقات بين العاملين في المنظمة. (   )"}, {"page": 50, "section": "3-2 التنظيم (الأنواع، المبادئ)", "text": "3-2 التنظيم (الأنواع، المبادئ)\nالفكرة المحورية: التعرف على أنواع التنظيم ومبادئه.\nالمفاهيم الرئيسة: التنظيم الرسمي - التنظيم غير الرسمي - مبادئ التنظيم - مبدأ الهدف - مبدأ الوظيفة - مبدأ التخصص وتقسيم العمل - مبدأ وحدة القيادة - مبدأ نطاق الإشراف - مبدأ تكافؤ السُّلطة والمسؤولية - مبدأ التفويض - مبدأ التنسيق - مبدأ المرونة.\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. التمييز بين أنواع التنظيم.\n2. توضيح مبادئ التنظيم.\n\nتنظيم الأمور وترتيبها من الأمور المهمة للنجاح في الأعمال؛ فالتنظيم يساعد على تحقيق الأهداف، وتوفير الوقت والجهد، وتقليل الإجهاد والتوتر؛ ولتحقيق هذا التنظيم يتوجب علينا فهم الأنواع والمبادئ التي تتعلق بالتنظيم الجيد، وهناك نوعان من أنواع التنظيم تنشأ عادة في المجتمع بين الأفراد والمنظمات؛ وهما التنظيم الرسمي و التنظيم غير الرسمي، ولكل نوع من هذه الأنواع مزايا وعيوب، كما أن التنظيم يقوم على عدة مبادئ يسترشد بها عند تصميم الهيكل التنظيمي للمنشاة، وتوضّح مهام كل وحدة إدارية في هذا الهيكل بغرض أداء العمل الإداري بكفاية عالية وبأقل تكاليف ممكنة، وفي هذا الموضوع سنتناول أنواع التنظيم والمبادئ التي تقوم عليها عملية التنظيم.\n\nالهدف الأول: أن يكون الطلبة قادرين على التمييز بين أنواع التنظيم.\n\nأنواع التنظيم:\n[مخطط] أنواع التنظيم ← يتفرع إلى: التنظيم الرسمي | التنظيم غير الرسمي"}, {"page": 51, "section": "3-2 التنظيم (الأنواع، المبادئ)", "text": "التنظيم الرسمي:\nهو الشكل الذي يحدد العلاقات والمستويات الإدارية للأعمال التي يقوم بها الأفراد، وتوزيع المسؤوليات والواجبات بطريقة تسمح بأداء المهام/الوظائف، لكل وحدة إدارية/شخص في المنظمة، وهذا النوع من التنظيم يفصح عنه رسميًّا.\nمثل الهيكل التنظيمي، الذي يحدد العلاقات والمستويات، ويقسم الأعمال والتخصصات، ويتحقق بوجود هدف مشترك، والترحيب بالأوامر، وإمكانية الاتصال.\n\nمزايا التنظيم الرسمي:\n▪ إنشاء الهيكل التنظيمي الرسمي لتحقيق الهدف التنظيمي.\n▪ يعين لكل فرد وظيفة محددة.\n▪ سلطة صنع القرار ثابتة لكل فرد.\n▪ يخلق سلسلة من الاتصالات في المنظمة.\n▪ يؤدي إلى عمل المنظمة بطريقة منهجية وسلسة.\n\nعيوب التنظيم الرسمي:\n▪ التأخير في العمل بسبب سلسلة القيادة في الهيكل الرسمي.\n▪ يتجاهل الاحتياجات الاجتماعية للموظفين.\n▪ التركيز على العمل فقط، ويتجاهل العلاقات الإنسانية، والإبداع، والمواهب.\n\nالتنظيم غير الرسمي:\nيُعرف التنظيم غير الرسمي بأنه مجموعة من العلاقات الشخصية التي تنشأ - وتستمر - بين العاملين بسبب وجودهم في مكان واحد للعمل، واشتراكهم في أهداف ومشكلات متشابهة. ويهتم التنظيم غير الرسمي بالدوافع والاحتياجات التي لا يمكن الإفصاح عنها رسميًّا، ومن ثَمَّ فإن التنظيم غير الرسمي قد لا يتفق مع الخريطة التنظيمية الرسمية.\n\nمزايا التنظيم غير الرسمي:\n▪ يمكن تشكيل الهيكل التنظيمي غير الرسمي من قبل الموظفين.\n▪ لا يتبع أي مسار ثابت لتدفق السلطة أو الاتصال.\n▪ يمكن لأي فرد التواصل مع أي فرد في المنظمة.\n▪ الاتصالات فيه سريعة؛ حيث إنه لا يتبع سلسلة القيادة العددية.\n▪ يلبي الاحتياجات الاجتماعية والنفسية للموظفين."}, {"page": 52, "section": "3-2 التنظيم (الأنواع، المبادئ)", "text": "عيوب التنظيم غير الرسمي:\n▪ انتشار الشائعات التي قد تضلل الموظفين في العمل.\n▪ يركز على المصلحة الفردية، ورضا الأفراد مقارنة بالاهتمام التنظيمي.\n▪ معارضة أي تغيير أو تطوير في المنظمة.\n\n[نشاط تطبيقي] أرصد الأنشطة والأعمال التي يقوم بها معلمو المدرسة في وقت العمل، وفي وقت الاستراحة. صنف هذه الأعمال إلى مجموعتين:\n▪ أعمال تندرج تحت مفهوم التنظيم الرسمي.\n▪ أعمال تحت مفهوم التنظيم غير الرسمي.\nثم ناقش زملاءك في مجموعة العمل ما توصلتم إليه.\n\nالهدف الثاني: أن يكون الطلبة قادرين على توضيح مبادئ التنظيم.\n\nهناك مجموعة من المبادئ التي يقوم عليها التنظيم، ويمكن تعريف هذه المبادئ على أنها مجموعة التوجيهات التي يُسترشد بها عند تصميم الهيكل التنظيمي للمنشاة، وتوضح مهام كل وحدة إدارية في هذا الهيكل بغرض أداء العمل الإداري بكفاية عالية وبأقل تكاليف ممكنة.\nومن أهم المبادئ ما يأتي:\n1. مبدأ الهدف: أهداف المنظمة تعد من الأسس الرئيسة للتنظيم؛ لأن المقصود بالتنظيم هو ترتيب الأنشطة الضرورية في المنظمة من أجل تحقيق أهدافها، لذلك لابد من وجود هدف واضح ومحدد في أي عملية تنظيم إداري.\n2. مبدأ الوظيفة: تعد الوظيفة الوحدة الأساسية في أي تنظيم إداري، وهي منصب معيّن، يتضمّن واجبات ومسؤوليات محددة، وتنُص القواعد على أن الوظائف تُنشأ أولًا، وبعد ذلك تُحدَد حقوق من يشغلها ومسؤولياته قبل أن يُعيّن عليها أحد."}, {"page": 53, "section": "3-2 التنظيم (الأنواع، المبادئ)", "text": "3. مبدأ التخصص وتقسيم العمل: يعتمد على تقسيم أنشطة المنظمة إلى أقسام وظيفية رئيسة، ومن ثم تقسيم هذه الأنشطة الرئيسة إلى أقسام فرعية، وهكذا نستمر إلى أدنى تقسيم؛ بحيث تُربط النشاطات المتجانسة مع بعضها بعلاقات وظيفية محددة. ويُوزَّع الأفراد على هذه الأقسام مع إعطائهم الصلاحيات الملائمة للقيام بما أُسند إليهم من أعمال.\n4. مبدأ وحدة القيادة: يطلق على هذا المبدأ عدة أسماء؛ مثل وحدة الأمر، ووحدة الرئاسة، ووحدة إصدار الأوامر، ويُقصد به أن يكون للموظف قائد أو رئيس واحد يتلقّى منه الأوامر والتعليمات والتوجيهات، ويؤدي الموظف دوره في العمل وفقًا لهذه الأوامر، ويساعد هذا المبدأ على تحديد المسئولية، ويضمن التنسيق.\n5. مبدأ نطاق الإشراف: ويقصد به عدد المرؤوسين الذين يستطيع المشرف (المدير أو الرئيس) أن يشرف على عملهم إشرافًا مباشرًا بكفاءة.\n6. مبدأ تكافؤ السُّلطة والمسؤولية: السلطة والمسؤولية مرتبطتان بعمل معين؛ فالسلطة تُحدد طبقًا لاحتياجات أداء عمل معين، والمسؤولية هي الالتزام بأداء ذلك العمل، ويتّسع نطاق السلطة والمسؤولية كلّما تدرّجنا إلى الأعلى في الهيكل التنظيمي.\n7. مبدأ التفويض: التفويض هو منح الرئيس أو المدير السلطةَ لأحد مرؤوسيه أو مجموعة من مرؤوسيه؛ لأداء عمل معين، وتفويض المدير سلطته لأداء عمل معين لا يعني انتقال مسؤوليته عن هذا العمل إلى المرؤوس الذي فوض له جزءًا من السلطة، بل يبقى مسؤولًا عنه.\n8. مبدأ التنسيق: إذا كان المقصود بتقسيم العمل هو تجزئته على العاملين؛ فالتنسيق هو الربط بين هذه الأجزاء؛ لكي تعود في صورتها الكليّة بعد إتمام العمل أو الإنتاج.\n9. مبدأ المرونة: إن التنظيم الإداري الناجح يؤكّد على مبدأ المرونة؛ ويقصد به سرعة المنظمة في التجاوب مع المتغيّرات البيئية الداخلية، والخارجية.\n\n[نشاط تطبيقي] أطلقت المنصة الوطنية للعمل التطوعي في 2020 لتقدم مجموعة واسعة من فرص التطوع في المملكة العربية السعودية، وتحفز المنظمات غير الربحية على تنظيم الفعاليات المجتمعية. كما تُسهل على الأفراد العثور على فرص التطوع التي تتماشى مع أهدافهم واهتماماتهم الشخصية، وتشجعهم على المشاركة الفاعلة في العمل التطوعي.\n- في ضوء ما سبق قدم عرضًا تقديميًا عن مبادئ التنظيم في العمل التطوعي."}, {"page": 54, "section": "3-2 التنظيم (الأنواع، المبادئ)", "text": "[نشاطات مقترحة] طبق مبادئ التنظيم على فريقك التطوعي في المدرسة، ثم قدم عرضًا تقديميًا لزملائك.\n\nالتقويم\nأجب عن الأسئلة الآتية:\n▪ اذكر بعض مزايا التنظيم الرسمي.\n▪ لماذا تعد وحدة القيادة أحد مبادئ التنظيم؟\n▪ اربط ما في القائمة (أ) بما يناسبه من القائمة (ب):\nم | أ | الإجابة | ب\n1 | التنظيم غير الرسمي | | مبدأ التفويض\n2 | وحدة القيادة | | من أنواع التنظيم\n3 | منح المدير السلطة للمرؤوسين | | من مبادئ التنظيم"}, {"page": 55, "section": "3-3 التصميم التنظيمي", "text": "3-3 التصميم التنظيمي\nالفكرة المحورية: التعرف على مفهوم التصميم التنظيمي، خطوات بناء الهيكل التنظيمي.\nالمفاهيم الرئيسة: التصميم التنظيمي - الهيكل التنظيمي - الخريطة التنظيمية - الدليل التنظيمي.\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. التعرف على مفهوم التصميم التنظيمي.\n2. توضيح أسس تصميم الهيكل التنظيمي.\n3. تطبيق خطوات تصميم الهيكل التنظيمي.\n\nتمارس المنظمة التصميم التنظيمي بوصفها عملية مهمة تشكل قرارًا جوهريًّا للإدارة في اختيار الهيكل الذي تستطيع من خلاله المنظمة مراقبة النشاطات الضرورية والتنسيق بينها؛ لإنجاز أهدافها؛ حيث يمثل التصميم التنظيمي وسيلة تُنظم من خلالها المنظمة للوصول إلى الأهداف من خلال تحديد الواجبات والمهام والمسؤوليات بين الأقسام والأفراد، وتحديد العلاقات التنظيمية، وعدد المستويات الإدارية، والعناصر الأخرى.\n\n[مخطط: الهيكل التنظيمي]\n- مدير المركز (في الأعلى)\n  - يتفرع منه: المكتب الفني | المستشارون\n  - يتفرع من المكتب الفني: الحاسب الآلي | المكتبة | الشؤون المالية | العلاقات العامة"}, {"page": 56, "section": "3-3 التصميم التنظيمي", "text": "الهدف الأول: أن يكون الطلبة قادرين على التعرف على مفهوم التصميم التنظيمي.\n\nالمراد بالتصميم التنظيمي للمنشآت هو العملية التي بموجبها تُحدد الوحدات الرئيسة للمنشأة والمهام المتعلقة بها؛ بما يؤدي إلى تحقيق أهداف النشاط.\n\nمكونات التصميم التنظيمي:\nيتكون التصميم التنظيمي عادة من ثلاثة مكونات هي:\n1. الهيكل التنظيمي: هو البناء الرسمي الذي يربط بين مهام الأفراد والوحدات في المنظمة بما يعمل على تحقيق أهدافها.\n2. الخريطة التنظيمية: تعرف بأنها صورة أو مخطط لهيكل المنظمة، تبيّن الوحدات الإدارية التي تتكوّن منها المنظمة، والوظائف الموجودة فيها، وخطوط السلطة والمسؤولية التي تربط بين أجزائها.\n3. الدليل التنظيمي: هو وثيقة تتضمّن معلومات تفصيلية تشمل أهداف المنظمة ونشاطاتها، وأسماء الوحدات الإدارية فيها، وأهداف تلك الوحدات، وارتباطاتها، ومهامها إلى جانب الخرائط التنظيمية.\n\n[نشاط تطبيقي] ابحث عن خمسة هياكل تنظيمية لمنظمات متشابهة في النشاط، وأوجد أوجه التشابه والاختلاف، موضحًا سبب ذلك الاختلاف.\n\nالهدف الثاني: أن يكون الطلبة قادرين على توضيح أسس تصميم الهيكل التنظيمي.\n\nهناك العديد من الأسس التي تُعتمد عند تجميع الوظائف في وحدات إدارية (دوائر أو أقسام)، و يُبنى الهيكل التنظيمي على أساسها؛ ومن أهم هذه الأسس:\n1. التنظيم على أساس الوظيفة.\n[مخطط] الرئيس ← يتفرع إلى: نائب الرئيس للأبحاث | نائب الرئيس للتصنيع | نائب الرئيس للتسويق"}, {"page": 57, "section": "3-3 التصميم التنظيمي", "text": "2. التنظيم على الأساس الجغرافي.\n[مخطط] الرئيس ← يتفرع إلى: مدير فرع جدة | مدير فرع الدمام | مدير فرع أبها\n\n3. التنظيم على أساس العملاء.\n[مخطط] الرئيس ← يتفرع إلى: مدير المشاريع الحكومية | مدير مشاريع الأفراد | مدير مشاريع الشركات\n\n4. التنظيم على أساس المنتج.\n[مخطط] المدير ← يتفرع إلى: رئيس قسم إنتاج الحليب | رئيس قسم إنتاج العصائر | رئيس قسم إنتاج الأجبان\n\n5. التنظيم المختلط: من النادر أن نجده تنظيمًا يقوم على أساس نوع واحد من التنظيمات السابقة؛ إذ غالبًا ما نجد أن الكثير من المنظمات تجمع بين أكثر من طريقة في التنظيم؛ وذلك اعتمادًا على أهداف المنظمة، واحتياجاتها الراهنة والمستقبلية، وحجمها، ونوع الخدمات التي تقدمها والعملاء الذين تتعامل معهم.\n\n[نشاط تطبيقي] من خلال الاستفادة من الهياكل التنظيمية في النشاط السابق، فكر في أسباب اختيار هذا الأسلوب، وهل يوجد أسلوب أفضل منه لتلك المنظمة؟"}, {"page": 58, "section": "3-3 التصميم التنظيمي", "text": "الهدف الثالث: أن يكون الطلبة قادرين على تطبيق خطوات تصميم الهيكل التنظيمي.\n\nيُصمم الهيكل التنظيمي من خلال الخطوات الآتية:\n1. تحليل أهداف المنظمة بغرض تحديد الأنشطة الرئيسة.\nلكل منظمة هدف رئيس أو أهداف رئيسة هي السبب وراء وجود هذه المنظمة، فهدف وزارة معنية بالتعليم سيكون مختلفًا عن هدف وزارة معنية بالمواصلات، كما أن هدف شركة معنية بالمقاولات المعمارية سيكون مختلفًا عن هدف شركة معنية بتجارة المواد الغذائية، لذا فإن التعرف على هدف أو أهداف المنظمة وتحليلها إلى أهداف فرعية بغرض تحديد الأنشطة الرئيسة هو الخطوة الأولى في تصميم الهيكل التنظيمي.\n2. تحليل الأنشطة الرئيسة إلى أنشطة فرعية.\nغالبًا ما يكون النشاط الرئيس مركب من عدة أنشطة؛ لذا فإننا نحتاج -في أكثر الأحيان- إلى تحليل هذا النشاط إلى أنشطته الفرعية؛ ليسهل علينا التعامل معها، ويقصد بالنشاط الفرعي هنا المهام أو الأعمال التي يؤدي القيام بها إلى تنفيذ النشاط الرئيس في المنظمة، ومن ثَمَّ تحقيق أهداف المنظمة.\n3. تحديد الأنشطة المساندة.\nإن تحقيق الأهداف الرئيسة لأي منظمة من خلال توزيعها إلى أنشطة رئيسة أو فرعية يحتاج إلى وجود نشاط مساند (داعم) لتنفيذ هذه الأنشطة المساندة التي لا تُعد جزءًا من أهداف المنظمة، ولكنها تعد في واقع الأمر مهمة في أي عملية تنظيم هيكل تنظيمي أو تصميمه؛ وذلك أنه دون وجود هذه الأنشطة المساندة فإن المنظمة لن تتمكن من تحقيق أهدافها الرئيسة أو الفرعية، ولعل أبرز مثال على الأنشطة المساندة نشاط الشؤون الإدارية والمالية.\n4. تجميع الأنشطة المتشابهة وتكوين الوحدات الإدارية.\nبناءً على نتائج الخطوة السابقة سيتوفر لدينا عدد من الأنشطة الفرعية والمساندة، بعض هذه الأنشطة يكون مستقلًا بذاته، في حين أن بعضها يكون مكررًا، أو متشابهًا مع غيره؛ لذا فإنه في هذه الخطوة من تصميم الهيكل التنظيمي تُجمع الأنشطة المتشابهة -ما أمكن- في مجموعة واحدة؛ ليسهل علينا تكوين الوحدات الإدارية.\n5. وصف المهام الأساسية للوحدات الإدارية.\nإن هذه الخطوة تُعد من بين أهم خطوات تصميم الهيكل التنظيمي وأصعبها؛ ذلك أن كتابة المهام الأساسية لكل وحدة إدارية يتطلب -ضرورة- أن يعمد الفرد القائم بهذه المهمة إلى جمع المعلومات التي تمكنه من كتابة هذه المهام بدقة، وهذه المعلومات يمكن الحصول عليها من خلال استمارة لجمع المعلومات تعد لهذا الغرض، إضافة إلى المقابلات الشخصية والزيارات الميدانية. وبالطبع فإن وصف هذه المهام سوف يختلف من منظمة لأخرى باختلاف طبيعة نشاط المنظمة، وتاريخ نشأتها؛ من كونها منظمة جديدة لم يسبق أن مارست نشاطها، أو منظمة حديثة النشأة لم يمض على وجودها سنوات، أو منظمة قديمة النشأة."}, {"page": 59, "section": "3-3 التصميم التنظيمي", "text": "6. تحديد طبيعة عمل الوحدات الإدارية وارتباطاتها التنظيمية.\nبعد وصف المهام الأساسية للوحدات الإدارية تأتي الخطوة الآتية في إعداد الهيكل التنظيمي المتضمنة تحديد طبيعة عمل الوحدات الإدارية؛ وذلك بحسب دورها في تحقيق أهداف المنظمة، هذه الوحدات الإدارية في أي هيكل تنظيمي -غالبًا- تقسم من حيث طبيعة العمل الذي تقوم به، والسلطات التي تتمتع بها إلى ثلاثة أقسام رئيسة؛ هي:\n▪ الوحدات التنفيذية: هي الوحدات التي تؤدي المهام الرئيسة التي أنشئت من أجلها المنظمة، هذه الوحدات -غالبًا- تتمتع بحق اتخاذ القرارات اللازمة لتنفيذ أعمالها.\n▪ الوحدات الاستشارية: هي الوحدات التي تقدم خدمات استشارية من شأنها مساعدة الوحدات التنفيذية في أداء أعمالها؛ حيث إنها -غالبًا- تنفذ القرارات والتعليمات التي توجه إليها من الجهة التي تكون مرتبطة بها.\n▪ الوحدات المساندة: هي الوحدات التي تقدم خدمات من شأنها أن تساعد الوحدات التنفيذية والاستشارية في تنفيذ مهامها الأساسية، وتختلف الوحدات المساندة عن الوحدات التنفيذية في أنها لا تقدم خدماتها في الغالب إلى المستفيدين أو الجمهور مباشرة؛ وإنما تقدم خدماتها إلى الوحدات التنفيذية داخل المنظمة.\n7. إعداد الهيكل التنظيمي.\nبعد أن انتهينا من تحديد طبيعة عمل الوحدات الإدارية وارتباطاتها التنظيمية نكون بذلك قد وصلنا إلى الخطوة التي يمكننا من خلالها تبين ملامح الهيكل التنظيمي للمنشأة. عندئذ لابد من تدوين أسماء هذه الوحدات وارتباطاتها بوضوح يمكننا من الوقوف على الصورة الكلية للهيكل التنظيمي للمنشأة.\n\n[نشاط تطبيقي] ارسم الهيكل التنظيمي للمدرسة، ووضح عليه الأقسام المختلفة لإدارات المدرسة، مشيرًا إلى الأساس الذي بُني عليه الهيكل التنظيمي للمدرسة."}, {"page": 60, "section": "3-3 التصميم التنظيمي", "text": "[نشاطات مقترحة] فكر في إنشاء مشروع تجاري خاص بك، ثم صمم هيكلًا تنظيميًّا متبعًا خطوات تصميم الهيكل التنظيمي.\n\nالتقويم\nأجب عن الأسئلة الآتية:\n▪ ما المقصود بالأنشطة الرئيسة للمنظمة؟\n▪ هناك عدّة أشكال لتنظيم الأنشطة داخل المنظمة؛ اذكر هذه الأشكال، ثم صمم هيكلًا تنظيميًّا مقترحًا لأحدها.\n▪ رتب الوظائف الآتية على الهيكل التنظيمي أدناه.\n(مندوب مبيعات، مدير إدارة الإنتاج، سكرتير، مدير إدارة التسويق، مشرف خط إنتاج، المدير العام)\n[مخطط فارغ للتعبئة: مربع واحد في الأعلى، يتفرع منه مربعان في المستوى الثاني؛ المربع الأيمن يتفرع منه مربع واحد، والمربع الأيسر يتفرع منه مربعان]"}, {"page": 61, "section": "المشروعات (الفصل الثالث)", "text": "المشروعات\n\nالمشروع الأول:\nعنوان المشروع: الهياكل التنظيمية.\nهدف المشروع: التعرف على الهياكل التنظيمية.\nالفكرة: ابحث عن 4 هياكل تنظيمية لمنظمات أعمال، ثم انقد هذه الهياكل من خلال ما تعلمته، مع اقتراح هيكل تنظيمي من وجهة نظرك لإحدى هذه المنظمات.\n\nالمشروع الثاني:\nعنوان المشروع: تصميم الهيكل التنظيمي.\nهدف المشروع: التمكن من تصميم الهيكل التنظيمي.\nالفكرة: زيارة منظمة لا يقل عدد العاملين فيها عن 30 موظف، ثم صمم الهيكل التنظيمي لتلك الجهة مطبقًا وموضحًا مبادئ التنظيم في تصميم الهيكل التنظيمي."}, {"page": 62, "section": "المشروعات (الفصل الثالث)", "text": "المشروع الثالث:\nعنوان المشروع: تصميم الهيكل التنظيمي.\nهدف المشروع: تصميم الهيكل التنظيمي باستخدام التقنية.\nالفكرة: صمم هيكلًا تنظيميًّا لإحدى المنظمات مستخدمًا أحد برامج الحاسب الآلي."}, {"page": 63, "section": "الفصل الرابع: مهارة التوجيه", "text": "الفصل الرابع\nمهارة التوجيه\nالمواضيع:\n1. التوجيه (المفهوم، الأهمية).\n2. أدوات التوجيه (الحوافز، التدريب).\n3. أدوات التوجيه (القيادة)."}, {"page": 64, "section": "4-1 التوجيه (المفهوم، الأهمية)", "text": "4-1 التوجيه (المفهوم، الأهمية)\nالفكرة المحورية: التعرف على مفهوم التوجيه وأهميته.\nالمفاهيم الرئيسة: مفهوم التوجيه - أهمية التوجيه.\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. التعرف على مفهوم التوجيه.\n2. توضيح أهمية التوجيه.\n\nدرسنا في الفصل الأول أن حقيقة العمل الإداري ما هو إلا تنفيذ الأعمال عن طريق الآخرين؛ فمن خلال الجهود البشرية المشتركة تسعى المنظمة إلى تحقيق أهدافها على أن يكون هناك تخطيط وتنظيم لهذه الجهود، ويتبع ذلك التوجيه الذي يعمل على أن يكون أداء المهام والواجبات التي يقوم بها الفرد أو المجموعة منسجمًا ومتوافقًا مع ما يقوم به الآخرون، ووفق الخطط والتنظيمات الموضوعة، وفي هذا الفصل سنتعرف على مفهوم التوجيه، وأهميته، وأدواته.\n\nالهدف الأول: أن يكون الطلبة قادرين على التعرف على مفهوم التوجيه.\n\nتعريف التوجيه:\nمن تعريفات التوجيه:\n- التوجيه هو فن التّعامل مع مجموعة من الناس الذين يمارس المشرف عليهم سلطته بطريقة تحقق أقصى فاعلية في أداء العمل.\n- توجيه وقيادة المرؤوسين إلى العمل بأقصى طاقاتهم، والعمل على تحقيق الأهداف المتبادلة بين الإدارة والمرؤوسين عن طريق التشجيع والتحفيز والاتصالات المتبادلة، ومعرفة احتياجات المرؤوسين، وتحقيق التوازن بين أهداف الإدارة وأهداف العاملين."}, {"page": 65, "section": "4-1 التوجيه (المفهوم، الأهمية)", "text": "[نشاط تطبيقي]\nتأمل العبارات وأجب عن الأسئلة الآتية:\n(صور مع عبارات:)\n- الأب يوجه الأبناء.\n- المدرس يوجه الطلاب.\n- الرئيس يوجه المرؤوسين.\n- قائد الفريق يوجه فريقه.\n- المراقب يوجه الطيار.\nالأسئلة:\n- لماذا يحدث التوجيه؟\n- بماذا يكون التوجيه؟\n- متى يحدث التوجيه؟\n- كيف يحدث التوجيه؟"}, {"page": 66, "section": "4-1 التوجيه (المفهوم، الأهمية)", "text": "الهدف الثاني: أن يكون الطلبة قادرين على توضيح أهمية التوجيه.\n\nأهمية التوجيه:\nيأتي التوجيه بعد التخطيط والتنظيم، وعلى الرغم من أن كثيرًا من المشروعات تُعدّ لها الخطط الجيدة والتنظيم الأمثل، إلا أن المشروع قد يواجه الكثير من الصعوبات والمعوقات في ظل العمل في بيئة سريعة التبدل والتغير عند تنفيذ المشروع؛ لذا ظهرت أهمية التوجيه على أنه مهارة من المهارات الإدارية مرتبطة بتنفيذ عمليات المشروع، ويرتكز عمل التوجيه على التعامل مع العنصر البشري من خلال علاقة المدير بمرؤوسيه، وعن طريق هذه العلاقة يمكن تنفيذ خطط المشروع، وتحقيق أهدافه.\n\n[نشاط تطبيقي]\n- بصفتك قائدًا لأحد الفرق التطوعية في مدرستك؛ ما أبرز التوجيهات التي تقدمها لأعضاء فريقك؟ وما أهمية تلك التوجيهات؟\n\n[نشاطات مقترحة]\n- من خلال زيارتك لإحدى الشركات؛ ناقش مدير الشركة عن أبرز التوجيهات الإدارية التي تسهم في رفع جودة العمل."}, {"page": 67, "section": "4-1 التوجيه (المفهوم، الأهمية)", "text": "التقويم\nأجب عن الأسئلة الآتية:\n- اكتب مفهومًا لعنصر التوجيه بأسلوبك، مراعيًا العناصر الرئيسة التي يتكوّن منها.\n- وضح أهمية التوجيه في تحقيق أهداف المنظمة.\n- ضع علامة (✓) أمام الجملة الصحيحة وعلامة (✗) أمام الجملة غير الصحيحة لما يأتي:\n  - الخطط الجيّدة والتنظيم تكفيان لضمان قيام الأفراد بإنجاز ما يكلّفون به من أعمال تلقائيًا، أوبأمر من إرادتهم. (   )\n  - تكمن أهمية التوجيه في مساعدة المرؤوسين على مواجهة الصعوبات التي قد تواجههم أثناء أداء عملهم. (   )\n  - من طرق التوجيه التشجيع والتحفيز والاتصالات المتبادلة. (   )"}, {"page": 68, "section": "4-2 أدوات التوجيه (الحوافز، التدريب)", "text": "4-2 أدوات التوجيه (الحوافز، التدريب)\nالفكرة المحورية: التعرف على أدوات التوجيه.\nالمفاهيم الرئيسة: الحوافز - التدريب.\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. التعرف على التحفيز بوصفه أداة للتوجيه.\n2. التعرف على التدريب بوصفه أداة للتوجيه.\n\nتعتمد وظيفة التوجيه على عدد من الأدوات التي يمكن من خلالها توجيه الأفراد في المنظمة خلال أداء العمل، وتحفيزهم، وتنمية مهاراتهم. وسنتعرف -بمشيئة الله تعالى- على الأدوات الآتية:\n- الحوافز.\n- التدريب.\n- القيادة\n\nالهدف الأول: أن يكون الطلبة قادرين على التعرف على التحفيز بوصفه أداة للتوجيه.\n\nالحوافز\nيُعرّف التحفيز في العمل الإداري بأنه حثّ المرؤوسين عن طريق مجموعة من العوامل أو المؤثرات التي تدفعهم لبذل جهد أكبر في عملهم، أو الامتناع عن الأخطاء.\nوتصنّف الحوافز وفق عدة تصنيفات؛ من أهم هذه التصنيفات الآتي:\n\nالحوافز الإيجابية والحوافز السلبية.\n- الحوافز الإيجابية: تُقدّم للعاملين لحثّهم على بذل الجهد لرفع معدلات الإنتاج، أو الاستمرار في أداء العمل بنفس المستوى المرتفع، وتنقسم إلى حوافز مادية، وحوافز معنوية."}, {"page": 69, "section": "4-2 أدوات التوجيه (الحوافز، التدريب)", "text": "- الحوافز السلبية: وتستخدم في حال وقع قصور في الأداء، وتكرار الأخطاء التي قد تسبب للمنظمة الخسائر، وتنقسم كذلك إلى حوافز مادية، وحوافز معنوية.\n\nومن التقسيمات الأخرى للحوافز:\n- الحوافز الماديّة، والحوافز المعنوية.\n- الحوافز المباشرة، والحوافز غير المباشرة.\n- الحوافز الجماعية، والحوافز الفردية.\nتصنيف الحوافز تصنيف نظري؛ بينما هي في الواقع تتداخل فيما بينها تداخلاً كبيرًا.\n\n[نشاط تطبيقي]\n- من خلال زيارتك لوكيل المدرسة ما المواقف المختلفة التي يستخدم فيها الحوافز لتوجيه سلوكيات الطلاب؟ ولماذا اختار هذا النوع من الحوافز؟ ثم قدم ما توصلت إليه أمام زملائك."}, {"page": 70, "section": "4-2 أدوات التوجيه (الحوافز، التدريب)", "text": "الهدف الثاني: أن يكون الطلبة قادرين على التعرف على التدريب بوصفه أداة للتوجيه.\n\nالتدريب:\nالتدريب عملية منظّمة تهدف إلى زيادة معلومات العاملين في المنظمة ومهاراتهم؛ لتحقيق أهدافها.\n\nومن أبرز الأسباب التي ساعدت على زيادة الاهتمام بالتدريب:\n01. تطوّر أساليب العمل الإداري وتطوّر أدوات العمل وآليّاته.\n02. الثورة المعلوماتية في جميع المجالات عامة، والمجالات الإدارية خاصة.\n03. التغيّر السريع في بيئة الأعمال.\n04. إعداد الموظفين للعمل في المستويات العليا، وسرعة معدل دوران العمل.\n05. إعداد الموظفين الجدد.\n\nجميع الأسباب السابقة وغيرها أكدت على الاهتمام بالتدريب وجعلته أداة من أدوات التوجيه الإداري، فالرئيس يعرف وبشكل مباشر مدى حاجة المرؤوسين إلى المهارات الإدارية والفنية والتي من خلالها يتمكّنون من أداء عملهم، بالإضافة للمعلومات والبيانات اللازمة لأداء العمل المطلوب تنفيذه.\n\nعلى الرغم مما تتكبّده المنظمة من وقت وتكلفة في عملية التدريب، إلا أنّ هذا الوقت والتكلفة لها مبرراتها التي تظهر من خلال فوائد التدريب التالية:\n- زيادة الإنتاجية.\n- تخفيض النفقات.\n- التحفيز المعنوي.\n- توفير الكفاءات البشرية.\n\nأنواع التدريب:\nينقسم التدريب إلى قسمين؛ هما:\n- التدريب الداخلي: ويكون الموظف المتدرّب على رأس العمل، ويتمثّل في:\n  - التدريب بين الزملاء في العمل.\n  - المشاركة في الدراسات والبحوث.\n  - حضور الاجتماعات والمناقشات.\n  - التكليف المؤقت بأعمال في مستويات أعلى."}, {"page": 71, "section": "4-2 أدوات التوجيه (الحوافز، التدريب)", "text": "- التدريب الخارجي: ويكون خارج المنظمة ويُفرّغ الموظف للتدريب، ويكون عن طريق:\n  - الدورات والورش التدريبية.\n  - الندوات والمؤتمرات.\n  - المحاضرات والمناقشات.\n  - الابتعاث.\n\n[نشاط تطبيقي]\n- اختر أحد الوظائف الآتية:\nمحاسب، مبرمج، مهندس معماري، وحدد أهم الدورات التدريبية التي تسهم في رفع كفاءة الموظف.\n\n[نشاطات مقترحة]\n- عُينت مديرًا للموارد البشرية في إحدى الشركات، وتبين لك أن سبب تدني أداء الموظفين هو تدني مستوى بعض المهارات الوظيفية لديهم؛ من خلال ما درسته في التوجيه؛ كيف يمكن رفع أداء الموظفين وكفاءتهم في إنجاز أعمالهم؟"}, {"page": 72, "section": "4-2 أدوات التوجيه (الحوافز، التدريب)", "text": "التقويم\nأجب عن الأسئلة الآتية:\n- اذكر ثلاثة تقسيمات لأنواع الحوافز.\n- اذكر أنواع التدريب مع توضيح المقصود بكل نوع.\n- اربط ما في القائمة (أ) بما يناسبه في القائمة (ب)\nم | أ | الإجابة | ب\n1 | تخفيض النفقات. |   | الحوافز السلبية\n2 | يكون خارج المنظمة ويُفرّغ الموظف للتدريب. |   | فوائد التدريب\n3 | تستخدم في حال وقع قصور في الأداء، وتكرار الأخطاء التي قد تسبب للمنظمة الخسائر. |   | الحوافز الإيجابية\n4 | تقدم للعاملين لرفع معدلات الإنتاجية. |   | التدريب الخارجي"}, {"page": 73, "section": "4-3 أدوات التوجيه (القيادة)", "text": "4-3 أدوات التوجيه (القيادة)\nالفكرة المحورية: التعرف على القيادة.\nالمفاهيم الرئيسة: القيادة - المدير - مصادر قوة القائد - أنماط القيادة.\nالأهداف: يتوقع بعد نهاية الموضوع أن يكون الطلبة قادرين على:\n1. التعرف على مفهوم القيادة.\n2. توضيح أهم مصادر التأثير للقائد.\n3. المقارنة بين أنماط القيادة الإدارية.\n\nيعد موضوع القيادة من الأدوات المهمة في التوجيه، ولقد تناوله العديد من المهتمين بعلم الإدارة وتعدّدت النظريات المتعلقة به.\nولأهمية هذا الموضوع أُفرد ضمن موضوعات هذا الفصل، مع ملاحظة أن ما سيُتناول هو الموضوعات الرئيسة المتعلّقة بالقيادة دون الدخول في كثير من التفصيلات حول هذا الموضوع.\n\nالهدف الأول: أن يكون الطلبة قادرين على التعرف على مفهوم القيادة.\n\nمفهوم القيادة:\nلقد تعددت التعريفات الخاصة بمفهوم القيادة؛ إلا أننا سنورد أهم هذه التعريفات؛ وهي:\n- عملية التأثير في نشاط الجماعة بهدف تحقيق الأهداف.\n- القدرة التي يمتلكها الفرد للتأثير على أفكار الآخرين، واتجاهاتهم، وسلوكهم.\n- هي قدرة الفرد على استخدام نفوذه وقوته الشخصية ليؤثر على سلوك الأفراد من حوله، وتوجّهاتهم؛ لإنجاز أهداف محددة من قبل المنظمة."}, {"page": 74, "section": "4-3 أدوات التوجيه (القيادة)", "text": "تعد القيادة جوهر العملية الإدارية و قلبها النابض، والقيادة الناجحة تجعل من العمل الإداري أكثر حركة و فاعلية؛ لتحقيق الأهداف.\nيمكن توضيح أهمية القيادة في نجاح العمل الإداري من خلال مجموعة من المظاهر المتعلقة بما تقوم به المنظمة؛ لتحقيق أهدافها التي وجدت من أجلها؛ ومنها:\n01. القدرة على تحويل الأهداف إلى نتائج.\n02. توجيه العناصر الإنتاجية بفعالية نحو تحقيق الأهداف.\n03. تحفيز الأفراد ودفعهم نحو تحقيق الأهداف.\n04. سهولة التّعامل مع متغيرات البيئة.\n\nالفرق بين القائد والمدير:\nيخلط الكثير بين مصطلحي القيادة والإدارة، ويعدونهما وجهين لعملة واحدة، لكن المصطلحين مختلفان كليًّا في الحقيقة؛ فالقائد يمكن أن يكون مديرًا؛ لكن ليس كل مدير يصلح أن يكون قائدًا.\nويمكن توضيح أهم الفروق بين المدير والقائد من خلال الجدول الآتي:\nوجه المقارنة | القائد | المدير\nمصدر السلطة | المنصب والثقة بالنفس. | المنصب والصلاحيات.\nالإشراف | تشاركي. | متسلّط.\nعلاقاته في العمل | ودّية تعتمد على الثقة. | متباعدة تعتمد على السيطرة.\nالحوافز | مادية ومعنوية تعتمد على التشجيع والتعزيز. | مادية تعتمد على الثواب والعقاب.\nنظرة مرؤوسيه | قائد نجم وملهم. | مدير عادي أو جيد."}, {"page": 75, "section": "4-3 أدوات التوجيه (القيادة)", "text": "[نشاط تطبيقي]\n- استلهم بعض من المهارات القيادية لصاحب السمو الملكي الأمير محمد بن سلمان بن عبدالعزيز آل سعود، ولي العهد، رئيس مجلس الوزراء، قائد \"رؤية السعودية 2030\".\n\nالهدف الثاني: أن يكون الطلبة قادرين على توضيح أهم مصادر التأثير للقائد.\n\nمصادر التأثير في القيادة (مصادر قوة القائد):\nيقاس مدى نجاح كثير من المنظمات بقدرة القيادة فيها على التأثير في المرؤوسين وتوجيههم بكفاءة عالية؛ لتحقيق الأهداف المطلوبة، ونجاح القيادة يعتمد على عملية التأثير التي يمارسها القائد في المرؤوسين بهدف حفز وتوجيه نشاطاتهم وجهودهم؛ لذا أصبح من المهم أن نقف على أهم مصادر التأثير التي يستطيع من خلالها القائد القيام بعملية التأثير إيجابيًّا.\n\n(شكل: مصادر التأثير في القيادة)\n- المصدر الأول: الحوافز الإيجابية.\n- المصدر الثاني: الحوافز السلبية.\n- المصدر الثالث: الخبرة.\n- المصدر الرابع: الشرعية (القانون أو النظام).\n- المصدر الخامس: البيانات والمعلومات.\n- المصدر السادس: الانتماء."}, {"page": 76, "section": "4-3 أدوات التوجيه (القيادة)", "text": "- المصدر الأول: الحوافز الإيجابية\nيستطيع القائد منح المرؤوسين حوافز مادية ومعنوية؛ نظرًا لأدائهم للعمل والمهام المطلوبة بكفاءة؛ على أن تكون هذه الحوافز قادرة على إشباع حاجاتهم.\n- المصدر الثاني: الحوافز السلبية\nاستخدام الحوافز السلبية للتأثير في المرؤوسين من خلال التهديد باستخدام العقوبات والجزاءات عند عدم قيام المرؤوسين بالمهام المطلوبة منهم بالكفاءة المطلوبة، أو التأخير في الإنجاز، ويتحفظ كثير من الباحثين في علم الإدارة على هذا النوع من التأثير.\n- المصدر الثالث: الخبرة\nالخبرة التي يمتلكها القائد تساعده في التأثير على المرؤوسين؛ فكلما كان القائد يمتلك خبرة ومعرفة في مجال العمل أكثر من مرؤوسه كان ذلك أدعى أن يستجيبوا لتوجيهاته.\n- المصدر الرابع: الشرعية (القانون أو النظام)\nيعطي النظام القائد السلطة التي من خلالها يلتزم المرؤوسون بقبول أوامره وطاعته.\n- المصدر الخامس: البيانات والمعلومات\nتُعدّ البيانات والمعلومات مصدرًا مهمًا في العمل الإداري؛ فمن يمتلك المعلومات السليمة يمكنه اتخاذ القرارات الناجحة، ويستطيع القائد من خلال موقعه التعرف على الكثير من المعلومات.\n- المصدر السادس: الانتماء\nحيث إن إحساس المروؤسين بانتمائهم إلى المنظمة يجعلهم يستجيبون لأوامر القائد الذي يمثلها.\nمن الواضح أن مصادر التأثير السابقة قد تتكامل فيما بينها؛ فقد يؤدي استخدام الحوافز الإيجابية إلى زيادة الانتماء.\n\n[نشاط تطبيقي]\n- اذكر مواقف قيادية مختلفة من سيرة نبينا محمد ﷺ ظهرت فيها قوة التأثير على أصحابه رضوان الله عليهم، ثم اعرض على زملائك ما توصلت إليه."}, {"page": 77, "section": "4-3 أدوات التوجيه (القيادة)", "text": "الهدف الثالث: أن يكون الطلبة قادرين على المقارنة بين أنماط القيادة الإدارية.\n\nأنماط القيادة الإدارية (Styles of Leadership):\n1. القيادة التسلطية (Autocratic).\n2. القيادة الديمقراطية (Democratic).\n3. النمط الإسلامي للقيادة الإدارية.\n\nلعل أهم ما يميز موضوع القيادة الإدارية هو كثرة ما كتب عنه وتنوعه، وبصفة خاصة في مجال تحديد الأنماط القيادية التي يمكن أن يتخذها القادة في المواقف المختلفة.\n\n1. القيادة التسلطية (Autocratic):\nيقوم القائد في هذا النمط بكل العمل، ويتخذ القرارات بنفسه دون الرجوع إلى مرؤوسيه، ولا يقر بأخطائه.\nولا شك أن هذا النمط في القيادة لا يصلح أن يكون منهجًا دائمًا وأسلوبًا قويمًا للعمل، لأنه لا يولد إلا الكراهية والحقد بين أفرادا لمجموعة، وبالرغم من ذلك فإن هذه الأسلوب قد يصلح في مواقف طارئة، وظروف محددة تحتاج إلى حزم وقوة من القائد لكي يحسم الأمور، وينقذ الموقف دون الرجوع إلى مجموعته.\n\n2. القيادة الديمقراطية (Democratic):\nوهو أكثر الأنماط شيوعًا اليوم، ويستشير القائد في هذا النمط مرؤوسيه، ويتناقش معهم في كل الأمور، ويكسب تأييدهم وحماسهم نحو آرائه، كما أنه ينمي فيهم روح الفريق والحماس نحو أداء العمل بأفضل صورة في إطار منافسة شريفة.\n\n3. النمط الإسلامي للقيادة الإدارية:\nيتميز النمط الإسلامي للقيادة الإدارية بالتوسط والاعتدال، فهو ليس نمطًا متسلطًا، كما أنه ليس نمطًا متسيبًا، وهو تشاوري، ويعتمد تحقيق الأهداف المرسومة عن طريق الإقناع والتعاون مع الأفراد.\nبدأت القيادة في الإسلام مع بعثة الرسول ﷺ، وتوسّع مفهوم القيادة ومجالاتها بعد هجرته ﷺ إلى المدينة المنورة، ثم جاء من بعده الخلفاء الراشدون رضي الله عنهم، وتأسّوا به، وتوسّعت مجالات القيادة توسعًا أكبر مع توسّع رقعة الإسلام.\n\nوللقيادة في الإسلام عدد من المبادئ التي تقوم عليها؛ ومنها:\n- الشورى: قال تعالى: ﴿وَأَمْرُهُمْ شُورَىٰ بَيْنَهُمْ﴾ [الشورى: 38].\n- الأسوة الحسنة: قال تعالى: ﴿لَقَدْ كَانَ لَكُمْ فِي رَسُولِ اللَّهِ أُسْوَةٌ حَسَنَةٌ﴾ [الأحزاب: 21].\n- الإيثار والإخاء: قال تعالى: ﴿وَيُؤْثِرُونَ عَلَىٰ أَنفُسِهِمْ وَلَوْ كَانَ بِهِمْ خَصَاصَةٌ﴾ [الحشر: 9].\n- البر والرحمة: قال تعالى: ﴿مُحَمَّدٌ رَّسُولُ اللَّهِ وَالَّذِينَ مَعَهُ أَشِدَّاءُ عَلَى الْكُفَّارِ رُحَمَاءُ بَيْنَهُمْ﴾ [الفتح: 29]."}, {"page": 78, "section": "4-3 أدوات التوجيه (القيادة)", "text": "- الكفاءة والمهارة: حيث يهتم القائد المسلم بمبدأ المهارة والكفاءة في إسناد المهام، وعن الرسول ﷺ أنه قال يوم خيبر: \"لأعطين الراية غدًا رجلاً يفتح الله على يديه، يحبّ الله ورسوله، ويحبّه الله ورسوله\" [البخاري، 3009].\n\n[نشاط تطبيقي]\n- من خلال تمثيل الأدوار على شكل مجموعات يلعب أحد الطلاب دور القائد، ويمثل بقية طلاب المجموعة دور المرؤوسين (الموظفين)، ويحدد لهذه المجموعة مهمة لإنجازها، ويصدر القائد مجموعة من الأوامر لتنفيذ العمل، يرصد الطلاب المرؤوسين الأوامر المقدمة لهم، يوجهون نقدًا، لهذه الأوامر، ويحددون نمط تلك القيادة، بعد الانتهاء من إنجاز النشاط.\n\n[نشاطات مقترحة]\n- من خلال قيادتك لفريقك التطوعي؛ حدد نمط القيادة الأنسب، وما أهم المهارات التي تحتاج إلى تطويرها؟"}, {"page": 79, "section": "4-3 أدوات التوجيه (القيادة)", "text": "التقويم\nأجب عن الأسئلة الآتية:\n- اذكر مفهوم القيادة.\n- عدد أنماط القيادة.\n- ما أهم المهارات التي يحتاجها القائد؟"}, {"page": 80, "section": "المشروعات", "text": "المشروعات\n\nالمشروع الأول:\nعنوان المشروع: مقابلة قائد.\nهدف المشروع: التعرف على أهم صفات ومهارات القائد.\nالفكرة: قم بزيارة إحدى القيادات في إحدى المنظمات واطرح عليها التساؤلات التالية:\n- كيف أصبحت قائدًا؟\n- ما أهم المهارات التي يجب أن يتصف بها القائد؟\n- ما أبرز المواقف الناجحة التي مررت بها؟\n- ما أبرز التحديات التي واجهتها في مسيرتك؟\n- ما هي توجيهاتك لي كقائد مستقبلي؟\nثم قدمها في عرض تقديمي لزملائك في الفصل.\n\nالمشروع الثاني:\nعنوان المشروع: الحوافز الحديثة.\nهدف المشروع: الاطلاع على الممارسات الحديثة في التحفيز.\nالفكرة: من خلال البحث في مصادر التعلم قدم تقريرًا عن أبرز الممارسات الحديثة في تحفيز الموظفين مع ذكر أمثلة على المنظمات التي تطبق هذه الممارسات."}, {"page": 81, "section": "المشروعات", "text": "المشروع الثالث:\nعنوان المشروع: وظيفة المستقبل.\nهدف المشروع: تطوير المهارات الوظيفية.\nالفكرة: اختر إحدى الوظائف التي ترغب الالتحاق بها مستقبلاً، وحدد المهارات الوظيفية التي تتطلبها هذه الوظيفة، ثم ضع خطة تدريبية لبناء المهارات الحديثة متضمنة تدريبًا داخليًّا وخارجيًّا، ثم اعرضها على أحد الناجحين في تلك الوظيفة لتقييم الخطة التدريبية."}];

/* ---------- Arabic normalisation & local search ---------- */
function norm(s){
  return String(s||'').normalize('NFKC')
    .replace(/[ً-ٰٟۖ-ۭـ]/g,'')
    .replace(/[أإآٱ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي')
    .replace(/[^ء-يa-zA-Z0-9\s]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
}
const STOP = new Set('في من على الى عن ما ماذا هل هو هي هم ان او ثم مع كل التي الذي الذين هذا هذه ذلك تلك لا لم لن قد كان يكون تكون اي بين عند حيث كما و ب ل ف ك يعد تعد يتم اذا وهي وهو'.split(' '));
function stem(w){
  let t=w;
  if(t.length>4 && /^(وال|بال|كال|فال)/.test(t)) t=t.slice(3);
  else if(t.length>3 && t.startsWith('ال')) t=t.slice(2);
  else if(t.length>3 && /^[وبفل]/.test(t) && !STOP.has(t)) t=t.slice(1);
